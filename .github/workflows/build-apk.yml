name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo apt-get clean

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Chatbot ZIP
        run: |
          pip install gdown
          gdown 'https://drive.google.com/uc?id=1_GJVvaM2wKXFAo6mDaaOIpVBhrjAQ7Uf' -O bot.zip
          unzip -o bot.zip -d bot_extracted/

      - name: Prepare Python Source Code
        run: |
          mkdir -p python_source
          CHATBOT_DIR=$(find bot_extracted/ -name "李尔.py" -exec dirname {} \; | head -1)
          cp -v "$CHATBOT_DIR"/*.py python_source/
          cp -v "$CHATBOT_DIR"/*.json python_source/
          
          # 中文文件名转义
          cd python_source
          python3 -c '
          import re, os
          RENAME_MODULES = {"李尔": "lear_main", "单词": "chatbot_words", "数据": "chatbot_data", "成语": "chatbot_idioms"}
          FILE_RENAME = {"字向量_f16_pure.json": "word_vectors.json", "李尔.py": "lear_main.py", "单词.py": "chatbot_words.py", "数据.py": "chatbot_data.py", "成语.py": "chatbot_idioms.py"}

          contents = {}
          for cn, en in RENAME_MODULES.items():
              src = cn + ".py"
              if os.path.exists(src):
                  with open(src, "r", encoding="utf-8") as f: contents[en] = f.read()
                  os.remove(src)

          def replace_all(content):
              for cn_fn, en_fn in FILE_RENAME.items(): content = content.replace(cn_fn, en_fn)
              for cn, en in RENAME_MODULES.items():
                  content = re.sub(r"(?m)^(\s*)import " + cn + r"\s*$", r"\1import " + en + " as " + cn, content)
                  content = re.sub(r"(?m)^(\s*)import " + cn + r" as ", r"\1import " + en + " as ", content)
                  content = re.sub(r"(?m)^(\s*)from " + cn + r" import", r"\1from " + en + " import", content)
                  content = re.sub(r"(\s)import " + cn + r"(\s|$)", r"\1import " + en + " as " + cn + r"\2", content)
              return content

          for en, content in contents.items():
              with open(en + ".py", "w", encoding="utf-8") as f: f.write(replace_all(content))
          for cn_fn, en_fn in FILE_RENAME.items():
              if cn_fn.endswith(".json") and os.path.exists(cn_fn): os.rename(cn_fn, en_fn)
          for fname in os.listdir("."):
              if fname.endswith(".py") and not any(fname == en + ".py" for en in RENAME_MODULES.values()):
                  with open(fname, "r", encoding="utf-8") as f: content = f.read()
                  new_content = replace_all(content)
                  if new_content != content:
                      with open(fname, "w", encoding="utf-8") as f: f.write(new_content)
          '
          
          # 注入极限单线程优化防卡死
          python3 -c '
          import os, re
          for fname in os.listdir("."):
              if not fname.endswith(".py"): continue
              with open(fname, "r", encoding="utf-8") as f: content = f.read()
              new_content = content
              new_content = re.sub(r"self\.use_parallel\s*=\s*.+", "self.use_parallel = False", new_content)
              new_content = re.sub(r"self\.max_workers\s*=\s*.+", "self.max_workers = 1", new_content)
              new_content = new_content.replace("self._index_ready_event.wait()", "self._index_ready_event.wait(timeout=15.0)")
              if new_content != content:
                  with open(fname, "w", encoding="utf-8") as f: f.write(new_content)
          '
          cd ..

      - name: Generate Native Android Project (Java + XML + Chaquopy)
        run: |
          echo "==== 开始凭空生成原生 Android Studio 工程 ===="
          mkdir -p NativeApp
          cd NativeApp

          # 先创建一个空的 settings.gradle 骗过 Gradle 降级机制
          touch settings.gradle
          gradle wrapper --gradle-version 8.1.1
          
          echo "==== 降级环境生成完毕，开始写入真实现代化配置 ===="

          # 1. 根目录 settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { gradlePluginPortal(); google(); mavenCentral() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LearNative"
          include ':app'
          EOF

          # 2. 根目录 build.gradle (核心修复：彻底抛弃 classpath，采用现代化 plugins 声明)
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.1' apply false
              id 'com.chaquo.python' version '15.6.0' apply false
          }
          EOF

          # 3. APP 目录搭建
          mkdir -p app/src/main/java/com/lear/chatbot
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/python

          # 4. APP 模块 build.gradle
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'com.chaquo.python'
          }
          android {
              namespace 'com.lear.chatbot'
              compileSdk 34
              defaultConfig {
                  applicationId "com.lear.chatbot"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "4.0 Native"
                  ndk { abiFilters "arm64-v8a" }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          chaquopy {
              defaultConfig {
                  version = "3.10"
                  buildPython("/usr/bin/python3")
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.1'
          }
          EOF

          # 5. AndroidManifest
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:allowBackup="true"
                  android:label="李尔"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. 界面 XML 布局
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="bg_color">#F2F2F7</color>
              <color name="accent_color">#007AFF</color>
          </resources>
          EOF

          cat > app/src/main/res/drawable/bg_input.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#F2F2F7"/><corners android:radius="20dp"/></shape>
          EOF
          cat > app/src/main/res/drawable/bg_bot.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#FFFFFF"/><corners android:radius="16dp" android:bottomLeftRadius="4dp"/></shape>
          EOF
          cat > app/src/main/res/drawable/bg_user.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/accent_color"/><corners android:radius="16dp" android:bottomRightRadius="4dp"/></shape>
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@color/bg_color">
              <TextView android:text="李尔" android:layout_width="match_parent" android:layout_height="56dp" android:gravity="center" android:textSize="18sp" android:textStyle="bold" android:background="#FFFFFF" android:textColor="#000000" android:elevation="2dp"/>
              <androidx.recyclerview.widget.RecyclerView android:id="@+id/recycler" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:padding="10dp" android:clipToPadding="false"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="10dp" android:background="#FFFFFF" android:elevation="8dp">
                  <EditText android:id="@+id/input" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:background="@drawable/bg_input" android:padding="12dp" android:hint="输入消息..." android:textColor="#000000" android:maxLines="4" android:maxHeight="120dp"/>
                  <Button android:id="@+id/btnSend" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="发送" android:layout_marginStart="10dp" android:backgroundTint="@color/accent_color" android:textColor="#FFFFFF"/>
              </LinearLayout>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/item_bot.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:paddingTop="5dp" android:paddingBottom="5dp">
              <TextView android:id="@+id/text" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_bot" android:textColor="#000000" android:padding="12dp" android:textSize="16sp" android:maxWidth="280dp" android:textIsSelectable="true"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/item_user.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:paddingTop="5dp" android:paddingBottom="5dp" android:gravity="end">
              <TextView android:id="@+id/text" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_user" android:textColor="#FFFFFF" android:padding="12dp" android:textSize="16sp" android:maxWidth="280dp" android:textIsSelectable="true"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/item_sys.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:paddingTop="5dp" android:paddingBottom="5dp" android:gravity="center">
              <TextView android:id="@+id/text" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#888888" android:textSize="13sp" android:padding="8dp"/>
          </LinearLayout>
          EOF

          # 7. 原生 Java 核心逻辑
          cat > app/src/main/java/com/lear/chatbot/MainActivity.java << 'EOF'
          package com.lear.chatbot;
          import android.os.Bundle;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.TextView;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.chaquo.python.PyObject;
          import com.chaquo.python.Python;
          import com.chaquo.python.android.AndroidPlatform;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              private RecyclerView recycler;
              private ChatAdapter adapter;
              private List<Message> messages;
              private EditText input;
              private Button btnSend;
              private PyObject pyWrapper;
              private String sessionId = "";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  if (!Python.isStarted()) {
                      Python.start(new AndroidPlatform(this));
                  }
                  Python py = Python.getInstance();
                  pyWrapper = py.getModule("lear_wrapper");

                  messages = new ArrayList<>();
                  adapter = new ChatAdapter(messages);
                  recycler = findViewById(R.id.recycler);
                  recycler.setLayoutManager(new LinearLayoutManager(this));
                  recycler.setAdapter(adapter);

                  input = findViewById(R.id.input);
                  btnSend = findViewById(R.id.btnSend);

                  btnSend.setOnClickListener(v -> sendMessage());
                  initSession();
              }

              private void initSession() {
                  new Thread(() -> {
                      try {
                          String res = pyWrapper.callAttr("start_session").toString();
                          JSONObject json = new JSONObject(res);
                          sessionId = json.optString("session_id", "");
                          JSONArray msgs = json.optJSONArray("messages");
                          if (msgs != null) {
                              for (int i = 0; i < msgs.length(); i++) {
                                  String txt = msgs.getString(i);
                                  addMessage(new Message(txt, false, isSystemMsg(txt)));
                              }
                          }
                      } catch (Exception e) {
                          addMessage(new Message("【引擎预热失败】\n" + e.getMessage(), false, true));
                      }
                  }).start();
              }

              private void sendMessage() {
                  String text = input.getText().toString().trim();
                  if (text.isEmpty()) return;
                  input.setText("");
                  addMessage(new Message(text, true, false));

                  btnSend.setEnabled(false);
                  btnSend.setText("...");

                  new Thread(() -> {
                      try {
                          String res = pyWrapper.callAttr("process_message", text, sessionId).toString();
                          JSONObject json = new JSONObject(res);
                          sessionId = json.optString("session_id", sessionId);
                          JSONArray replies = json.optJSONArray("replies");
                          if (replies != null) {
                              for (int i = 0; i < replies.length(); i++) {
                                  String txt = replies.getString(i);
                                  addMessage(new Message(txt, false, isSystemMsg(txt)));
                              }
                          }
                      } catch (Exception e) {
                          addMessage(new Message("【错误】\n" + e.getMessage(), false, true));
                      } finally {
                          runOnUiThread(() -> {
                              btnSend.setEnabled(true);
                              btnSend.setText("发送");
                          });
                      }
                  }).start();
              }

              private boolean isSystemMsg(String text) {
                  return text.startsWith("【") && text.endsWith("】");
              }

              private void addMessage(Message m) {
                  runOnUiThread(() -> {
                      messages.add(m);
                      adapter.notifyItemInserted(messages.size() - 1);
                      recycler.scrollToPosition(messages.size() - 1);
                      
                      // 自动识别会话结束并彻底锁定输入框
                      if (m.isSystem && (m.text.contains("退出") || m.text.contains("结束") || m.text.contains("离开") || m.text.contains("终止"))) {
                          input.setEnabled(false);
                          btnSend.setEnabled(false);
                          input.setHint("会话已结束");
                      }
                  });
              }
          }

          class Message {
              String text; boolean isUser; boolean isSystem;
              Message(String text, boolean isUser, boolean isSystem) {
                  this.text = text; this.isUser = isUser; this.isSystem = isSystem;
              }
          }

          class ChatAdapter extends RecyclerView.Adapter<RecyclerView.ViewHolder> {
              List<Message> msgs;
              ChatAdapter(List<Message> msgs) { this.msgs = msgs; }

              @Override public int getItemViewType(int position) {
                  Message m = msgs.get(position);
                  return m.isSystem ? 2 : (m.isUser ? 1 : 0);
              }

              @NonNull @Override public RecyclerView.ViewHolder onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
                  int layout = viewType == 1 ? R.layout.item_user : (viewType == 2 ? R.layout.item_sys : R.layout.item_bot);
                  View v = LayoutInflater.from(parent.getContext()).inflate(layout, parent, false);
                  return new Holder(v);
              }

              @Override public void onBindViewHolder(@NonNull RecyclerView.ViewHolder holder, int position) {
                  ((Holder)holder).text.setText(msgs.get(position).text);
              }
              @Override public int getItemCount() { return msgs.size(); }

              static class Holder extends RecyclerView.ViewHolder {
                  TextView text;
                  Holder(View v) { super(v); text = v.findViewById(R.id.text); }
              }
          }
          EOF

          # 8. 拷贝 Python 源码并创建桥接器
          cp -r ../python_source/* app/src/main/python/
          cat > app/src/main/python/lear_wrapper.py << 'EOF'
          import os, sys, json, traceback
          APP_DIR = os.path.dirname(os.path.abspath(__file__))
          os.chdir(APP_DIR)
          if APP_DIR not in sys.path: sys.path.insert(0, APP_DIR)

          import lear_main as bot

          def start_session():
              try:
                  res = bot.web_start_session()
                  return json.dumps(res, ensure_ascii=False)
              except Exception as e:
                  return json.dumps({"error": traceback.format_exc()}, ensure_ascii=False)

          def process_message(text, session_id):
              try:
                  res = bot.web_process_message(text, session_id)
                  return json.dumps(res, ensure_ascii=False)
              except Exception as e:
                  return json.dumps({"error": traceback.format_exc()}, ensure_ascii=False)
          EOF

      - name: Build Native Android APK using Gradle
        run: |
          cd NativeApp
          ./gradlew assembleDebug

      - name: Upload Native APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 李尔聊天机器人-原生极速版-APK
          path: NativeApp/app/build/outputs/apk/debug/*.apk
          retention-days: 30
