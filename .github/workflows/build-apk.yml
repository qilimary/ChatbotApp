                Thread(runnable, "lear-python-bridge").apply { priority = Thread.NORM_PRIORITY - 1 }
            }.asCoroutineDispatcher()
            val disk = Executors.newSingleThreadExecutor { runnable ->
                Thread(runnable, "lear-disk").apply { priority = Thread.NORM_PRIORITY - 1 }
            }.asCoroutineDispatcher()
            val scope = CoroutineScope(SupervisorJob() + disk)
            var crashInstalled = false
            fun writeAtomic(file: File, text: String) {
                val atomic = AtomicFile(file)
                val stream = atomic.startWrite()
                try {
                    stream.write(text.toByteArray(Charsets.UTF_8))
                    atomic.finishWrite(stream)
                } catch (error: Exception) {
                    atomic.failWrite(stream)
                    throw error
                }
            }
        }
