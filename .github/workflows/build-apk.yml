name: Build Lear Chatbot APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: lear-chatbot-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CHATBOT_DOWNLOAD_URL: https://drive.google.com/file/d/1azboldNeSQP3SfHi08FrOvkTBHxFGKWu/view?usp=drivesdk

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo apt-get clean
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preserve app signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lear-chatbot-debug-signing-v1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install download tool
        run: python -m pip install --disable-pip-version-check "gdown==5.2.0"
      - name: Download and verify chatbot package
        run: |
          set -euo pipefail
          gdown --no-cookies --fuzzy "$CHATBOT_DOWNLOAD_URL" -O chatbot.zip
          unzip -t chatbot.zip >/dev/null
          echo "下载包校验值：$(sha256sum chatbot.zip | cut -d ' ' -f 1)"
          rm -rf chatbot_extract
          unzip -q -o chatbot.zip -d chatbot_extract
      - name: Extract chatbot files
        run: |
          set -euo pipefail
          CHATBOT_FILE=""
          for candidate in 'LiEr_fixed.py' '李尔.py'; do
            CHATBOT_FILE="$(find chatbot_extract -type f -name "$candidate" -print -quit)"
            if [ -n "$CHATBOT_FILE" ]; then
              break
            fi
          done
          if [ -z "$CHATBOT_FILE" ]; then
            echo '未在压缩包中找到 LiEr_fixed.py 或 李尔.py' >&2
            exit 1
          fi
          CHATBOT_DIR="$(dirname "$CHATBOT_FILE")"
          find "$CHATBOT_DIR" -maxdepth 1 -type f \
            \( -name '*.py' -o -name '*.json' -o -name '*.pkl' \) \
            ! -name 'LiEr_fixed.py' \
            -exec cp -f {} . \;
          if [ -s 'LiEr_fixed.py' ]; then
            echo '使用仓库根目录中的 LiEr_fixed.py'
            cp -f 'LiEr_fixed.py' '李尔.py'
          else
            cp -f "$CHATBOT_FILE" '李尔.py'
          fi
          rm -f 'LiEr_fixed.py'
          for required_file in \
            '李尔.py' '单词.py' '成语.py' '数据.py' \
            '字向量_f16_pure.json' 'inverted_index_bm25.pkl' \
            'index_meta_bm25.json' 'corpus_vectors_cache.pkl'; do
            if [ ! -s "$required_file" ]; then
              echo "聊天包缺少必要文件：$required_file" >&2
              exit 1
            fi
          done
      - name: Rename Chinese filenames to ASCII
        run: |
          python3 - <<'PYEOF'
          import os
          import re
          RENAME_MODULES = {
              "李尔": "lear_main",
              "单词": "chatbot_words",
              "数据": "chatbot_data",
              "成语": "chatbot_idioms",
          }
          FILE_RENAME = {
              "字向量_f16_pure.json": "word_vectors.json",
              "李尔.py": "lear_main.py",
              "单词.py": "chatbot_words.py",
              "数据.py": "chatbot_data.py",
              "成语.py": "chatbot_idioms.py",
          }
          def replace_all(content):
              for chinese_filename, ascii_filename in FILE_RENAME.items():
                  content = content.replace(chinese_filename, ascii_filename)
              for chinese_module, ascii_module in RENAME_MODULES.items():
                  content = re.sub(
                      rf"(?m)^(\s*)import {re.escape(chinese_module)}\s*$",
                      rf"\1import {ascii_module} as {chinese_module}",
                      content,
                  )
                  content = re.sub(
                      rf"(?m)^(\s*)import {re.escape(chinese_module)} as ",
                      rf"\1import {ascii_module} as ",
                      content,
                  )
                  content = re.sub(
                      rf"(?m)^(\s*)from {re.escape(chinese_module)} import",
                      rf"\1from {ascii_module} import",
                      content,
                  )
                  content = re.sub(
                      rf"(\s)import {re.escape(chinese_module)}(\s|$)",
                      rf"\1import {ascii_module} as {chinese_module}\2",
                      content,
                  )
              return content
          cached_modules = {}
          for chinese_module, ascii_module in RENAME_MODULES.items():
              source = chinese_module + ".py"
              if os.path.exists(source):
                  with open(source, "r", encoding="utf-8") as file:
                      cached_modules[ascii_module] = file.read()
                  os.remove(source)
          for ascii_module, content in cached_modules.items():
              with open(ascii_module + ".py", "w", encoding="utf-8", newline="\n") as file:
                  file.write(replace_all(content))
          for chinese_filename, ascii_filename in FILE_RENAME.items():
              if chinese_filename.endswith((".json", ".pkl")) and os.path.exists(chinese_filename):
                  os.replace(chinese_filename, ascii_filename)
          generated_modules = {name + ".py" for name in RENAME_MODULES.values()}
          for filename in os.listdir("."):
              if not filename.endswith(".py") or filename in generated_modules:
                  continue
              with open(filename, "r", encoding="utf-8") as file:
                  original = file.read()
              updated = replace_all(original)
              if updated != original:
                  with open(filename, "w", encoding="utf-8", newline="\n") as file:
                      file.write(updated)
          if not os.path.exists("lear_main.py"):
              raise SystemExit("重命名失败：lear_main.py 不存在")
          PYEOF
      - name: Auto-patch source code
        run: |
          python3 - <<'PYEOF'
          import re

          filename = "lear_main.py"
          with open(filename, "r", encoding="utf-8") as file:
              content = file.read()
          updated = re.sub(
              r"cleaned\s*=\s*normalize_output_for_environment\([^\n]*\)",
              "cleaned = text",
              content,
          )
          updated = updated.replace(
              "r'.*?[。？！…]|.+$'",
              "r'(?s:.*?[。？！…]|.+$)'",
          )
          updated = updated.replace(
              'r".*?[。？！…]|.+$"',
              'r"(?s:.*?[。？！…]|.+$)"',
          )
          updated = re.sub(
              r"get_sentence_vector\(([^,\n]+),\s*sim_calc\.char_idf\)",
              r"get_sentence_vector(\1)",
              updated,
          )
          if "def visible_len" in updated:
              updated = re.sub(
                  r"if len\(part\)\s*<\s*min_len:",
                  "if visible_len(part) < min_len:",
                  updated,
              )
          updated = re.sub(
              r"self\.is_web_mode\s*=\s*not\s*\([^\n]*\)",
              "self.is_web_mode = True",
              updated,
          )
          if updated != content:
              with open(filename, "w", encoding="utf-8", newline="\n") as file:
                  file.write(updated)
          PYEOF
      - name: Generate Android project
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/lear/chatbot
          mkdir -p app/src/main/res/{layout,values,drawable,mipmap-anydpi}
          mkdir -p app/src/main/assets/chatbot app/src/main/python
          find . -maxdepth 1 -type f \
            \( -name '*.py' -o -name '*.json' -o -name '*.pkl' \) \
            -exec cp -f {} app/src/main/assets/chatbot/ \;
          python3 - <<'PYEOF'
          import hashlib
          from pathlib import Path

          asset_dir = Path("app/src/main/assets/chatbot")
          version_file = asset_dir / "bundle_version.txt"
          digest = hashlib.sha256()
          for path in sorted(
              (item for item in asset_dir.iterdir() if item.is_file() and item != version_file),
              key=lambda item: item.name,
          ):
              digest.update(path.name.encode("utf-8"))
              digest.update(b"\0")
              with path.open("rb") as file:
                  for chunk in iter(lambda: file.read(1024 * 1024), b""):
                      digest.update(chunk)
              digest.update(b"\0")
          version_file.write_text(digest.hexdigest() + "\n", encoding="ascii")
          PYEOF
          cat > app/src/main/python/bootstrap.py <<'PYEOF'
          # -*- coding: utf-8 -*-
          import gc
          import json
          import os
          import sys
          import threading
          import traceback
          _lear_main = None
          _bridge_lock = threading.RLock()
          _call_count = 0
          def _json(value):
              return json.dumps(value, ensure_ascii=False, default=str)
          def _maybe_collect(force=False):
              global _call_count
              _call_count += 1
              if force or _call_count % 12 == 0:
                  gc.collect()
          def _style_message(value):
              text = "" if value is None else str(value)
              style_function = getattr(_lear_main, "apply_text_effects", None)
              if not callable(style_function):
                  return text
              try:
                  return style_function(text)
              except Exception:
                  return text
          def _style_result(result):
              if not isinstance(result, dict):
                  return result
              styled = dict(result)
              for key in ("messages", "replies"):
                  values = styled.get(key)
                  if isinstance(values, (list, tuple)):
                      styled[key] = [_style_message(value) for value in values]
              return styled
          def _drain_queue(queue):
              try:
                  count = len(queue)
              except Exception:
                  count = 0
              if count <= 0:
                  return []
              if hasattr(queue, "popleft"):
                  messages = []
                  for _ in range(count):
                      try:
                          messages.append(queue.popleft())
                      except IndexError:
                          break
                  return messages
              if isinstance(queue, list):
                  messages = queue[:count]
                  del queue[:count]
                  return messages
              messages = list(queue)
              if hasattr(queue, "clear"):
                  queue.clear()
              return messages
          def _clear_runtime_state():
              manager = getattr(_lear_main, "WEB_SESSION_MANAGER", None)
              sessions = getattr(manager, "sessions", None)
              if sessions is not None and hasattr(sessions, "clear"):
                  for session in list(sessions.values()):
                      shutdown = getattr(session, "shutdown", None)
                      if callable(shutdown):
                          try:
                              shutdown()
                          except Exception:
                              pass
                  sessions.clear()
              queue = getattr(_lear_main, "global_async_queue", None)
              if queue is None:
                  _lear_main.global_async_queue = []
              elif hasattr(queue, "clear"):
                  queue.clear()
              else:
                  _lear_main.global_async_queue = []
          def _start_new_session_locked():
              _clear_runtime_state()
              result = _lear_main.web_start_session()
              _maybe_collect(force=True)
              return _style_result(result)
          def init_backend(files_dir):
              global _lear_main
              try:
                  with _bridge_lock:
                      os.chdir(files_dir)
                      if files_dir not in sys.path:
                          sys.path.insert(0, files_dir)
                      if _lear_main is None:
                          import lear_main
                          _lear_main = lear_main
                      return _json(_start_new_session_locked())
              except Exception as error:
                  return _json({"error": str(error), "traceback": traceback.format_exc()})
          def start_new_session():
              if _lear_main is None:
                  return _json({"error": "系统仍在初始化中，请稍后。", "traceback": ""})
              try:
                  with _bridge_lock:
                      return _json(_start_new_session_locked())
              except Exception as error:
                  return _json({"error": str(error), "traceback": traceback.format_exc()})
          def process_message(text, session_id):
              if _lear_main is None:
                  return _json({"error": "系统仍在初始化中，请稍后。", "traceback": ""})
              try:
                  with _bridge_lock:
                      result = _lear_main.web_process_message(text, session_id)
                      _maybe_collect()
                      return _json(_style_result(result))
              except Exception as error:
                  return _json({"error": str(error), "traceback": traceback.format_exc()})
          def poll_async():
              if _lear_main is None:
                  return "[]"
              try:
                  with _bridge_lock:
                      queue = getattr(_lear_main, "global_async_queue", None)
                      if queue is None:
                          return "[]"
                      messages = _drain_queue(queue)
                      return _json([_style_message(message) for message in messages])
              except Exception:
                  return "[]"
          PYEOF
          cat > settings.gradle <<'GRADLE_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "LearChatbot"
          include ':app'
          GRADLE_EOF
          cat > build.gradle <<'GRADLE_EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
              id 'com.chaquo.python' version '15.0.1' apply false
          }
          GRADLE_EOF
          cat > gradle.properties <<'GRADLE_EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          org.gradle.caching=true
          org.gradle.parallel=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          kotlin.incremental=true
          GRADLE_EOF
          cat > local.properties <<'PROPERTIES_EOF'
          sdk.dir=/usr/local/lib/android/sdk
          PROPERTIES_EOF
          cat > app/build.gradle <<'GRADLE_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.chaquo.python'
          }
          android {
              namespace 'com.lear.chatbot'
              compileSdk 34
              buildToolsVersion "34.0.0"
              defaultConfig {
                  applicationId "com.lear.chatbot"
                  minSdk 26
                  targetSdk 34
                  def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
                  versionCode 1000 + runNumber
                  versionName "2.1.${runNumber}"
                  ndk { abiFilters "arm64-v8a" }
                  python { version "3.10" }
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.7.1'
              implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
          }
          GRADLE_EOF
          cat > app/src/main/AndroidManifest.xml <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:largeHeap="true" android:allowBackup="false" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:label="@string/app_name" android:supportsRtl="true" android:theme="@style/Theme.LearChatbot">
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML_EOF
          cat > app/src/main/res/values/strings.xml <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">李尔</string></resources>
          XML_EOF
          cat > app/src/main/res/values/colors.xml <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_color">#F2F2F7</color><color name="white">#FFFFFF</color><color name="black">#0A0A0A</color>
              <color name="accent_blue">#007AFF</color><color name="error_red">#FF3B30</color><color name="user_bubble">#007AFF</color>
              <color name="user_text">#FFFFFF</color><color name="bot_bubble">#FFFFFF</color><color name="bot_text">#1A1A1A</color>
              <color name="gray_text">#8E8E93</color><color name="border_gray">#E0E0E0</color><color name="input_bg">#F2F2F7</color>
          </resources>
          XML_EOF
          cat > app/src/main/res/values/themes.xml <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LearChatbot" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">@color/accent_blue</item><item name="colorPrimaryVariant">@color/accent_blue</item>
                  <item name="colorOnPrimary">@color/white</item><item name="android:statusBarColor">@color/white</item>
                  <item name="android:windowLightStatusBar">true</item><item name="android:windowBackground">@color/bg_color</item>
              </style>
          </resources>
          XML_EOF
          cat > app/src/main/res/layout/activity_main.xml <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.drawerlayout.widget.DrawerLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:id="@+id/drawer_layout" android:layout_width="match_parent" android:layout_height="match_parent">
              <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="@color/bg_color">
                  <RelativeLayout android:layout_width="match_parent" android:layout_height="48dp" android:background="@color/white" android:elevation="2dp">
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="match_parent" android:orientation="horizontal" android:layout_alignParentStart="true">
                          <ImageButton android:id="@+id/btn_menu" android:layout_width="44dp" android:layout_height="match_parent" android:src="@drawable/ic_menu" android:background="?attr/selectableItemBackgroundBorderless" android:contentDescription="菜单" app:tint="@color/black" />
                          <TextView android:id="@+id/btn_font" android:layout_width="44dp" android:layout_height="match_parent" android:text="字体" android:textSize="14sp" android:textColor="@color/black" android:gravity="center" android:background="?attr/selectableItemBackgroundBorderless" android:clickable="true" android:focusable="true" />
                          <TextView android:id="@+id/btn_effect" android:layout_width="44dp" android:layout_height="match_parent" android:text="效果" android:textSize="14sp" android:textColor="@color/black" android:gravity="center" android:background="?attr/selectableItemBackgroundBorderless" android:clickable="true" android:focusable="true" />
                      </LinearLayout>
                      <TextView android:id="@+id/tv_title" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_centerInParent="true" android:text="李尔" android:textSize="16sp" android:textStyle="bold" android:textColor="@color/black" />
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="match_parent" android:orientation="horizontal" android:layout_alignParentEnd="true">
                          <ImageButton android:id="@+id/btn_tts" android:layout_width="44dp" android:layout_height="match_parent" android:src="@drawable/ic_wave" android:background="?attr/selectableItemBackgroundBorderless" android:contentDescription="语音设置" app:tint="@color/black" />
                          <ImageButton android:id="@+id/btn_new_session" android:layout_width="44dp" android:layout_height="match_parent" android:src="@drawable/ic_add" android:background="?attr/selectableItemBackgroundBorderless" android:contentDescription="新对话" app:tint="@color/black" />
                      </LinearLayout>
                  </RelativeLayout>
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/chat_recycler" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:clipToPadding="false" android:paddingStart="8dp" android:paddingEnd="2dp" android:paddingTop="12dp" android:paddingBottom="12dp" app:fastScrollEnabled="true" app:fastScrollVerticalThumbDrawable="@drawable/fastscroll_thumb" app:fastScrollVerticalTrackDrawable="@drawable/fastscroll_track" app:fastScrollHorizontalThumbDrawable="@drawable/fastscroll_thumb" app:fastScrollHorizontalTrackDrawable="@drawable/fastscroll_track" />
                  <ProgressBar android:id="@+id/loading_bar" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="3dp" android:indeterminate="true" android:visibility="gone" android:indeterminateTint="@color/accent_blue" />
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="8dp" android:background="@color/white" android:elevation="4dp" android:gravity="center_vertical">
                      <ImageButton android:id="@+id/btn_image" android:layout_width="40dp" android:layout_height="40dp" android:src="@drawable/ic_image" android:background="?attr/selectableItemBackgroundBorderless" android:contentDescription="上传图片" app:tint="@color/black" />
                      <EditText android:id="@+id/input_message" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="4dp" android:hint="正在加载..." android:textColorHint="@color/gray_text" android:background="@drawable/bg_input" android:paddingStart="14dp" android:paddingEnd="14dp" android:paddingTop="10dp" android:paddingBottom="10dp" android:textSize="15sp" android:textColor="@color/black" android:maxLines="4" android:inputType="textMultiLine|textCapSentences" android:imeOptions="actionSend" android:importantForAutofill="no" />
                      <com.google.android.material.button.MaterialButton android:id="@+id/btn_send" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="8dp" android:text="发送" android:textColor="@color/white" app:backgroundTint="@color/accent_blue" app:cornerRadius="10dp" />
                  </LinearLayout>
              </LinearLayout>
              <LinearLayout android:layout_width="300dp" android:layout_height="match_parent" android:layout_gravity="start" android:orientation="vertical" android:background="@color/white" android:fitsSystemWindows="true">
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp" android:text="最近对话（15条）" android:textSize="18sp" android:textStyle="bold" android:textColor="@color/black" />
                  <View android:layout_width="match_parent" android:layout_height="1dp" android:background="@color/border_gray" />
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/history_recycler" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" />
                  <com.google.android.material.button.MaterialButton android:id="@+id/btn_clear_all" android:layout_width="match_parent" android:layout_height="52dp" android:text="清空所有记录" android:textColor="@color/white" android:insetTop="0dp" android:insetBottom="0dp" app:backgroundTint="@color/error_red" app:cornerRadius="0dp" />
              </LinearLayout>
          </androidx.drawerlayout.widget.DrawerLayout>
          XML_EOF
          cat > app/src/main/res/drawable/fastscroll_thumb.xml <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_pressed="true"><layer-list><item><shape><solid android:color="#00000000"/><size android:width="40dp" android:height="60dp"/></shape></item><item android:gravity="end|center_vertical" android:left="32dp"><shape><solid android:color="#007AFF"/><corners android:radius="4dp"/><size android:width="8dp" android:height="60dp"/></shape></item></layer-list></item>
