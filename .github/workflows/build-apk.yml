name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print env info
        run: |
          uname -a
          df -h /

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java installation
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip python3-pip expect \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev \
            build-essential ccache git libltdl-dev

      - name: Install buildozer and gdown
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv "gdown>=4.7.1" "sh>=2.0,<3.0"
          buildozer version

      - name: Setup Android SDK
        run: |
          echo "==== Install Android SDK ===="
          export JAVA_HOME="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which java))))}"
          java -version 2>&1

          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget --no-verbose https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version

          echo "==== Pre-write license files ===="
          mkdir -p $ANDROID_HOME/licenses
          printf '\n8933bad161af4177641a525b71e2a3b3\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > $ANDROID_HOME/licenses/android-sdk-license
          printf '\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > $ANDROID_HOME/licenses/android-sdk-preview-license
          printf '\n859f317696f67ef3dab8ee7b7e8bf7b6c1aea6e7\n' > $ANDROID_HOME/licenses/android-sdk-arm-dbt-license
          printf '\nd975f751698a77b662f1254ddbeed3901e7635aa\n' > $ANDROID_HOME/licenses/intel-android-extra-license
          printf '\n33b6a2b64607f11b759f320ef9054a8cd123aaa9\n' > $ANDROID_HOME/licenses/google-gdk-license
          printf '\ne9acab5b5fbb560a72cfaecf894e659d05d8a2ab\n' > $ANDROID_HOME/licenses/mips-android-sysimage-license

          echo "==== Accept licenses with expect ===="
          expect -c '
          set timeout 120
          spawn sdkmanager --licenses
          expect {
              -re "y/N" { send "y\r"; exp_continue }
              "All SDK package licenses accepted" { exit 0 }
              eof { exit 0 }
          }' 2>&1 | tail -5 || true

          echo "==== Install SDK packages ===="
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" 2>&1 | tail -10
          sdkmanager "tools" 2>&1 | tail -5

      - name: Patch legacy sdkmanager
        run: |
          BUILD_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$(dirname "$BUILD_DIR")"
          if [ -L "$BUILD_DIR" ] || [ -d "$BUILD_DIR" ]; then
            rm -rf "$BUILD_DIR"
          fi
          ln -s "$ANDROID_HOME" "$BUILD_DIR"

          LEGACY_SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          cat > /tmp/sdkmanager_wrapper.sh << 'WRAPPER'
          #!/bin/bash
          REAL_SDKMANAGER="$(dirname "$(dirname "$(dirname "$0")")")/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$REAL_SDKMANAGER" ]; then
              exec "$REAL_SDKMANAGER" "$@"
          else
              echo "ERROR" >&2
              exit 1
          fi
          WRAPPER
          chmod +x /tmp/sdkmanager_wrapper.sh
          cp /tmp/sdkmanager_wrapper.sh "$LEGACY_SDKMANAGER" 2>/dev/null || sudo cp /tmp/sdkmanager_wrapper.sh "$LEGACY_SDKMANAGER"
          chmod +x "$LEGACY_SDKMANAGER"

          LEGACY_AVDMANAGER="$ANDROID_HOME/tools/bin/avdmanager"
          cat > /tmp/avdmanager_wrapper.sh << 'WRAPPER2'
          #!/bin/bash
          REAL_AVDMANAGER="$(dirname "$(dirname "$(dirname "$0")")")/cmdline-tools/latest/bin/avdmanager"
          if [ -x "$REAL_AVDMANAGER" ]; then
              exec "$REAL_AVDMANAGER" "$@"
          else
              exit 1
          fi
          WRAPPER2
          chmod +x /tmp/avdmanager_wrapper.sh
          cp /tmp/avdmanager_wrapper.sh "$LEGACY_AVDMANAGER" 2>/dev/null || sudo cp /tmp/avdmanager_wrapper.sh "$LEGACY_AVDMANAGER"
          chmod +x "$LEGACY_AVDMANAGER"

      - name: Cache NDK and p4a
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-ndk-r25b
            ~/.buildozer/android/platform/python-for-android
            /home/runner/.local/share/python-for-android
          key: ndk-p4a-v14-${{ runner.os }}

      - name: Pre-clone python-for-android master
        run: |
          git clone --depth=1 -b master https://github.com/kivy/python-for-android.git /home/runner/work/python-for-android
          cd /home/runner/work/python-for-android
          git log --oneline -1

      - name: Download chatbot zip
        run: |
          gdown 'https://drive.google.com/uc?id=1_GJVvaM2wKXFAo6mDaaOIpVBhrjAQ7Uf' -O 机器人.zip
          unzip -q -o 机器人.zip -d 机器人解压/

      - name: Extract chatbot files
        run: |
          CHATBOT_DIR=$(find 机器人解压/ -name "李尔.py" -exec dirname {} \; | head -1)
          cp -v "$CHATBOT_DIR"/*.py .
          cp -v "$CHATBOT_DIR"/*.json .

      - name: Rename Chinese filenames to ASCII
        run: |
          python3 -c '
          import re, os
          RENAME_MODULES = {"李尔": "lear_main", "单词": "chatbot_words", "数据": "chatbot_data", "成语": "chatbot_idioms"}
          FILE_RENAME = {"字向量_f16_pure.json": "word_vectors.json", "李尔.py": "lear_main.py", "单词.py": "chatbot_words.py", "数据.py": "chatbot_data.py", "成语.py": "chatbot_idioms.py"}

          contents = {}
          for cn, en in RENAME_MODULES.items():
              src = cn + ".py"
              if os.path.exists(src):
                  with open(src, "r", encoding="utf-8") as f:
                      contents[en] = f.read()
                  os.remove(src)

          def replace_all(content):
              for cn_fn, en_fn in FILE_RENAME.items():
                  content = content.replace(cn_fn, en_fn)
              for cn, en in RENAME_MODULES.items():
                  content = re.sub(r"(?m)^(\s*)import " + cn + r"\s*$", r"\1import " + en + " as " + cn, content)
                  content = re.sub(r"(?m)^(\s*)import " + cn + r" as ", r"\1import " + en + " as ", content)
                  content = re.sub(r"(?m)^(\s*)from " + cn + r" import", r"\1from " + en + " import", content)
                  content = re.sub(r"(\s)import " + cn + r"(\s|$)", r"\1import " + en + " as " + cn + r"\2", content)
                  content = re.sub(r"(\s)import " + cn + r" as ", r"\1import " + en + " as ", content)
                  content = re.sub(r"(\s)from " + cn + r" import", r"\1from " + en + " import", content)
              return content

          for en, content in contents.items():
              with open(en + ".py", "w", encoding="utf-8") as f:
                  f.write(replace_all(content))

          for cn_fn, en_fn in FILE_RENAME.items():
              if cn_fn.endswith(".json") and os.path.exists(cn_fn):
                  os.rename(cn_fn, en_fn)

          for fname in os.listdir("."):
              if fname.endswith(".py") and not any(fname == en + ".py" for en in RENAME_MODULES.values()):
                  with open(fname, "r", encoding="utf-8") as f:
                      content = f.read()
                  new_content = replace_all(content)
                  if new_content != content:
                      with open(fname, "w", encoding="utf-8") as f:
                          f.write(new_content)
          '

      # =========================================================================
      # 【终极优化：动态注入 GZIP 与最高缓存压缩机制，将 640M 数据缩至 30M！】
      # =========================================================================
      - name: Extreme Code Optimizations (Memory & Storage)
        run: |
          python3 -c '
          import os, re

          for fname in os.listdir("."):
              if not fname.endswith(".py"): continue
              with open(fname, "r", encoding="utf-8") as f:
                  content = f.read()

              new_content = content
              
              # 1. 强制破坏多进程开启条件，单线程更顺畅
              new_content = re.sub(r"self\.use_parallel\s*=\s*use_parallel", "self.use_parallel = False", new_content)
              new_content = re.sub(r"self\.max_workers\s*=\s*.+", "self.max_workers = 1", new_content)
              
              # 2. 增加超时防护
              new_content = new_content.replace("self._index_ready_event.wait()", "self._index_ready_event.wait(timeout=15.0)")

              # 3. 拦截 pickle，强制开启 HIGHEST_PROTOCOL (数据体积剧减) + GZIP (极限压缩)
              if "import pickle" in new_content:
                  injection = "import pickle\nimport gzip\n_original_dump = pickle.dump\ndef _optimized_dump(obj, file, protocol=None, **kwargs):\n    return _original_dump(obj, file, protocol=pickle.HIGHEST_PROTOCOL, **kwargs)\npickle.dump = _optimized_dump\n"
                  new_content = new_content.replace("import pickle", injection)
                  
                  # 将读写文件操作全部替换为 gzip 格式
                  new_content = new_content.replace("open(index_cache_path, \x27wb\x27)", "gzip.open(index_cache_path + \x27.gz\x27, \x27wb\x27)")
                  new_content = new_content.replace("open(index_cache_path, \x27rb\x27)", "gzip.open(index_cache_path + \x27.gz\x27, \x27rb\x27)")
                  new_content = new_content.replace("os.path.exists(index_cache_path)", "os.path.exists(index_cache_path + \x27.gz\x27)")
                  
                  new_content = new_content.replace("open(vec_cache_path, \x27wb\x27)", "gzip.open(vec_cache_path + \x27.gz\x27, \x27wb\x27)")
                  new_content = new_content.replace("open(vec_cache_path, \x27rb\x27)", "gzip.open(vec_cache_path + \x27.gz\x27, \x27rb\x27)")
                  new_content = new_content.replace("os.path.exists(vec_cache_path)", "os.path.exists(vec_cache_path + \x27.gz\x27)")

              if new_content != content:
                  with open(fname, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"✅ Extreme optimization patched in {fname}")
          '

      - name: Generate main.py (Ultimate UI & GC)
        run: |
          python3 -c '
          code = """# -*- coding: utf-8 -*-
          import os, sys, traceback, threading, json, time, re, gc

          APP_DIR = os.path.dirname(os.path.abspath(__file__))
          os.chdir(APP_DIR)
          if APP_DIR not in sys.path:
              sys.path.insert(0, APP_DIR)

          HISTORY_FILE = os.path.join(APP_DIR, "chat_history.json")
          SETTINGS_FILE = os.path.join(APP_DIR, "settings.json")

          INIT_ERROR = None
          chatbot = None

          try:
              import lear_main as 李尔
              chatbot = 李尔
          except Exception as e:
              INIT_ERROR = traceback.format_exc()

          from kivy.app import App
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.gridlayout import GridLayout
          from kivy.uix.floatlayout import FloatLayout
          from kivy.uix.scrollview import ScrollView
          from kivy.uix.label import Label
          from kivy.uix.textinput import TextInput
          from kivy.uix.button import Button
          from kivy.core.window import Window
          from kivy.graphics import Color, RoundedRectangle, Rectangle
          from kivy.metrics import dp
          from kivy.clock import Clock, mainthread
          from kivy.animation import Animation
          from kivy.uix.behaviors import ButtonBehavior
          from kivy.uix.popup import Popup
          from kivy.uix.slider import Slider
          from kivy.properties import NumericProperty

          Window.softinput_mode = "pan"
          Window.clearcolor = (0.95, 0.95, 0.95, 1)

          CJK_FONT = "Roboto"
          for _fp in ["/system/fonts/DroidSansFallback.ttf","/system/fonts/NotoSansCJK-Regular.ttc","/system/fonts/NotoSerifCJK-Regular.ttc","/system/fonts/NotoColorEmoji.ttf","/usr/share/fonts/truetype/chinese/NotoSansSC-Regular.ttf"]:
              if os.path.exists(_fp):
                  CJK_FONT = _fp
                  break

          COLOR_USER_BG = (0.29, 0.56, 0.89, 1)
          COLOR_BOT_BG = (1, 1, 1, 1)
          COLOR_USER_FG = (1, 1, 1, 1)
          COLOR_BOT_FG = (0.13, 0.13, 0.13, 1)
          COLOR_TITLE_BG = (0.20, 0.46, 0.79, 1)
          COLOR_ERROR_BG = (0.85, 0.20, 0.20, 1)

          def strip_emojis(text):
              if not text: return text
              return re.sub(r"[\U00010000-\U0010ffff]|[\u2600-\u27BF]|\u200D|[\u25A0-\u25FF]", "", text)

          class HistoryItem(ButtonBehavior, BoxLayout):
              def __init__(self, record, app_ref, **kwargs):
                  super().__init__(**kwargs)
                  self.record = record
                  self.app_ref = app_ref
                  self.orientation = "vertical"
                  self.size_hint_y = None
                  self.height = dp(56)
                  self.padding = dp(12)
                  
                  title_text = record.get("preview", "新对话")
                  self.lbl = Label(text=title_text, font_name=CJK_FONT, font_size=dp(14),
                              color=(0.15, 0.15, 0.15, 1), halign="left", valign="middle")
                  self.lbl.bind(size=lambda inst, val: setattr(self.lbl, "text_size", (val[0]-dp(10), val[1])))
                  self.add_widget(self.lbl)
                  
                  with self.canvas.after:
                      Color(0.85, 0.85, 0.85, 1)
                      self.line = Rectangle(pos=(self.x, self.y), size=(self.width, dp(1)))
                  self.bind(pos=self._update_line, size=self._update_line)

              def _update_line(self, *args):
                  self.line.pos = (self.x, self.y)
                  self.line.size = (self.width, dp(1))

              def on_touch_down(self, touch):
                  if self.collide_point(*touch.pos):
                      self._lp = Clock.schedule_once(self._do_long_press, 0.6)
                  return super().on_touch_down(touch)

              def on_touch_up(self, touch):
                  if hasattr(self, "_lp"): self._lp.cancel()
                  return super().on_touch_up(touch)

              def on_touch_move(self, touch):
                  if hasattr(self, "_lp"): self._lp.cancel()
                  return super().on_touch_move(touch)

              def _do_long_press(self, dt):
                  self.app_ref.show_delete_dialog(self.record)

              def on_release(self):
                  self.app_ref.load_session(self.record)

          class ChatBubble(Label):
              def __init__(self, text, is_user=False, is_error=False, **kwargs):
                  super().__init__(**kwargs)
                  self.text = text
                  self.is_user = is_user
                  self.is_error = is_error
                  self.font_name = CJK_FONT
                  
                  current_size = App.get_running_app().chat_font_size
                  self.font_size = dp(current_size) if not is_error else dp(current_size - 2)
                  
                  self.size_hint_y = None
                  self.halign = "left"
                  self.valign = "middle"
                  self.padding = (dp(12), dp(8))
                  self.color = COLOR_USER_FG if is_user else COLOR_BOT_FG
                  self.bind(texture_size=self._on_texture_size)
                  self.bind(size=self._on_size)
                  
                  bg = COLOR_ERROR_BG if is_error else (COLOR_USER_BG if is_user else COLOR_BOT_BG)
                  with self.canvas.before:
                      Color(*bg)
                      self._bg = RoundedRectangle(pos=self.pos, size=self.size, radius=[dp(10)])
                  self.bind(pos=self._update_bg, size=self._update_bg)
                  
              def _on_texture_size(self, instance, value):
                  self.height = value[1] + dp(16)
                  
              def _on_size(self, instance, value):
                  new_width = max(value[0] - dp(24), dp(40))
                  if getattr(self, "_last_width", None) != new_width:
                      self._last_width = new_width
                      self.text_size = (new_width, None)
                      
              def _update_bg(self, *args):
                  self._bg.pos = self.pos
                  self._bg.size = self.size

          class MessageRow(BoxLayout):
              def __init__(self, text, is_user=False, is_error=False, **kwargs):
                  super().__init__(**kwargs)
                  self.orientation = "horizontal"
                  self.size_hint_y = None
                  self.spacing = dp(6)
                  self.padding = (dp(8), dp(2))
                  bubble = ChatBubble(text, is_user=is_user, is_error=is_error, size_hint_x=0.9)
                  spacer = BoxLayout(size_hint_x=0.1)
                  if is_user:
                      self.add_widget(spacer)
                      self.add_widget(bubble)
                  else:
                      self.add_widget(bubble)
                      self.add_widget(spacer)
                  bubble.bind(height=lambda inst, val: setattr(self, "height", val + dp(4)))
                  self.height = bubble.height + dp(4)

          class ChatApp(App):
              chat_font_size = NumericProperty(14)

              def __init__(self, **kwargs):
                  super().__init__(**kwargs)
                  self.session_id = None
                  self.is_processing = False
                  self.histories = []
                  self.current_record = {"id": None, "preview": "新对话", "messages": []}
                  self.load_settings()

              def load_settings(self):
                  try:
                      if os.path.exists(SETTINGS_FILE):
                          with open(SETTINGS_FILE, "r") as f:
                              self.chat_font_size = json.load(f).get("font_size", 14)
                  except: pass

              def save_settings(self):
                  try:
                      with open(SETTINGS_FILE, "w") as f:
                          json.dump({"font_size": self.chat_font_size}, f)
                  except: pass

              def on_chat_font_size(self, instance, value):
                  self.save_settings()
                  if hasattr(self, "text_input"):
                      self.text_input.font_size = dp(value + 1)
                  if hasattr(self, "chat_layout"):
                      for row in self.chat_layout.children:
                          for child in row.children:
                              if isinstance(child, ChatBubble):
                                  child.font_size = dp(value) if not child.is_error else dp(value - 2)

              def build(self):
                  self.load_all_history()
                  self.root = FloatLayout()

                  main_layout = BoxLayout(orientation="vertical", size_hint=(1, 1))
                  
                  title_bar = BoxLayout(orientation="horizontal", size_hint=(1, None), height=dp(46))
                  with title_bar.canvas.before:
                      Color(*COLOR_TITLE_BG)
                      title_bar._bg = Rectangle(pos=title_bar.pos, size=title_bar.size)
                  title_bar.bind(pos=lambda inst, val: setattr(title_bar._bg, "pos", val), size=lambda inst, val: setattr(title_bar._bg, "size", val))
                  
                  left_box = BoxLayout(size_hint=(None, 1), width=dp(100))
                  menu_btn = Button(text="≡", font_name=CJK_FONT, font_size=dp(28), size_hint=(None, 1), width=dp(50), background_color=(0,0,0,0), color=(1,1,1,1))
                  menu_btn.bind(on_release=self.open_drawer)
                  font_btn = Button(text="A±", font_name=CJK_FONT, font_size=dp(18), size_hint=(None, 1), width=dp(50), background_color=(0,0,0,0), color=(1,1,1,1))
                  font_btn.bind(on_release=self.show_font_settings)
                  left_box.add_widget(menu_btn)
                  left_box.add_widget(font_btn)
                  
                  title_lbl = Label(text="李尔", font_name=CJK_FONT, font_size=dp(18), bold=True)
                  
                  right_box = BoxLayout(size_hint=(None, 1), width=dp(100))
                  right_box.add_widget(Label(size_hint=(None, 1), width=dp(50)))
                  new_btn = Button(text="+", font_name=CJK_FONT, font_size=dp(28), size_hint=(None, 1), width=dp(50), background_color=(0,0,0,0), color=(1,1,1,1))
                  new_btn.bind(on_release=lambda x: self.start_new_session())
                  right_box.add_widget(new_btn)
                  
                  title_bar.add_widget(left_box)
                  title_bar.add_widget(title_lbl)
                  title_bar.add_widget(right_box)
                  main_layout.add_widget(title_bar)

                  self.scroll = ScrollView(size_hint=(1, 1))
                  self.chat_layout = GridLayout(cols=1, size_hint_y=None, spacing=dp(6), padding=[dp(10), dp(10), dp(10), dp(10)])
                  
                  def update_chat_height(*args):
                      self.chat_layout.height = max(self.chat_layout.minimum_height, self.scroll.height)
                  self.chat_layout.bind(minimum_height=update_chat_height)
                  self.scroll.bind(height=update_chat_height)
                  
                  self.scroll.add_widget(self.chat_layout)
                  main_layout.add_widget(self.scroll)

                  input_area = BoxLayout(orientation="horizontal", size_hint=(1, None), height=dp(56), spacing=dp(8), padding=[dp(10), dp(6), dp(10), dp(6)])
                  with input_area.canvas.before:
                      Color(1, 1, 1, 1)
                      input_area._bg = Rectangle(pos=input_area.pos, size=input_area.size)
                  input_area.bind(pos=lambda inst, val: setattr(input_area._bg, "pos", val), size=lambda inst, val: setattr(input_area._bg, "size", val))
                  
                  self.text_input = TextInput(hint_text="输入消息…", font_name=CJK_FONT, font_size=dp(self.chat_font_size + 1), multiline=True, size_hint=(1, 1), padding=[dp(10), dp(10), dp(10), dp(10)])
                  input_area.add_widget(self.text_input)
                  
                  self.send_btn = Button(text="发送", font_name=CJK_FONT, font_size=dp(15), size_hint=(None, 1), width=dp(70), color=(1, 1, 1, 1), background_color=COLOR_TITLE_BG, background_normal="")
                  self.send_btn.bind(on_release=self.send_message)
                  input_area.add_widget(self.send_btn)
                  main_layout.add_widget(input_area)
                  
                  self.root.add_widget(main_layout)

                  self.overlay = Button(background_color=(0,0,0,1), opacity=0, disabled=True, size_hint=(1, 1), pos_hint={"x": 0, "y": 0})
                  self.overlay.bind(on_release=self.close_drawer)
                  self.root.add_widget(self.overlay)

                  self.drawer = BoxLayout(orientation="vertical", size_hint=(0.6, 1), pos_hint={"x": -0.6, "y": 0})
                  with self.drawer.canvas.before:
                      Color(0.96, 0.96, 0.96, 1)
                      self.drawer._bg = Rectangle(pos=self.drawer.pos, size=self.drawer.size)
                  self.drawer.bind(pos=lambda inst, val: setattr(self.drawer._bg, "pos", val), size=lambda inst, val: setattr(self.drawer._bg, "size", val))

                  drawer_title = Label(text="最近对话", font_name=CJK_FONT, font_size=dp(16), color=(1,1,1,1), size_hint=(1, None), height=dp(46))
                  with drawer_title.canvas.before:
                      Color(*COLOR_TITLE_BG)
                      drawer_title._bg = Rectangle(pos=drawer_title.pos, size=drawer_title.size)
                  drawer_title.bind(pos=lambda inst, val: setattr(drawer_title._bg, "pos", val), size=lambda inst, val: setattr(drawer_title._bg, "size", val))
                  self.drawer.add_widget(drawer_title)

                  drawer_scroll = ScrollView(size_hint=(1, 1))
                  self.sidebar_layout = BoxLayout(orientation="vertical", size_hint_y=None)
                  self.sidebar_layout.bind(minimum_height=self.sidebar_layout.setter("height"))
                  drawer_scroll.add_widget(self.sidebar_layout)
                  self.drawer.add_widget(drawer_scroll)

                  clear_btn = Button(text="清空记录", font_name=CJK_FONT, font_size=dp(15), size_hint=(1, None), height=dp(48), background_color=(0.8, 0.3, 0.3, 1), color=(1,1,1,1), background_normal="")
                  clear_btn.bind(on_release=self.show_clear_all_dialog)
                  self.drawer.add_widget(clear_btn)

                  self.root.add_widget(self.drawer)

                  self.histories.insert(0, self.current_record)
                  self.refresh_sidebar()
                  Clock.schedule_once(self.init_chat_session, 0)
                  return self.root

              def show_font_settings(self, *args):
                  content = BoxLayout(orientation="vertical", spacing=dp(10), padding=dp(15))
                  lbl = Label(text=f"当前字号: {int(self.chat_font_size)}", font_name=CJK_FONT, color=(1,1,1,1), size_hint_y=None, height=dp(30))
                  
                  slider = Slider(min=10, max=24, step=1, value=self.chat_font_size)
                  def on_slider_val(inst, val):
                      self.chat_font_size = val
                      lbl.text = f"当前字号: {int(val)}"
                  slider.bind(value=on_slider_val)
                  
                  btn_box = BoxLayout(size_hint_y=None, height=dp(40))
                  btn_close = Button(text="完成", font_name=CJK_FONT, background_color=COLOR_TITLE_BG)
                  btn_box.add_widget(btn_close)
                  
                  content.add_widget(lbl)
                  content.add_widget(slider)
                  content.add_widget(btn_box)
                  
                  popup = Popup(title="调节字体大小", font_name=CJK_FONT, content=content, size_hint=(0.8, 0.35), auto_dismiss=True)
                  btn_close.bind(on_release=popup.dismiss)
                  popup.open()

              def load_all_history(self):
                  try:
                      if os.path.exists(HISTORY_FILE):
                          with open(HISTORY_FILE, "r", encoding="utf-8") as f:
                              self.histories = json.load(f)
                  except:
                      self.histories = []

              def save_all_history(self):
                  try:
                      valid_histories = [h for h in self.histories if len(h.get("messages", [])) > 0 or h == self.current_record]
                      with open(HISTORY_FILE, "w", encoding="utf-8") as f:
                          json.dump(valid_histories[:15], f, ensure_ascii=False)
                  except: pass

              def refresh_sidebar(self):
                  self.sidebar_layout.clear_widgets()
                  for record in self.histories:
                      if len(record.get("messages", [])) > 0 or record == self.current_record:
                          self.sidebar_layout.add_widget(HistoryItem(record, self))

              def open_drawer(self, *args):
                  self.overlay.disabled = False
                  Animation(opacity=0.4, d=0.25, t="out_quad").start(self.overlay)
                  Animation(pos_hint={"x": 0}, d=0.25, t="out_quad").start(self.drawer)

              def close_drawer(self, *args):
                  Animation(opacity=0, d=0.2).start(self.overlay)
                  anim = Animation(pos_hint={"x": -0.6}, d=0.2, t="in_quad")
                  anim.bind(on_complete=lambda *a: setattr(self.overlay, "disabled", True))
                  anim.start(self.drawer)

              def load_session(self, record):
                  self.close_drawer()
                  if record == self.current_record: return
                  self.current_record = record
                  self.session_id = record.get("id")
                  self.chat_layout.clear_widgets()
                  for m in record.get("messages", []):
                      self.chat_layout.add_widget(MessageRow(m["text"], is_user=m["is_user"]))
                  self._scroll_to_bottom()
                  if record in self.histories:
                      self.histories.remove(record)
                  self.histories.insert(0, record)
                  self.save_all_history()
                  self.refresh_sidebar()
                  gc.collect()

              def show_delete_dialog(self, record):
                  content = BoxLayout(orientation="vertical", spacing=dp(10), padding=dp(15))
                  content.add_widget(Label(text="是否删除此记录？", font_name=CJK_FONT, color=(1,1,1,1)))
                  btn_box = BoxLayout(size_hint_y=None, height=dp(40), spacing=dp(10))
                  btn_yes = Button(text="是", font_name=CJK_FONT, background_color=(0.8,0.2,0.2,1))
                  btn_no = Button(text="否", font_name=CJK_FONT, background_color=COLOR_TITLE_BG)
                  btn_box.add_widget(btn_yes)
                  btn_box.add_widget(btn_no)
                  content.add_widget(btn_box)
                  popup = Popup(title="提示", font_name=CJK_FONT, content=content, size_hint=(0.75, 0.25), auto_dismiss=False)
                  btn_yes.bind(on_release=lambda x: self.delete_history(record, popup))
                  btn_no.bind(on_release=popup.dismiss)
                  popup.open()

              def delete_history(self, record, popup):
                  if record in self.histories:
                      self.histories.remove(record)
                  self.save_all_history()
                  self.refresh_sidebar()
                  popup.dismiss()
                  gc.collect()
                  if self.current_record == record:
                      self.start_new_session(force=True)

              def show_clear_all_dialog(self, *args):
                  content = BoxLayout(orientation="vertical", spacing=dp(10), padding=dp(15))
                  content.add_widget(Label(text="确认清空所有聊天记录？", font_name=CJK_FONT, color=(1,1,1,1)))
                  btn_box = BoxLayout(size_hint_y=None, height=dp(40), spacing=dp(10))
                  btn_yes = Button(text="确认", font_name=CJK_FONT, background_color=(0.8,0.2,0.2,1))
                  btn_no = Button(text="取消", font_name=CJK_FONT, background_color=COLOR_TITLE_BG)
                  btn_box.add_widget(btn_yes)
                  btn_box.add_widget(btn_no)
                  content.add_widget(btn_box)
                  popup = Popup(title="警告", font_name=CJK_FONT, content=content, size_hint=(0.75, 0.25), auto_dismiss=False)
                  btn_yes.bind(on_release=lambda x: self.clear_all_history(popup))
                  btn_no.bind(on_release=popup.dismiss)
                  popup.open()

              def clear_all_history(self, popup):
                  self.histories = []
                  self.save_all_history()
                  self.refresh_sidebar()
                  popup.dismiss()
                  self.close_drawer()
                  gc.collect()
                  self.start_new_session(force=True)

              def start_new_session(self, force=False):
                  if not force and len(self.current_record["messages"]) == 0:
                      return 
                  self.chat_layout.clear_widgets()
                  self.current_record = {"id": None, "preview": "新对话", "messages": []}
                  self.session_id = None
                  self.histories.insert(0, self.current_record)
                  self.refresh_sidebar()
                  gc.collect()
                  threading.Thread(target=self._init_session_thread, daemon=True).start()

              def init_chat_session(self, dt):
                  if INIT_ERROR:
                      self._on_init_error(INIT_ERROR)
                      return
                  threading.Thread(target=self._init_session_thread, daemon=True).start()

              def _init_session_thread(self):
                  try:
                      result = chatbot.web_start_session()
                      self.session_id = result.get("session_id")
                      self.current_record["id"] = self.session_id
                      msgs = result.get("messages", [])
                      self._on_message_success(msgs)
                  except Exception as e:
                      self._on_init_error(traceback.format_exc())

              @mainthread
              def _on_init_error(self, err):
                  self.chat_layout.add_widget(MessageRow("【初始化失败】", is_user=False, is_error=True))

              def _scroll_to_bottom(self):
                  Clock.schedule_once(lambda dt: setattr(self.scroll, "scroll_y", 0), 0.1)

              def send_message(self, instance):
                  if INIT_ERROR or self.is_processing: return
                  text = strip_emojis((self.text_input.text or "").strip())
                  if not text: return
                  
                  if len(self.current_record["messages"]) == 0 or self.current_record["preview"] == "新对话":
                      self.current_record["preview"] = (text[:12] + "...") if len(text) > 12 else text

                  self.chat_layout.add_widget(MessageRow(text, is_user=True))
                  self.current_record["messages"].append({"is_user": True, "text": text})
                  self._scroll_to_bottom()
                  self.save_all_history()
                  self.refresh_sidebar()

                  self.text_input.text = ""
                  self.text_input.focus = False
                  self.is_processing = True
                  self.send_btn.text = "..."
                  self.send_btn.background_color = (0.5, 0.5, 0.5, 1)
                  
                  threading.Thread(target=self._process_message_thread, args=(text,), daemon=True).start()

              def _process_message_thread(self, text):
                  try:
                      result = chatbot.web_process_message(text, self.session_id)
                      self.session_id = result.get("session_id")
                      self.current_record["id"] = self.session_id
                      replies = result.get("replies", [])
                      self._on_message_success(replies)
                  except Exception as e:
                      self._on_message_error(traceback.format_exc())

              @mainthread
              def _on_message_success(self, replies):
                  self.is_processing = False
                  self.send_btn.text = "发送"
                  self.send_btn.background_color = COLOR_TITLE_BG
                  for reply in replies:
                      clean_reply = strip_emojis(reply)
                      if not clean_reply.strip(): continue
                      self.chat_layout.add_widget(MessageRow(clean_reply, is_user=False))
                      self.current_record["messages"].append({"is_user": False, "text": clean_reply})
                  self._scroll_to_bottom()
                  self.save_all_history()

              @mainthread
              def _on_message_error(self, err):
                  self.is_processing = False
                  self.send_btn.text = "发送"
                  self.send_btn.background_color = COLOR_TITLE_BG
                  self.chat_layout.add_widget(MessageRow("【处理异常】请重试", is_user=False, is_error=True))
                  self._scroll_to_bottom()

          if __name__ == "__main__":
              ChatApp().run()
          """
          with open("main.py", "w", encoding="utf-8") as f:
              f.write(code)
          print("main.py generated (Ultimate Features + Extreme GC)")
          '

      - name: Generate buildozer.spec (Force arm64-v8a)
        run: |
          python3 -c '
          spec = """[app]
          title = 李尔聊天机器人
          package.name = mychatbot
          package.domain = org.lear
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,json,ttf,otf,txt,cfg,ini
          version = 1.0.3
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.minapi = 21
          android.api = 34
          android.ndk = 25b
          android.accept_sdk_license = True
          android.allow_backup = 1
          presplash.duration = 3
          # 【极限优化】强制使用纯正 64 位架构，大幅提升 CPU 计算性能并减小胖包体积
          android.archs = arm64-v8a
          p4a.branch = master
          p4a.source_dir = /home/runner/work/python-for-android
          no-compile-pyo = False

          [buildozer]
          log_level = 2
          warn_on_root = 1
          """
          with open("buildozer.spec", "w", encoding="utf-8") as f:
              f.write(spec)
          print("buildozer.spec generated (64-bit enforced)")
          '

      - name: Build APK
        run: |
          echo "==== Build APK ===="
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          ls -lh bin/ 2>/dev/null || echo "bin/ not found"
          if ! ls bin/*.apk 2>/dev/null; then exit 1; fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 李尔聊天机器人-APK
          path: bin/*.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            .buildozer/**/*.log
          retention-days: 7
