                  private fun ansi256Color(index: Int): Int? {
                      if (index !in 0..255) return null
                      if (index < 16) return ANSI_BASE_COLORS[index]
                      if (index < 232) {
                          val cubeIndex = index - 16
                          val red = cubeIndex / 36
                          val green = (cubeIndex % 36) / 6
                          val blue = cubeIndex % 6
                          fun component(value: Int): Int = if (value == 0) 0 else 55 + value * 40
                          return Color.rgb(component(red), component(green), component(blue))
                      }
                      val gray = 8 + (index - 232) * 10
                      return Color.rgb(gray, gray, gray)
                  }
              }
