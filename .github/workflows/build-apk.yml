            private fun installCrashHandler() {
                if (LearRuntime.crashInstalled) return
                LearRuntime.crashInstalled = true
                val crashLog = File(applicationContext.filesDir, "crash.txt")
                val previousHandler = Thread.getDefaultUncaughtExceptionHandler()
                Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                    try {
                        crashLog.writeText(throwable.stackTraceToString())
                    } catch (_: Exception) {
                    }
                    if (previousHandler != null) {
                        previousHandler.uncaughtException(thread, throwable)
                    } else {
                        android.os.Process.killProcess(android.os.Process.myPid())
                    }
                }
            }
            private fun showPreviousCrashIfNeeded() {
                if (!crashFile.exists()) return
                val log = runCatching { crashFile.readText() }.getOrDefault("无法读取崩溃日志")
                crashFile.delete()
                AlertDialog.Builder(this)
                    .setTitle("上次运行时发生崩溃")
                    .setMessage(log)
                    .setPositiveButton("关闭", null)
                    .setNeutralButton("一键复制错误") { _, _ -> copyToClipboard("崩溃日志", log) }
                    .show()
            }
            private fun voicePreferenceScore(voice: android.speech.tts.Voice): Int {
                val offlineBonus = if (voice.isNetworkConnectionRequired) 0 else 10_000
                val mainlandChineseBonus =
                    if (voice.locale.language == "zh" && voice.locale.country == "CN") 500 else 0
                return offlineBonus + mainlandChineseBonus + voice.quality * 10 - voice.latency
            }
            private fun voiceDisplayName(voice: android.speech.tts.Voice): String {
                val quality = when {
                    voice.quality >= 400 -> "高质量"
                    voice.quality >= 300 -> "标准"
                    else -> "基础"
                }
                val connection = if (voice.isNetworkConnectionRequired) "联网" else "离线"
                return "${voice.name}（$quality · $connection）"
            }
            private fun ensureTts() {
                if (!::tts.isInitialized && !isDestroyed) tts = TextToSpeech(applicationContext, this)
            }
            override fun onInit(status: Int) {
                if (status != TextToSpeech.SUCCESS || isDestroyed || !::tts.isInitialized) return
                val result = tts.setLanguage(Locale.CHINESE)
                if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) return
                availableVoices = tts.voices
                    ?.asSequence()
                    ?.filter { it.locale.language == "zh" }
                    ?.distinctBy { it.name }
                    ?.sortedWith(
                        compareByDescending<android.speech.tts.Voice> {
                            voicePreferenceScore(it)
                        }.thenBy { it.name }
                    )
                    ?.toList()
                    ?: emptyList()
                val selectedVoice = selectedVoiceName
                    ?.let { name -> availableVoices.firstOrNull { it.name == name } }
                    ?: availableVoices.firstOrNull()
                selectedVoice?.let { voice ->
                    tts.voice = voice
                    selectedVoiceName = voice.name
                }
            }
