              private fun showClearAllDialog() {
                  AlertDialog.Builder(this)
                      .setTitle("警告")
                      .setMessage("确认清空所有聊天记录？")
                      .setPositiveButton("清空") { _, _ ->
                          histories.forEach { session ->
                              session.messages.forEach { it.displaySpannable = null }
                          }
                          histories.clear()
                          currentSession = ChatSession()
                          chatAdapter.setMessages(currentSession.messages)
                          scheduleHistorySave(immediate = true)
                          refreshHistory()
                          startNewSession(force = true)
                      }
                      .setNegativeButton("取消", null)
                      .show()
              }
              private fun scheduleHistorySave(immediate: Boolean = false) {
                  historySaveJob?.cancel()
                  historySaveJob = lifecycleScope.launch {
                      if (!immediate) delay(250L)
                      val snapshot = createHistorySnapshot()
                      withContext(Dispatchers.IO) {
                          historyWriteMutex.withLock { writeHistorySnapshot(snapshot) }
                      }
                  }
              }
              private fun createHistorySnapshot(): List<SessionSnapshot> = histories
                  .asSequence()
                  .filter { session -> session.messages.any { it.isUser } }
                  .take(MAX_HISTORY)
                  .map { session ->
                      SessionSnapshot(
                          preview = session.preview,
                          messages = session.messages.map { message ->
                              MessageSnapshot(
                                  text = message.text,
                                  isUser = message.isUser,
                                  isError = message.isError,
                                  isSystem = message.isSystem,
                                  imageUri = message.imageUri
                              )
                          }
                      )
                  }
                  .toList()
              private fun writeHistorySnapshot(snapshot: List<SessionSnapshot>) {
                  val array = JSONArray()
                  snapshot.forEach { session ->
                      val objectJson = JSONObject()
                      objectJson.put("id", JSONObject.NULL)
                      objectJson.put("preview", session.preview)
                      val messagesJson = JSONArray()
                      session.messages.forEach { message ->
                          messagesJson.put(JSONObject().apply {
                              put("is_user", message.isUser)
                              put("text", message.text)
                              put("is_error", message.isError)
                              put("is_system", message.isSystem)
                              put("image_uri", message.imageUri ?: JSONObject.NULL)
                          })
                      }
                      objectJson.put("messages", messagesJson)
                      array.put(objectJson)
                  }
                  val temporary = File(historyFile.parentFile, "${historyFile.name}.tmp")
                  temporary.writeText(array.toString())
                  if (!temporary.renameTo(historyFile)) {
                      historyFile.writeText(array.toString())
                      temporary.delete()
                  }
              }
              private fun loadAllHistory() {
                  histories.clear()
                  try {
                      if (!historyFile.exists()) return
                      val array = JSONArray(historyFile.readText())
                      val count = minOf(array.length(), MAX_HISTORY)
                      for (index in 0 until count) {
                          val objectJson = array.getJSONObject(index)
                          val session = ChatSession(
                              id = null,
                              preview = objectJson.optString("preview", "新对话")
                          )
                          val messages = objectJson.optJSONArray("messages") ?: JSONArray()
                          for (messageIndex in 0 until messages.length()) {
                              val messageJson = messages.getJSONObject(messageIndex)
                              session.messages.add(
                                  ChatMessage(
                                      text = messageJson.optString("text", ""),
                                      isUser = messageJson.optBoolean("is_user", false),
                                      isError = messageJson.optBoolean("is_error", false),
                                      isSystem = messageJson.optBoolean("is_system", false),
                                      imageUri = if (messageJson.isNull("image_uri")) {
                                          null
                                      } else {
                                          messageJson.optString("image_uri").takeIf { it.isNotEmpty() }
                                      }
                                  )
                              )
                          }
                          histories.add(session)
                      }
                  } catch (_: Exception) {
                      histories.clear()
                      runCatching {
                          historyFile.renameTo(File(historyFile.parentFile, "chat_history_corrupt.json"))
                      }
                  }
              }
              private fun refreshHistory() {
                  historyAdapter.updateList(
                      histories.filter { session -> session.messages.any { it.isUser } }.take(MAX_HISTORY)
                  )
              }
              private fun saveSettings() {
                  try {
                      val json = JSONObject().apply {
                          put("font_size", chatFontSize)
                          put("tts_on", isTtsEnabled)
                          put("tts_speed", ttsSpeed.toDouble())
                          put("tts_pitch", ttsPitch.toDouble())
                          put("tts_voice", selectedVoiceName ?: "")
                          put("typewriter_on", isTypewriterEnabled)
                      }
                      val temporary = File(settingsFile.parentFile, "${settingsFile.name}.tmp")
                      temporary.writeText(json.toString())
                      if (!temporary.renameTo(settingsFile)) {
                          settingsFile.writeText(json.toString())
                          temporary.delete()
                      }
                  } catch (_: Exception) {
                  }
              }
              private fun loadSettings() {
                  try {
                      if (!settingsFile.exists()) return
                      val json = JSONObject(settingsFile.readText())
                      chatFontSize = json.optInt("font_size", 14).coerceIn(10, 24)
                      isTtsEnabled = json.optBoolean("tts_on", false)
                      ttsSpeed = json.optDouble("tts_speed", 1.0).toFloat().coerceIn(0.5f, 2.0f)
                      ttsPitch = json.optDouble("tts_pitch", 1.0).toFloat().coerceIn(0.5f, 2.0f)
                      selectedVoiceName = json.optString("tts_voice", "").takeIf { it.isNotEmpty() }
                      isTypewriterEnabled = json.optBoolean("typewriter_on", false)
                  } catch (_: Exception) {
                  }
              }
              private fun cleanText(text: String): String = text.replace("\r", "").trim()
              private fun stripAnsi(text: String): String = ANSI_REGEX.replace(text, "")
              private fun scrollToBottom(smooth: Boolean = true) {
                  pendingSmoothScroll = smooth
                  chatRecycler.removeCallbacks(scrollRunnable)
                  chatRecycler.post(scrollRunnable)
              }
              private fun isChatNearBottom(): Boolean {
                  val manager = chatRecycler.layoutManager as? LinearLayoutManager ?: return true
                  val lastVisible = manager.findLastVisibleItemPosition()
                  return lastVisible >= chatAdapter.itemCount - 3
              }
              private fun speakMessageIfNeeded(message: ChatMessage) {
                  if (!isTtsEnabled || message.isSystem || !::tts.isInitialized) return
                  tts.setSpeechRate(ttsSpeed)
                  tts.setPitch(ttsPitch)
                  tts.speak(stripAnsi(message.text), TextToSpeech.QUEUE_ADD, null, null)
              }
              private fun parseAnsiToSpannable(text: String): CharSequence {
                  val builder = SpannableStringBuilder()
                  var lastIndex = 0
                  var isBold = false
                  var isUnderline = false
                  var currentColor: Int? = null
                  fun appendStyled(segment: String) {
                      if (segment.isEmpty()) return
                      val start = builder.length
                      builder.append(segment)
                      val end = builder.length
                      if (isBold) builder.setSpan(
                          StyleSpan(Typeface.BOLD),
                          start,
                          end,
                          Spannable.SPAN_EXCLUSIVE_EXCLUSIVE
                      )
                      if (isUnderline) builder.setSpan(
                          UnderlineSpan(),
                          start,
                          end,
                          Spannable.SPAN_EXCLUSIVE_EXCLUSIVE
                      )
                      currentColor?.let { color ->
                          builder.setSpan(
                              ForegroundColorSpan(color),
                              start,
                              end,
                              Spannable.SPAN_EXCLUSIVE_EXCLUSIVE
                          )
                      }
                  }
                  for (match in ANSI_REGEX.findAll(text)) {
                      appendStyled(text.substring(lastIndex, match.range.first))
                      val code = match.value
                      if (code.endsWith("m")) {
                          val inner = code.substring(2, code.length - 1)
                          val values = if (inner.isEmpty()) {
                              listOf(0)
                          } else {
                              inner.split(';').mapNotNull { it.toIntOrNull() }
                          }
                          var valueIndex = 0
                          while (valueIndex < values.size) {
                              when (val value = values[valueIndex]) {
                                  0 -> {
                                      isBold = false
                                      isUnderline = false
                                      currentColor = null
                                  }
                                  1 -> isBold = true
                                  22 -> isBold = false
                                  4 -> isUnderline = true
                                  24 -> isUnderline = false
                                  in 30..37 -> currentColor = ANSI_BASE_COLORS[value - 30]
                                  39 -> currentColor = null
                                  in 90..97 -> currentColor = ANSI_BASE_COLORS[value - 90 + 8]
                                  38, 48 -> {
                                      val isForeground = value == 38
                                      when (values.getOrNull(valueIndex + 1)) {
                                          5 -> {
                                              if (isForeground) {
                                                  values.getOrNull(valueIndex + 2)
                                                      ?.let { currentColor = ansi256Color(it) }
                                              }
                                              valueIndex += 2
                                          }
                                          2 -> {
                                              val red = values.getOrNull(valueIndex + 2)
                                              val green = values.getOrNull(valueIndex + 3)
                                              val blue = values.getOrNull(valueIndex + 4)
                                              if (isForeground &&
                                                  red != null && green != null && blue != null
                                              ) {
                                                  currentColor = Color.rgb(
                                                      red.coerceIn(0, 255),
                                                      green.coerceIn(0, 255),
                                                      blue.coerceIn(0, 255)
                                                  )
                                              }
                                              valueIndex += 4
                                          }
                                      }
                                  }
                              }
                              valueIndex += 1
                          }
                      }
                      lastIndex = match.range.last + 1
                  }
                  appendStyled(text.substring(lastIndex))
                  return builder
              }
              private fun loadThumbnail(uriText: String, targetWidth: Int): Bitmap? {
                  imageCache.get(uriText)?.let { return it }
                  val uri = Uri.parse(uriText)
                  val target = targetWidth.coerceAtLeast(320)
                  val bitmap = try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          contentResolver.loadThumbnail(uri, Size(target, target), null)
                      } else {
                          decodeSampledBitmap(uri, target, target)
                      }
                  } catch (_: Exception) {
                      null
                  }
                  if (bitmap != null) imageCache.put(uriText, bitmap)
                  return bitmap
              }
              private fun decodeSampledBitmap(uri: Uri, requiredWidth: Int, requiredHeight: Int): Bitmap? {
                  val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  contentResolver.openFileDescriptor(uri, "r")?.use { descriptor ->
                      BitmapFactory.decodeFileDescriptor(descriptor.fileDescriptor, null, bounds)
                  } ?: return null
                  var sampleSize = 1
                  while (bounds.outWidth / sampleSize > requiredWidth * 2 ||
                      bounds.outHeight / sampleSize > requiredHeight * 2
                  ) {
                      sampleSize *= 2
                  }
                  val options = BitmapFactory.Options().apply {
                      inSampleSize = sampleSize
                      inPreferredConfig = Bitmap.Config.ARGB_8888
                  }
                  return contentResolver.openFileDescriptor(uri, "r")?.use { descriptor ->
                      BitmapFactory.decodeFileDescriptor(descriptor.fileDescriptor, null, options)
                  }
              }
              private inner class ChatAdapter : RecyclerView.Adapter<ChatViewHolder>() {
                  private val messages = mutableListOf<ChatMessage>()
                  var fontSize: Int = 14
                  init {
                      setHasStableIds(true)
                  }
                  fun addMessage(message: ChatMessage): Int {
                      messages.add(message)
                      val position = messages.lastIndex
                      notifyItemInserted(position)
                      return position
                  }
                  fun setMessages(newMessages: List<ChatMessage>) {
                      messages.clear()
                      messages.addAll(newMessages)
                      notifyDataSetChanged()
                  }
                  fun isSameMessage(position: Int, localId: Long): Boolean =
                      position in messages.indices && messages[position].localId == localId
                  override fun getItemId(position: Int): Long = messages[position].localId
                  override fun getItemViewType(position: Int): Int {
                      val message = messages[position]
                      return when {
                          message.isSystem -> TYPE_SYSTEM
                          message.isError -> TYPE_ERROR
                          message.isUser -> TYPE_USER
                          else -> TYPE_BOT
                      }
                  }
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ChatViewHolder {
                      val container = LinearLayout(parent.context).apply {
                          layoutParams = ViewGroup.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                          orientation = LinearLayout.HORIZONTAL
                          setPadding(0, 16, 0, 16)
                          gravity = when (viewType) {
                              TYPE_USER -> Gravity.END
                              TYPE_SYSTEM -> Gravity.CENTER
                              else -> Gravity.START
                          }
                      }
                      val bubble = LinearLayout(parent.context).apply {
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              when (viewType) {
                                  TYPE_USER -> setMargins(100, 0, 32, 0)
                                  TYPE_SYSTEM -> setMargins(48, 0, 48, 0)
                                  else -> setMargins(32, 0, 100, 0)
                              }
                          }
                          orientation = LinearLayout.VERTICAL
                          background = ContextCompat.getDrawable(
                              parent.context,
                              when (viewType) {
                                  TYPE_USER -> R.drawable.bg_bubble_user
                                  TYPE_BOT -> R.drawable.bg_bubble_bot
                                  TYPE_ERROR -> R.drawable.bg_bubble_error
                                  else -> android.R.color.transparent
                              }
                          )
                      }
                      val image = ImageView(parent.context).apply {
                          layoutParams = LinearLayout.LayoutParams(
                              (parent.context.resources.displayMetrics.widthPixels * 0.35f).toInt(),
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                          adjustViewBounds = true
                          visibility = View.GONE
                          setPadding(16, 16, 16, 16)
                      }
                      val text = TextView(parent.context).apply {
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                          maxWidth = (parent.context.resources.displayMetrics.widthPixels * 0.75f).toInt()
                          setPadding(42, 28, 42, 28)
                          setLineSpacing(6f, 1f)
                          setTextColor(
                              ContextCompat.getColor(
                                  parent.context,
                                  when (viewType) {
                                      TYPE_USER, TYPE_ERROR -> R.color.user_text
                                      TYPE_BOT -> R.color.bot_text
                                      else -> R.color.gray_text
                                  }
                              )
                          )
                          setTextIsSelectable(true)
                      }
                      bubble.addView(image)
                      bubble.addView(text)
                      container.addView(bubble)
                      return ChatViewHolder(container, image, text)
                  }
                  override fun onBindViewHolder(holder: ChatViewHolder, position: Int) {
                      bindFull(holder, position)
                  }
                  override fun onBindViewHolder(
                      holder: ChatViewHolder,
                      position: Int,
                      payloads: MutableList<Any>
                  ) {
                      if (payloads.contains(PAYLOAD_TYPING)) {
                          bindText(holder, messages[position], getItemViewType(position))
                      } else {
                          bindFull(holder, position)
                      }
                  }
                  private fun bindFull(holder: ChatViewHolder, position: Int) {
                      val message = messages[position]
                      val viewType = getItemViewType(position)
                      holder.boundMessageId = message.localId
                      holder.imageJob?.cancel()
                      holder.imageJob = null
                      if (message.imageUri != null) {
                          holder.image.visibility = View.VISIBLE
                          holder.image.setImageDrawable(null)
                          holder.text.visibility = if (message.text.isBlank()) View.GONE else View.VISIBLE
                          val targetWidth = (resources.displayMetrics.widthPixels * 0.35f).toInt()
                          holder.imageJob = lifecycleScope.launch {
                              val bitmap = withContext(Dispatchers.IO) {
                                  loadThumbnail(message.imageUri, targetWidth)
                              }
                              if (holder.boundMessageId == message.localId && bitmap != null) {
                                  holder.image.setImageBitmap(bitmap)
                              }
                          }
                      } else {
                          holder.image.visibility = View.GONE
                          holder.image.setImageDrawable(null)
                          holder.text.visibility = View.VISIBLE
                      }
                      bindText(holder, message, viewType)
                      holder.text.textSize = if (viewType == TYPE_SYSTEM) {
                          (fontSize - 2).toFloat()
                      } else {
                          fontSize.toFloat()
                      }
                  }
                  private fun bindText(holder: ChatViewHolder, message: ChatMessage, viewType: Int) {
                      val display = message.displaySpannable ?: when (viewType) {
                          TYPE_BOT, TYPE_ERROR, TYPE_SYSTEM -> parseAnsiToSpannable(message.text)
                          else -> stripAnsi(message.text)
                      }.also { generated ->
                          if (viewType != TYPE_USER) message.displaySpannable = generated
                      }
                      holder.text.text = display
                  }
                  override fun onViewRecycled(holder: ChatViewHolder) {
                      holder.imageJob?.cancel()
                      holder.imageJob = null
                      holder.image.setImageDrawable(null)
                      holder.boundMessageId = RecyclerView.NO_ID
                      super.onViewRecycled(holder)
                  }
                  override fun getItemCount(): Int = messages.size
              }
              private class ChatViewHolder(
                  itemView: View,
                  val image: ImageView,
                  val text: TextView
              ) : RecyclerView.ViewHolder(itemView) {
                  var boundMessageId: Long = RecyclerView.NO_ID
                  var imageJob: Job? = null
              }
              private inner class HistoryAdapter : RecyclerView.Adapter<HistoryAdapter.ViewHolder>() {
                  private var items = emptyList<ChatSession>()
                  var onItemClick: ((ChatSession) -> Unit)? = null
                  var onItemLongClick: ((ChatSession) -> Unit)? = null
                  fun updateList(newItems: List<ChatSession>) {
                      items = newItems.toList()
                      notifyDataSetChanged()
                  }
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder {
                      val textView = TextView(parent.context).apply {
                          layoutParams = ViewGroup.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                          setPadding(48, 38, 48, 38)
                          textSize = 15f
                          setTextColor(ContextCompat.getColor(this@MainActivity, R.color.black))
                          maxLines = 1
                          ellipsize = android.text.TextUtils.TruncateAt.END
                      }
                      return ViewHolder(textView)
                  }
                  override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                      (holder.itemView as TextView).text = items[position].preview
                  }
                  override fun getItemCount(): Int = items.size
                  inner class ViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView) {
                      init {
                          itemView.setOnClickListener {
                              val position = bindingAdapterPosition
                              if (position != RecyclerView.NO_POSITION) onItemClick?.invoke(items[position])
                          }
                          itemView.setOnLongClickListener {
                              val position = bindingAdapterPosition
                              if (position != RecyclerView.NO_POSITION) onItemLongClick?.invoke(items[position])
                              true
                          }
                      }
                  }
              }
          }
          KT_EOF
      - name: Validate generated sources
        run: |
          set -euo pipefail
          PYCACHE_ROOT="${RUNNER_TEMP:-/tmp}/lear-validation-pycache"
          PYTHONPYCACHEPREFIX="$PYCACHE_ROOT" \
            python3 -W error::SyntaxWarning -m py_compile app/src/main/python/bootstrap.py
          PYTHONPYCACHEPREFIX="$PYCACHE_ROOT" \
            python3 -m py_compile app/src/main/assets/chatbot/*.py
          test -s app/src/main/java/com/lear/chatbot/MainActivity.kt
          test -s app/src/main/assets/chatbot/lear_main.py
          test "$(wc -c < app/src/main/assets/chatbot/bundle_version.txt)" -eq 65
          grep -Eq '^[0-9a-f]{64}$' app/src/main/assets/chatbot/bundle_version.txt
      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build_log.txt
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 李尔构建错误日志
          path: build_log.txt
          retention-days: 7
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 李尔聊天系统
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
