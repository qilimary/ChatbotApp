                if (::tts.isInitialized) tts.stop()
                scheduleHistorySave(immediate = true)
                super.onStop()
            }
            override fun onDestroy() {
                pollingJob?.cancel()
                sessionStartJob?.cancel()
                messageJob?.cancel()
                historySaveJob?.cancel()
                typingJobs.values.forEach { it.cancel() }
                typingJobs.clear()
                textRecognizer?.close()
                textRecognizer = null
                imageCache.evictAll()
                if (::tts.isInitialized) {
                    tts.stop()
                    tts.shutdown()
