        """Compare original algorithms with packed assets, including ranking and vector values."""
        import copy, json, random, statistics, sys, time
        from pathlib import Path
        sys.path.insert(0, str(Path.cwd()))
        import lear_main as m
        import lear_mobile as mobile
        assets=str(Path(sys.argv[1]).resolve())
        OriginalIndex=m.InvertedIndex
        original_char=m.SimilarityCalculator._retrieve_char_candidates
        original_prepare=m.PurePythonVectorManager.prepare_idf_weighted_vectors
        original_explain=m.IdiomExplainer.explain
        original_vector=m.PurePythonVectorManager('word_vectors.json')
        original_index=OriginalIndex(m.corpus,str(Path(assets)/'reference_nonexistent'))
        mobile.install(m,assets)
        calc=m.SimilarityCalculator(m.corpus,'unused',use_parallel=False)
        assert calc._index_ready_event.wait(60) and not calc._mobile_error, calc._mobile_error
        original_prepare(original_vector,calc.char_idf)
        class Reference(m.SimilarityCalculator):
            _retrieve_char_candidates=original_char
        ref=Reference.__new__(Reference)
        ref.__dict__.update(calc.__dict__)
        ref.inverted_index=original_index
        ref.vector_manager=original_vector
        ref._build_question_recall_index(m.corpus)
        ref.corpus_vectors=mobile.QuestionVectors(ref)
        questions=list(calc._exact_question_groups)
        rng=random.Random(41)
        queries=['你好','如何饲养小狗','猫吃什么','什么是干细胞','怎样提高学习效率','今天心情不好','画蛇添足','亡羊补牢','篮球比赛','光合作用','', '不存在的xyz123']
        queries+=rng.sample(questions,50)
        queries=[q if i%2==0 else q.replace('什么','啥')+'呢' for i,q in enumerate(queries)]
        count=0; vectors=0; old_times=[]; new_times=[]
        for query in queries:
            t=time.perf_counter(); a=original_index.retrieve_candidates(query,200);old_times.append(time.perf_counter()-t)
            t=time.perf_counter(); b=calc.inverted_index.retrieve_candidates(query,200);new_times.append(time.perf_counter()-t)
            assert a==b, ('BM25',query)
            assert ref._retrieve_char_candidates(query,m.corpus,100)==calc._retrieve_char_candidates(query,m.corpus,100),('char',query)
            a=ref._prepare_candidates(query,m.corpus,200,100)
            b=calc._prepare_candidates(query,m.corpus,200,100)
            assert a==b,('candidates',query)
            count+=len(a)
            for question,_ in list(a)[:12]:
                va=original_vector.get_sentence_vector(question)
                vb=calc.corpus_vectors.get(question)
                assert va == (tuple(vb) if vb is not None else None), ('vector',question)
                vectors+=1
            assert ref.find_closest_match(query,m.corpus)==calc.find_closest_match(query,m.corpus),('ranking',query)
        subset=dict(list(m.corpus.items())[1000:1700])
        for query in queries[:12]:
            assert ref._prepare_candidates(query,subset,200,100)==calc._prepare_candidates(query,subset,200,100)
        class Context:
            def __init__(self): self.values={}
            def update_context(self,k,v): self.values[k]=v
        idioms=list(m.idioms)
        cases=rng.sample(idioms,100)
        cases+=[x[:1]+'错'+x[2:] for x in cases]
        cases+=['','画蛇添足亡羊补牢','你好啊','这个输入超过十一个字符时应忽略','天地']
        old_idiom=[];new_idiom=[]
        for query in cases:
            c1,c2=Context(),Context()
            a,b=m.IdiomExplainer(m.idioms,c1),m.IdiomExplainer(m.idioms,c2)
            random.seed(98);t=time.perf_counter();answer=original_explain(a,query);old_idiom.append(time.perf_counter()-t)
            random.seed(98);t=time.perf_counter();actual=b.explain(query);new_idiom.append(time.perf_counter()-t)
            assert answer==actual and c1.values==c2.values,('idiom',query,answer,actual)
        for q in questions[:3000]: calc.corpus_vectors.get(q)
        assert calc.corpus_vectors.cached.cache_info().currsize==2048
        report=dict(parity='PASS',queries=len(queries),candidates_compared=count,vectors_compared=vectors,idiom_cases=len(cases),bm25_median_ms=[statistics.median(x)*1000 for x in (old_times,new_times)],idiom_median_ms=[statistics.median(x)*1000 for x in (old_idiom,new_idiom)],question_vector_cache_limit=2048)
        Path('mobile_verification.json').write_text(json.dumps(report,indent=2))
        print(json.dumps(report,indent=2))
        MOBILE_EOF
        cat > smoke_mobile.py <<'MOBILE_EOF'
        import json, sys, time, threading, resource, tempfile, shutil, os
        from pathlib import Path
        source_assets=Path(sys.argv[1]).resolve()
        report_path=Path('smoke_verification.json').resolve()
        temporary=tempfile.TemporaryDirectory()
        assets=Path(temporary.name)/'chatbot'
        shutil.copytree(source_assets,assets)
        bridge=Path('app/src/main/python').resolve()
        sys.path[:0]=[str(bridge),str(assets)]
        import bootstrap as b
        started=time.perf_counter()
        result=json.loads(b.init_backend(str(assets)))
        assert 'error' not in result,result
        sid=result['session_id']
        for _ in range(1200):
            status=json.loads(b.initialization_status(sid))
            if status['ready']: break
            time.sleep(.05)
        assert status['successful'],status
        elapsed=time.perf_counter()-started
        m=b._lear_main
        calc=b._shared_similarity_calculator
        session=m.WEB_SESSION_MANAGER.sessions[sid]
        for text in ['你好','1+1等于多少','画蛇添足是什么意思','狗吃什么']:
            answer=json.loads(b.process_message(text,sid))
            assert 'error' not in answer and answer['replies'],answer
            assert json.loads(b.poll_async(sid))==[], 'Duplicate synchronous reply'
        session._record_message('测试异步消息')
        assert len(json.loads(b.poll_async(sid)))==1
        assert json.loads(b.poll_async(sid))==[]
        class Emitter:
            def type_like_human(self,text): session._record_message(text)
        m.ReminderBot._output_and_enqueue(Emitter(),'提醒测试')
        assert len(json.loads(b.poll_async(sid)))==1
        assert json.loads(b.poll_async(sid))==[]
        thread_count=threading.active_count()
        for _ in range(12):
            old=session
            result=json.loads(b.start_new_session())
            assert 'error' not in result,result
            sid=result['session_id'];session=m.WEB_SESSION_MANAGER.sessions[sid]
            assert b._calculator(session) is calc
            old._record_message('已关闭会话的延迟回调')
            assert json.loads(b.poll_async(sid))==[]
            assert len(m.WEB_SESSION_MANAGER.sessions)==1
        assert threading.active_count() <= thread_count+2
        assert 'error' in json.loads(b.process_message('你'*4001,sid))
        assert 'error' in json.loads(b.process_message('你好','invalid'))
        assert m._safe_eval_numeric('2**10')==1024
        for expr in ('1e309','(2**1000)**1000','__import__("os")'):
            try: m._safe_eval_numeric(expr)
            except (ValueError,OverflowError): pass
            else: raise AssertionError(expr)
        b.trim_memory()
        assert calc.corpus_vectors.cached.cache_info().currsize==0
        report=dict(smoke='PASS',full_initialization_seconds=round(elapsed,4),peak_process_mib=round(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024,2),session_restarts=12,threads_before=thread_count,threads_after=threading.active_count())
        print(json.dumps(report,indent=2))
        report_path.write_text(json.dumps(report,indent=2))
        m.WEB_SESSION_MANAGER.clear_all()
        os.chdir(report_path.parent)
        temporary.cleanup()
        MOBILE_EOF
        python3 verify_mobile.py app/src/main/assets/chatbot
        python3 smoke_mobile.py app/src/main/assets/chatbot
        python3 -m py_compile app/src/main/python/bootstrap.py
        python3 - <<'MOBILE_PY'
        from pathlib import Path
        import hashlib, json, importlib.util
        p=Path('app/src/main/assets/chatbot')
        manifest=json.loads((p/'bundle_manifest.json').read_text())
        for name, item in manifest.items():
            payload=(p/name).read_bytes()
            assert len(payload)==item['size'] and hashlib.sha256(payload).hexdigest()==item['sha256'],name
            if name.endswith('.pyc'): assert payload[:4]==importlib.util.MAGIC_NUMBER,name
        assert not list(p.glob('*.py')) and not (p/'word_vectors.json').exists()
        MOBILE_PY
    - name: Build APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        set -euo pipefail
        gradle assembleRelease --no-daemon --stacktrace --console=plain --max-workers=2 2>&1 | tee build_log.txt
    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: 李尔构建错误日志
        path: |-
          build_log.txt
          mobile_verification.json
          smoke_verification.json
        retention-days: 7
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: 李尔聊天系统
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: error
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    - master
