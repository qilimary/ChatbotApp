name: Build Lear Chatbot APK
permissions:
  contents: read
concurrency:
  group: lear-chatbot-apk-${{ github.ref }}
  cancel-in-progress: true
env:
  CHATBOT_DOWNLOAD_URL: https://drive.google.com/file/d/1HX2vxeod4aaMQMmSmiY3Pia72IvbSN47/view
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc
        sudo apt-get clean
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Preserve app signing key
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: lear-chatbot-debug-signing-v1
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install download tool
      run: python -m pip install --disable-pip-version-check "gdown==5.2.0" "Pillow==11.3.0"
    - name: Download and verify chatbot package
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if gdown --no-cookies --fuzzy "$CHATBOT_DOWNLOAD_URL" -O chatbot.zip; then break; fi
          if [ "$attempt" = 3 ]; then exit 1; fi
          sleep 5
        done
        echo '90a2f69d1a3f2c83e91c805b9fe261e9855482e0ddbd96e32515566c84e04c23  chatbot.zip' | sha256sum --check --status
    - name: Extract chatbot files
      run: |
        python3 - <<'MOBILE_PY'
        from pathlib import Path, PurePosixPath
        import zipfile
        required={'李尔.py','单词.py','成语.py','数据.py','字向量_f16_pure.json'}
        with zipfile.ZipFile('chatbot.zip') as archive:
            infos=archive.infolist()
            assert len(infos)<=100 and sum(x.file_size for x in infos)<200*1024*1024, 'Invalid archive size'
            assert archive.testzip() is None, 'Corrupt archive'
            for name in sorted(required):
                entries=[x for x in infos if not x.is_dir() and PurePosixPath(x.filename).name==name]
                assert len(entries)==1 and entries[0].file_size>0, 'Missing or duplicate: '+name
                payload=archive.read(entries[0])
                payload.decode('utf-8')
                Path(name).write_bytes(payload)
        MOBILE_PY
    - name: Rename Chinese filenames to ASCII
      run: |
        python3 - <<'PYEOF'
        import os
        import re
        RENAME_MODULES = {
            "李尔": "lear_main",
            "单词": "chatbot_words",
            "数据": "chatbot_data",
            "成语": "chatbot_idioms",
        }
        FILE_RENAME = {
            "字向量_f16_pure.json": "word_vectors.json",
            "李尔.py": "lear_main.py",
            "单词.py": "chatbot_words.py",
            "数据.py": "chatbot_data.py",
            "成语.py": "chatbot_idioms.py",
        }
        def replace_all(content):
            for chinese_filename, ascii_filename in FILE_RENAME.items():
                content = content.replace(chinese_filename, ascii_filename)
            for chinese_module, ascii_module in RENAME_MODULES.items():
                content = re.sub(
                    rf"(?m)^(\s*)import {re.escape(chinese_module)}\s*$",
                    rf"\1import {ascii_module} as {chinese_module}",
                    content,
                )
                content = re.sub(
                    rf"(?m)^(\s*)import {re.escape(chinese_module)} as ",
                    rf"\1import {ascii_module} as ",
                    content,
                )
                content = re.sub(
                    rf"(?m)^(\s*)from {re.escape(chinese_module)} import",
                    rf"\1from {ascii_module} import",
                    content,
                )
                content = re.sub(
                    rf"(\s)import {re.escape(chinese_module)}(\s|$)",
                    rf"\1import {ascii_module} as {chinese_module}\2",
                    content,
                )
            return content
        cached_modules = {}
        for chinese_module, ascii_module in RENAME_MODULES.items():
            source = chinese_module + ".py"
            if os.path.exists(source):
                with open(source, "r", encoding="utf-8") as file:
                    cached_modules[ascii_module] = file.read()
                os.remove(source)
        for ascii_module, content in cached_modules.items():
            with open(ascii_module + ".py", "w", encoding="utf-8", newline="\n") as file:
                file.write(replace_all(content))
        for chinese_filename, ascii_filename in FILE_RENAME.items():
            if chinese_filename.endswith((".json", ".pkl")) and os.path.exists(chinese_filename):
                os.replace(chinese_filename, ascii_filename)
        generated_modules = {name + ".py" for name in RENAME_MODULES.values()}
        for filename in os.listdir("."):
            if not filename.endswith(".py") or filename in generated_modules:
                continue
            with open(filename, "r", encoding="utf-8") as file:
                original = file.read()
            updated = replace_all(original)
            if updated != original:
                with open(filename, "w", encoding="utf-8", newline="\n") as file:
                    file.write(updated)
        if not os.path.exists("lear_main.py"):
            raise SystemExit("重命名失败：lear_main.py 不存在")
        PYEOF
    - name: Auto-patch source code
      run: |
        python3 - <<'PYEOF'
        import re

        filename = "lear_main.py"
        with open(filename, "r", encoding="utf-8") as file:
            content = file.read()
        updated = re.sub(
            r"cleaned\s*=\s*normalize_output_for_environment\([^\n]*\)",
            "cleaned = text",
            content,
        )
        updated = updated.replace(
            "r'.*?[。？！…]|.+$'",
            "r'(?s:.*?[。？！…]|.+$)'",
        )
        updated = updated.replace(
            'r".*?[。？！…]|.+$"',
            'r"(?s:.*?[。？！…]|.+$)"',
        )
        updated = re.sub(
            r"get_sentence_vector\(([^,\n]+),\s*sim_calc\.char_idf\)",
            r"get_sentence_vector(\1)",
            updated,
        )
        if "def visible_len" in updated:
            updated = re.sub(
                r"if len\(part\)\s*<\s*min_len:",
                "if visible_len(part) < min_len:",
                updated,
            )
        updated = re.sub(
            r"self\.is_web_mode\s*=\s*not\s*\([^\n]*\)",
            "self.is_web_mode = True",
            updated,
        )
        if updated != content:
            with open(filename, "w", encoding="utf-8", newline="\n") as file:
                file.write(updated)
        PYEOF
    - name: Generate Android project
      run: |
        set -euo pipefail
        mkdir -p app/src/main/java/com/lear/chatbot
        mkdir -p app/src/main/res/{layout,values,drawable,mipmap-anydpi}
        mkdir -p app/src/main/assets/chatbot app/src/main/python
        cat > lear_mobile.py <<'MOBILE_EOF'
        """Lossless, bounded-memory Android runtime. Build on CPython 3.10."""
        import array
        import functools
        import heapq
        import json
        import math
        import mmap
        import os
        import pickle
        import random
        import struct
        import threading
        from collections import defaultdict
        from collections.abc import Mapping
        from operator import itemgetter

        class BasicUnpickler(pickle.Unpickler):
            def find_class(self, module, name):
                raise pickle.UnpicklingError('Only basic data is allowed')

        def read_data(path):
            with open(path, 'rb') as f:
                return BasicUnpickler(f).load()

        def atomic_json_dump(path, value):
            temp = f'{path}.{os.getpid()}.{threading.get_ident()}.tmp'
            try:
                with open(temp, 'w', encoding='utf-8') as f:
                    json.dump(value, f, ensure_ascii=False, separators=(',', ':'))
                    f.flush()
                    os.fsync(f.fileno())
                os.replace(temp, path)
            finally:
                if os.path.exists(temp):
                    os.remove(temp)

        class PackedVectors(Mapping):
            def __init__(self, path, keys, dim):
                self.rows = {key: i for i, key in enumerate(keys)}
                self.row = struct.Struct('<' + 'd' * dim)
                with open(path, 'rb') as f:
                    if os.fstat(f.fileno()).st_size != len(keys) * self.row.size:
                        raise ValueError('Invalid vector file size')
                    self.data = mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_READ)
                self.get_row = functools.lru_cache(maxsize=256)(self._get_row)
            def _get_row(self, index):
                return self.row.unpack_from(self.data, index * self.row.size)
            def __getitem__(self, key):
                return self.get_row(self.rows[key])
            def __iter__(self):
                return iter(self.rows)
            def __len__(self):
                return len(self.rows)

        class QuestionVectors(Mapping):
            def __init__(self, calculator):
                self.calculator = calculator
                self.cached = functools.lru_cache(maxsize=2048)(self._compute)
            def _compute(self, question):
                vector = self.calculator.vector_manager.get_sentence_vector(question)
                return None if vector is None else array.array('d', vector)
            def __getitem__(self, key):
                if key not in self.calculator._exact_question_groups:
                    raise KeyError(key)
                return self.cached(key)
            def __iter__(self):
                return iter(self.calculator._exact_question_groups)
            def __len__(self):
                return len(self.calculator._exact_question_groups)

        class GroupPostings(Mapping):
            def __init__(self, path, offsets, groups, scored):
                self.offsets, self.groups, self.scored = offsets, groups, scored
                self.row = struct.Struct('<Id' if scored else '<I')
                with open(path, 'rb') as f:
                    self.data = mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_READ)
                for start, count in offsets.values():
                    if start < 0 or count < 0 or start + count*self.row.size > len(self.data):
                        raise ValueError('Invalid posting bounds')
            def numeric_rows(self, key):
                bounds = self.offsets.get(key)
                if bounds is None:
                    return iter(())
                start, count = bounds
                return self.row.iter_unpack(memoryview(self.data)[start:start+count*self.row.size])
            def __getitem__(self, key):
                if key not in self.offsets:
                    raise KeyError(key)
                if self.scored:
                    return ((self.groups[i], score) for i, score in self.numeric_rows(key))
                return (self.groups[i] for (i,) in self.numeric_rows(key))
            def __iter__(self):
                return iter(self.offsets)
            def __len__(self):
                return len(self.offsets)

        def install(m, directory):
            if getattr(m, '_mobile_installed', False):
                return
            meta = read_data(os.path.join(directory, 'mobile_meta.pkl'))
            groups = list(m.corpus)
            if meta['format'] != 1 or meta['doc_count'] != len(groups):
                raise ValueError('Robot corpus and index do not match')
            def file(name):
                return os.path.join(directory, name)
            class MobileIndex(m.InvertedIndex):
                def __init__(self, corpus, corpus_path, n=2, k1=1.2, b=0.75):
                    if corpus is not m.corpus or (n, k1, b) != (2, 1.2, 0.75):
                        raise ValueError('Unsupported index configuration')
                    self.n, self.k1, self.b = n, k1, b
                    self.idf = meta['idf']
                    self.doc_count = meta['doc_count']
                    self.avg_doc_len = meta['avg_doc_len']
                    self.corpus_signature = meta['signature']
                    self.index = GroupPostings(file('bm25.bin'), meta['bm25_offsets'], groups, True)
                    self.doc_lengths, self.doc_norms = {}, {}
                def retrieve_candidates(self, text, top_k=128):
                    if not text or top_k <= 0:
                        return []
                    scores = {}
                    for gram in dict.fromkeys(self._generate_ngrams_list(text, self.n)):
                        for i, score in self.index.numeric_rows(gram):
                            scores[i] = scores.get(i, 0.0) + score
                    return [groups[i] for i, _ in heapq.nlargest(top_k, scores.items(), key=itemgetter(1))]
            original_prepare = m.PurePythonVectorManager.prepare_idf_weighted_vectors
            def vector_init(self, vector_json_path='word_vectors.json'):
                self.dim = meta['dim']
                self.vectors = PackedVectors(file('char_vectors.bin'), meta['vector_keys'], self.dim)
                self._mobile_weighted = PackedVectors(file('weighted_vectors.bin'), meta['vector_keys'], self.dim)
                self.idf_weighted_vectors = self._mobile_weighted
                self.vector_source_signature = meta['vector_signature']
                self.vector_json_path = vector_json_path
                self.available = True
            def prepare(self, idf):
                if idf == meta['char_idf']:
                    self.idf_weighted_vectors = self._mobile_weighted
                else:
                    original_prepare(self, idf)
            def initialize(self, corpus, corpus_path):
                try:
                    self.use_parallel = False
                    self.inverted_index = MobileIndex(corpus, corpus_path)
                    self._exact_question_groups = {q: tuple(groups[i] for i in ids) for q, ids in meta['exact'].items()}
                    self._char_group_postings = GroupPostings(file('chars.bin'), meta['char_offsets'], groups, False)
                    self._char_recall_idf = meta['char_recall_idf']
                    self.char_idf = meta['char_idf']
                    self.corpus_vectors = QuestionVectors(self)
                    self._mobile_error = None
                except Exception as error:
                    self._mobile_error = str(error)
                    self.inverted_index = None
                finally:
                    self._index_ready_event.set()
            def retrieve_chars(self, text, subset, top_k):
                if not text or top_k <= 0:
                    return []
                chars = {c for c in text if not c.isspace() and c not in m.InvertedIndex.STOP_CHARS}
                full = subset is self._corpus_ref
                scores = {}
                for char in chars:
                    weight = self._char_recall_idf.get(char, 1.0)
                    for (i,) in self._char_group_postings.numeric_rows(char):
                        if full or groups[i] in subset:
                            scores[i] = scores.get(i, 0.0) + weight
                return [groups[i] for i, _ in heapq.nlargest(top_k, scores.items(), key=itemgetter(1))]
            m.InvertedIndex = MobileIndex
            m.PurePythonVectorManager.__init__ = vector_init
            m.PurePythonVectorManager.prepare_idf_weighted_vectors = prepare
            m.SimilarityCalculator._initialize_index_background = initialize
            m.SimilarityCalculator._retrieve_char_candidates = retrieve_chars

            # O(input length * idiom length) lookup; preserve original dictionary ordering.
            entries = list(m.idioms.items())
            exact = {word: i for i, (word, _) in enumerate(entries)}
            lengths = sorted({len(word) for word, _ in entries if word})
            wildcards = defaultdict(list)
            for word, i in exact.items():
                for at in range(len(word)):
                    wildcards[word[:at]+'\0'+word[at+1:]].append(i)
            original_explain = m.IdiomExplainer.explain
            def explain(self, text):
                if self.idioms is not m.idioms:
                    return original_explain(self, text)
                if len(text) > 11:
                    return None
                found, fuzzy = set(), set()
                for length in lengths:
                    for start in range(len(text)-length+1):
                        word = text[start:start+length]
                        if word in exact:
                            found.add(exact[word])
                        for at in range(length):
                            fuzzy.update(wildcards.get(word[:at]+'\0'+word[at+1:], ()))
                results = []
                for i in sorted(found or fuzzy):
                    idiom, meaning = entries[i]
                    prefix = '' if found else f'你想说的应该是“{idiom}”。'
                    results.append(f'{prefix}{idiom}的意思是：{meaning}')
                    self.context_manager.update_context('last_function', 'idiom')
                    self.context_manager.update_context('last_idiom', idiom)
                if not results:
                    return None
                result = '\n'.join(results)
                if random.random() < 0.25:
                    result += '\n' + random.choice(['还有其他成语需要我解释的吗？', '如果还有其他的成语不认识，尽管问我。'])
                return result
            m.IdiomExplainer.explain = explain
            m.WEB_SESSION_MANAGER.max_sessions = 1
            m.WEB_SESSION_MANAGER.session_ttl_seconds = 365 * 86400
            m._mobile_installed = True

        def pack(m, directory):
            import hashlib
            from pathlib import Path
            out = Path(directory)
            out.mkdir(parents=True, exist_ok=True)
            groups = list(m.corpus)
            ids = {g: i for i, g in enumerate(groups)}
            idx = m.InvertedIndex(m.corpus, str(out/'nonexistent_source'))
            char_idf = {}
            for gram, weight in idx.idf.items():
                for char in gram:
                    char_idf[char] = max(char_idf.get(char, 0.0), weight)
            exact, chars = defaultdict(list), defaultdict(list)
            for i, group in enumerate(groups):
                unique = set()
                for question in group:
                    exact[question].append(i)
                    unique.update(c for c in question if not c.isspace() and c not in idx.STOP_CHARS)
                for char in unique:
                    chars[char].append(i)
            bm25_offsets, char_offsets = {}, {}
            row = struct.Struct('<Id')
            with (out/'bm25.bin').open('wb') as f:
                for gram, postings in idx.index.items():
                    bm25_offsets[gram] = (f.tell(), len(postings))
                    for group, score in postings:
                        f.write(row.pack(ids[group], score))
            with (out/'chars.bin').open('wb') as f:
                for char, postings in chars.items():
                    char_offsets[char] = (f.tell(), len(postings))
                    values = array.array('I', postings)
                    import sys
                    if sys.byteorder != 'little':
                        values.byteswap()
                    f.write(values.tobytes())
            vm = m.PurePythonVectorManager('word_vectors.json')
            if not vm.available:
                raise ValueError('Missing or invalid semantic vectors')
            vm.prepare_idf_weighted_vectors(char_idf)
            keys = list(vm.vectors)
            row = struct.Struct('<' + 'd'*vm.dim)
            for filename, table in [('char_vectors.bin', vm.vectors), ('weighted_vectors.bin', vm.idf_weighted_vectors)]:
                with (out/filename).open('wb') as f:
                    for key in keys:
                        f.write(row.pack(*table[key]))
            meta = dict(format=1, doc_count=len(groups), avg_doc_len=idx.avg_doc_len,
                        signature=idx.corpus_signature, idf=idx.idf, char_idf=char_idf,
                        bm25_offsets=bm25_offsets, char_offsets=char_offsets, exact=dict(exact),
                        char_recall_idf={c: math.log((len(groups)-len(p)+.5)/(len(p)+.5)+1) for c,p in chars.items()},
                        dim=vm.dim, vector_keys=keys,
                        vector_signature=hashlib.sha256(Path('word_vectors.json').read_bytes()).hexdigest())
            for name, data in [('corpus.pkl', m.corpus), ('mobile_meta.pkl', meta)]:
                with (out/name).open('wb') as f:
                    pickle.dump(data, f, protocol=4)
            print(json.dumps(dict(groups=len(groups), questions=len(exact), idioms=len(m.idioms), dimension=vm.dim)))

        if __name__ == '__main__':
            import sys
            import lear_main
            pack(lear_main, sys.argv[1])
        MOBILE_EOF
        python3 - <<'MOBILE_PY'
        from pathlib import Path
        p = Path('lear_main.py')
        s = p.read_text()
        def change(old, new):
            global s
            assert s.count(old) == 1, old
            s = s.replace(old, new)
        change('        return left ** right', '''        if isinstance(left, int) and isinstance(right, int) and right > 0 and abs(left) > 1:
                    if (left.bit_length() - 1) * right > 16384:
                        raise ValueError("计算结果过大")
                return left ** right''')
        change('    result = evaluate(tree)', '''    unchecked_evaluate = evaluate
            def evaluate(node):
                value = unchecked_evaluate(node)
                if isinstance(value, float) and not math.isfinite(value):
                    raise ValueError("计算结果不是有限数值")
                if isinstance(value, int) and value.bit_length() > 16384:
                    raise ValueError("计算结果过大")
                return value
            result = evaluate(tree)''')
        change('''            with open(self.filename, "w", encoding="utf-8") as f:
                        json.dump(self.knowledge, f, ensure_ascii=False, indent=4)''', '''            from lear_mobile import atomic_json_dump
                    atomic_json_dump(self.filename, self.knowledge)''')
        change("""            with open(self.preference_file, 'w', encoding='utf-8') as f:
                        json.dump(data_to_save, f, ensure_ascii=False, indent=4)""", '''            from lear_mobile import atomic_json_dump
                    atomic_json_dump(self.preference_file, data_to_save)''')
        p.write_text(s)
        MOBILE_PY
        python3 lear_mobile.py app/src/main/assets/chatbot
        python3 - <<'MOBILE_PY'
        from pathlib import Path
        import hashlib, json, py_compile, shutil, sys
        assert sys.version_info[:2] == (3, 10), 'Build Python must match Android Python 3.10'
        out=Path('app/src/main/assets/chatbot')
        for name in ('lear_main','chatbot_words','chatbot_idioms','lear_mobile'):
            shutil.copyfile(name+'.py',out/(name+'.py'))
        (out/'chatbot_data.py').write_text("import os\nfrom lear_mobile import read_data\ncorpus=read_data(os.path.join(os.path.dirname(__file__), 'corpus.pkl'))\n")
        for p in out.glob('*.py'):
            py_compile.compile(str(p),cfile=str(p.with_suffix('.pyc')),dfile=p.name,doraise=True,invalidation_mode=py_compile.PycInvalidationMode.CHECKED_HASH)
            p.unlink()
        for name in ('word_vectors.json','bundle_version.txt','bundle_manifest.json'):
            (out/name).unlink(missing_ok=True)
        manifest={p.name:{'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.iterdir()) if p.is_file()}
        text=json.dumps(manifest,sort_keys=True,separators=(',',':'))
        (out/'bundle_manifest.json').write_text(text)
        (out/'bundle_version.txt').write_text(hashlib.sha256(text.encode()).hexdigest()+'\n')
        MOBILE_PY
        cat > app/src/main/python/bootstrap.py <<'PYEOF'
        import gc
        import json
        import os
        import sys
        import threading
        import traceback
        from collections import deque
        _lear_main = None
        _shared_similarity_calculator = None
        _bridge_lock = threading.RLock()

        def _json(value):
            return json.dumps(value, ensure_ascii=False, default=str)

        def _style(value):
            text = '' if value is None else str(value)
            try:
                return _lear_main.apply_text_effects(text)
            except Exception:
                return text

        def _calculator(session):
            return getattr(getattr(getattr(session, 'engine', None), 'chatbot', None), 'similarity_calculator', None)

        def _start_new_session_locked():
            global _shared_similarity_calculator
            m = _lear_main
            for session in m.WEB_SESSION_MANAGER.sessions.values():
                calc = _calculator(session)
                if calc and calc._index_ready_event.is_set() and calc.inverted_index is not None:
                    _shared_similarity_calculator = calc
            original = m.SimilarityCalculator
            if _shared_similarity_calculator is not None:
                _shared_similarity_calculator.mode = '平衡'
                m.SimilarityCalculator = lambda *a, **kw: _shared_similarity_calculator
            try:
                m.WEB_SESSION_MANAGER.clear_all(collect_garbage=False)
                result = m.web_start_session()
                session = m.WEB_SESSION_MANAGER.sessions[result['session_id']]
                session._mobile_async = deque(maxlen=128)
                result['messages'] = [_style(x) for x in result['messages']]
                gc.collect(0)
                return result
            finally:
                m.SimilarityCalculator = original

        def init_backend(files_dir):
            global _lear_main
            try:
                with _bridge_lock:
                    os.chdir(files_dir)
                    if files_dir not in sys.path:
                        sys.path.insert(0, files_dir)
                    if _lear_main is None:
                        import lear_main
                        import lear_mobile
                        lear_mobile.install(lear_main, files_dir)
                        _lear_main = lear_main
                        original = lear_main.WebChatSession._record_message
                        def record(session, text):
                            with session._message_lock:
                                original(session, text)
                                queue = getattr(session, '_mobile_async', None)
                                if not session._closed and text is not None and session._capture_buffer is None and queue is not None:
                                    queue.append(str(text))
                        lear_main.WebChatSession._record_message = record
                        def emit(owner, text):
                            owner.type_like_human(text)
                        lear_main.ReminderBot._output_and_enqueue = emit
                        lear_main.TopicInitiator._output_and_enqueue = emit
                    return _json(_start_new_session_locked())
            except Exception as error:
                return _json({'error': str(error), 'traceback': traceback.format_exc()})

        def initialization_status(session_id=None):
            global _shared_similarity_calculator
            with _bridge_lock:
                if _lear_main is None:
                    return _json({'ready': False, 'successful': False})
                session = _lear_main.WEB_SESSION_MANAGER.sessions.get(str(session_id))
                calc = _calculator(session)
                ready = bool(calc and calc._index_ready_event.is_set())
                error = getattr(calc, '_mobile_error', None)
                success = bool(ready and not error and calc.inverted_index is not None and calc.vector_manager.available)
                if success:
                    _shared_similarity_calculator = calc
                return _json({'ready': ready, 'successful': success, 'error': error})

        def start_new_session():
            try:
                with _bridge_lock:
                    if _lear_main is None:
                        raise ValueError('系统仍在初始化中，请稍后。')
                    return _json(_start_new_session_locked())
            except Exception as error:
                return _json({'error': str(error), 'traceback': traceback.format_exc()})

        def process_message(text, session_id):
            try:
                with _bridge_lock:
                    if not isinstance(text, str) or len(text) > 4000:
                        raise ValueError('单条消息不能超过 4000 字。')
                    session = _lear_main.WEB_SESSION_MANAGER.get_session(str(session_id))
                    if session is None:
                        raise ValueError('当前会话已关闭，请新建会话。')
                    return _json({'session_id': session_id, 'replies': [_style(x) for x in session.chat(text)]})
            except Exception as error:
                return _json({'error': str(error), 'traceback': traceback.format_exc()})

        def poll_async(session_id):
            with _bridge_lock:
                session = _lear_main.WEB_SESSION_MANAGER.sessions.get(str(session_id)) if _lear_main else None
                if session is None:
                    return '[]'
                with session._message_lock:
                    messages = list(session._mobile_async)
                    session._mobile_async.clear()
                return _json([_style(x) for x in messages])

        def trim_memory():
            with _bridge_lock:
                calc = _shared_similarity_calculator
                if calc is not None:
                    calc.corpus_vectors.cached.cache_clear()
                    for table in (calc.vector_manager.vectors, calc.vector_manager.idf_weighted_vectors):
                        if hasattr(table, 'get_row'):
                            table.get_row.cache_clear()
                gc.collect(1)
        PYEOF
