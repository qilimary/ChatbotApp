            private suspend fun extractAssetsToDisk(): String = withContext(Dispatchers.IO) {
                val destination = File(filesDir, "chatbot")
                val staging = File(filesDir, "chatbot_staging")
                val backup = File(filesDir, "chatbot_previous")
                val marker = File(destination, ".asset_version")
                if (!destination.exists() && backup.exists()) {
                    check(backup.renameTo(destination)) { "无法恢复上次的机器人资源" }
                }
                val bundledVersion = assets.open(BUNDLE_VERSION_ASSET)
                    .bufferedReader(Charsets.US_ASCII)
                    .use { it.readText().trim() }
                check(bundledVersion.matches(Regex("[0-9a-f]{64}"))) {
                    "APK 中的机器人资源版本无效"
                }
                val manifest = JSONObject(assets.open("chatbot/bundle_manifest.json").bufferedReader().use { it.readText() })
                val fileNames = assets.list("chatbot") ?: emptyArray()
                check(fileNames.isNotEmpty()) { "APK 中未找到 chatbot 资源" }
                val markerMatches = runCatching {
                    marker.exists() && marker.readText().trim() == bundledVersion
                }.getOrDefault(false)
                val isCurrent = markerMatches && fileNames.all { fileName ->
                    val localFile = File(destination, fileName)
                    val expected = manifest.optJSONObject(fileName)
                    localFile.isFile && localFile.length() > 0L && (expected == null || localFile.length() == expected.getLong("size"))
                }
                if (!isCurrent) {
                    staging.deleteRecursively()
                    check(staging.mkdirs()) { "无法创建资源临时目录" }
                    for (fileName in fileNames) {
                        val outputFile = File(staging, fileName)
                        val digest = MessageDigest.getInstance("SHA-256")
                        DigestInputStream(assets.open("chatbot/$fileName"), digest).buffered(64 * 1024).use { input ->
                            outputFile.outputStream().buffered(64 * 1024).use { output -> input.copyTo(output, 64 * 1024) }
                        }
                        manifest.optJSONObject(fileName)?.let { expected ->
                            val checksum = digest.digest().joinToString("") { "%02x".format(it.toInt() and 255) }
                            check(outputFile.length() == expected.getLong("size") && checksum == expected.getString("sha256")) {
                                "机器人资源校验失败：$fileName"
                            }
                        }
                    }
                    for (fileName in PRESERVED_USER_FILE_NAMES) {
                        val existingFile = File(destination, fileName)
                        if (existingFile.isFile && existingFile.length() > 0L) {
                            existingFile.copyTo(File(staging, fileName), overwrite = true)
                        }
                    }
                    File(staging, ".asset_version").writeText(bundledVersion)
                    backup.deleteRecursively()
                    if (destination.exists()) {
                        check(destination.renameTo(backup)) { "无法备份旧机器人资源" }
                    }
                    if (!staging.renameTo(destination)) {
                        if (backup.exists()) backup.renameTo(destination)
                        error("无法替换本地机器人资源")
                    }
                    backup.deleteRecursively()
                }
                destination.absolutePath
            }
            private fun cacheInitializationRequired(filesPath: String): Boolean =
                !File(filesPath, "mobile_meta.pkl").isFile
            private fun initPython() {
                beginBusyOperation()
                isSessionStarting = true
                isBackendReady = false
                btnMenu.isEnabled = false
                btnNewSession.isEnabled = false
                drawerLayout.setDrawerLockMode(DrawerLayout.LOCK_MODE_LOCKED_CLOSED)
                updateComposerState("正在加载...")
                val targetSession = currentSession
                val generation = sessionGeneration
                lifecycleScope.launch {
                    var initializationNotice: ChatMessage? = null
                    var initializationCompleted = false
                    try {
                        val filesPath = extractAssetsToDisk()
                        if (cacheInitializationRequired(filesPath)) {
                            initializationNotice = ChatMessage(
                                INITIALIZATION_NOTICE,
                                isUser = false,
                                isSystem = true
                            ).also { notice ->
                                targetSession.messages.add(notice)
                                if (targetSession === currentSession &&
                                    generation == sessionGeneration
                                ) {
                                    chatAdapter.addMessage(notice)
                                    scrollToBottom(smooth = false)
                                    updateComposerState(INITIALIZATION_NOTICE)
                                }
                            }
                        }
                        val (loadedModule, result) = withContext(pythonDispatcher) {
                            if (!Python.isStarted()) Python.start(AndroidPlatform(applicationContext))
                            val module = Python.getInstance().getModule("bootstrap")
                            bootstrapModule = module
                            module to parseSessionStartResult(
                                module.callAttr("init_backend", filesPath).toString()
                            )
                        }
                        if (targetSession !== currentSession || generation != sessionGeneration) return@launch
                        if (result.error != null) {
                            showErrorDialog(
                                "Python 核心错误",
                                "${result.error}\n\n${result.traceback.orEmpty()}"
                            )
                        } else {
                            targetSession.id = result.sessionId
                            appendInitialMessages(targetSession, result.messages)
                            chatAdapter.setMessages(targetSession.messages)
                            scrollToBottom(smooth = false)
                            val initialization = awaitBackendInitialization(
                                loadedModule,
                                result.sessionId,
                                targetSession,
                                generation
                            )
                            if (!initialization.ready || !initialization.successful) {
                                error(
                                    initialization.error
                                        ?: "本地索引或语义缓存初始化失败"
                                )
                            }
                            initializationCompleted = true
                            isBackendReady = true
                            inputMessage.hint = "输入消息..."
                            startPolling()
                        }
                    } catch (error: Throwable) {
                        if (error !is CancellationException) {
                            inputMessage.hint = "初始化失败"
                            showErrorDialog("底层环境异常", error.stackTraceToString())
                        }
                    } finally {
                        initializationNotice?.let { notice ->
                            targetSession.messages.remove(notice)
                            if (targetSession === currentSession &&
                                generation == sessionGeneration
                            ) {
                                chatAdapter.setMessages(targetSession.messages)
                                scrollToBottom(smooth = false)
                                if (initializationCompleted) {
                                    Toast.makeText(
                                        this@MainActivity,
                                        "初始化完成",
                                        Toast.LENGTH_SHORT
                                    ).show()
                                }
                            }
                        }
                        endBusyOperation()
                        btnMenu.isEnabled = true
                        btnNewSession.isEnabled = true
                        drawerLayout.setDrawerLockMode(DrawerLayout.LOCK_MODE_UNLOCKED)
                        if (targetSession === currentSession && generation == sessionGeneration) {
                            isSessionStarting = false
                            updateComposerState()
                        }
                    }
                }
            }
            private suspend fun awaitBackendInitialization(
                module: PyObject,
                sessionId: String?,
                targetSession: ChatSession,
                generation: Long
            ): InitializationStatus {
                val deadline = SystemClock.uptimeMillis() + INITIALIZATION_TIMEOUT_MS
                var latest = InitializationStatus(ready = false, successful = false)
                while (SystemClock.uptimeMillis() < deadline) {
                    if (targetSession !== currentSession || generation != sessionGeneration) {
                        throw CancellationException("会话已切换")
                    }
                    latest = withContext(pythonDispatcher) {
                        parseInitializationStatus(
                            module.callAttr(
                                "initialization_status",
                                sessionId ?: ""
                            ).toString()
                        )
                    }
                    if (latest.ready) return latest
                    delay(500L)
                }
                return latest.copy(error = latest.error ?: "初始化等待超过三分钟")
            }
            private fun parseInitializationStatus(jsonText: String): InitializationStatus {
                val json = JSONObject(jsonText)
                return InitializationStatus(
                    ready = json.optBoolean("ready", false),
                    successful = json.optBoolean("successful", false),
                    error = json.optString("error", "").takeIf { it.isNotBlank() }
                )
            }
            private fun parseSessionStartResult(jsonText: String): SessionStartResult {
                val json = JSONObject(jsonText)
                if (json.has("error")) {
                    return SessionStartResult(
                        sessionId = null,
                        messages = emptyList(),
                        error = json.optString("error", "未知错误"),
                        traceback = json.optString("traceback", "")
                    )
                }
                val messages = json.optJSONArray("messages").toStringList()
                return SessionStartResult(
                    sessionId = json.optNullableString("session_id"),
                    messages = messages
                )
            }
            private fun parseMessageResult(jsonText: String): MessageResult {
                val json = JSONObject(jsonText)
                if (json.has("error")) {
                    return MessageResult(
                        sessionId = null,
                        replies = emptyList(),
                        error = json.optString("error", "未知错误"),
                        traceback = json.optString("traceback", "")
                    )
                }
                return MessageResult(
                    sessionId = json.optNullableString("session_id"),
                    replies = json.optJSONArray("replies").toStringList()
                )
            }
            private fun JSONObject.optNullableString(key: String): String? =
                if (!has(key) || isNull(key)) null else optString(key).takeIf { it.isNotEmpty() }
            private fun JSONArray?.toStringList(): List<String> {
                if (this == null || length() == 0) return emptyList()
                return List(length()) { index -> optString(index, "") }
            }
            private fun appendInitialMessages(session: ChatSession, rawMessages: List<String>) {
                for (rawText in rawMessages) {
                    val text = cleanText(rawText)
                    if (text.isBlank()) continue
                    val message = ChatMessage(text, isUser = false, isSystem = isSystemMessage(text))
                    message.displaySpannable = parseAnsiToSpannable(text)
                    session.messages.add(message)
                }
            }
            private fun startPolling() {
                if (pollingJob?.isActive == true || !lifecycle.currentState.isAtLeast(Lifecycle.State.STARTED)) return
                pollingJob = lifecycleScope.launch {
                    while (isActive && lifecycle.currentState.isAtLeast(Lifecycle.State.STARTED)) {
                        delay(1000L)
                        if (!lifecycle.currentState.isAtLeast(Lifecycle.State.STARTED)) break
                        val module = bootstrapModule ?: continue
                        val targetSession = currentSession
                        val generation = sessionGeneration
                        if (targetSession.id == null || isSessionStarting || isProcessing) continue
                        try {
                            val resultText = withContext(pythonDispatcher) {
                                module.callAttr("poll_async", targetSession.id).toString()
                            }
                            if (targetSession !== currentSession || generation != sessionGeneration) continue
                            if (resultText.isBlank() || resultText == "[]") continue
                            val messages = JSONArray(resultText).toStringList()
                            var hasNewMessage = false
                            for (rawReply in messages) {
                                val cleanReply = cleanText(rawReply)
                                if (cleanReply.isBlank()) continue
                                addBotReply(targetSession, cleanReply, generation)
                                hasNewMessage = true
                            }
                            if (hasNewMessage) {
                                if (isChatNearBottom()) scrollToBottom()
                                scheduleHistorySave()
                                refreshHistory()
                                updateComposerState()
                            }
                        } catch (error: CancellationException) {
                            throw error
                        } catch (_: Exception) {
                            // 异步轮询失败不应让主界面崩溃，下次轮询会自动重试。
                        }
                    }
                }
            }
            private suspend fun addBotReply(
                targetSession: ChatSession,
                cleanReply: String,
                generation: Long
            ) {
                val botMessage = ChatMessage(
                    cleanReply,
                    isUser = false,
                    isSystem = isSystemMessage(cleanReply)
                )
                if (isTypewriterEnabled && !botMessage.isSystem) botMessage.displaySpannable = ""
                targetSession.messages.add(botMessage)
                val adapterPosition = if (targetSession === currentSession && generation == sessionGeneration) {
                    chatAdapter.addMessage(botMessage)
                } else {
                    -1
                }
                if (targetSession === currentSession && generation == sessionGeneration) {
                    speakMessageIfNeeded(botMessage)
                }
                if (isTypewriterEnabled && !botMessage.isSystem && adapterPosition >= 0 && lifecycle.currentState.isAtLeast(Lifecycle.State.STARTED)) {
                    animateTypewriter(botMessage, cleanReply, targetSession, generation, adapterPosition)
                } else {
                    botMessage.displaySpannable = parseAnsiToSpannable(cleanReply)
                    if (adapterPosition >= 0) chatAdapter.notifyItemChanged(adapterPosition, PAYLOAD_TYPING)
                }
            }
            private suspend fun animateTypewriter(
                botMessage: ChatMessage, fullText: String, targetSession: ChatSession,
                generation: Long, adapterPosition: Int
            ) {
                val fullSpan = parseAnsiToSpannable(fullText)
                val offsets = ArrayList<Int>()
                var offset = 0
                while (offset < fullSpan.length) {
                    offset += Character.charCount(Character.codePointAt(fullSpan, offset))
                    offsets.add(offset)
                }
                if (offsets.isEmpty()) { botMessage.displaySpannable = fullSpan; return }
                val duration = (350L + offsets.size * 9L).coerceAtMost(6500L)
                val started = SystemClock.uptimeMillis()
                var shown = 0
                var lastScroll = 0L
                try {
                    while (shown < offsets.size) {
                        if (targetSession !== currentSession || generation != sessionGeneration ||
                            !lifecycle.currentState.isAtLeast(Lifecycle.State.STARTED)) break
                        val now = SystemClock.uptimeMillis()
                        val progress = ((now - started).toDouble() / duration).coerceIn(0.0, 1.0)
                        val count = (offsets.size * (0.25 * progress + 0.75 * progress * progress)).toInt()
                            .coerceIn(1, offsets.size)
                        if (count != shown) {
                            shown = count
                            botMessage.displaySpannable = fullSpan.subSequence(0, offsets[count - 1])
                            if (chatAdapter.isSameMessage(adapterPosition, botMessage.localId)) {
                                chatAdapter.notifyItemChanged(adapterPosition, PAYLOAD_TYPING)
                                if (now - lastScroll >= 80L && isChatNearBottom()) {
                                    scrollToBottom(false)
                                    lastScroll = now
                                }
                            }
                        }
                        if (progress >= 1.0) break
                        delay(16L)
                    }
                } finally {
                    botMessage.displaySpannable = fullSpan
                    if (chatAdapter.isSameMessage(adapterPosition, botMessage.localId))
                        chatAdapter.notifyItemChanged(adapterPosition, PAYLOAD_TYPING)
                }
            }
            private fun processImage(uri: Uri) {
                if (isOcrProcessing || !isBackendReady || isProcessing ||
                    currentSession.messages.size >= MAX_MESSAGES || !inputMessage.isEnabled) return
                isOcrProcessing = true
                beginBusyOperation()
                updateComposerState()
                val targetSession = currentSession
                val generation = sessionGeneration
                val userMessage = ChatMessage("", isUser = true, imageUri = uri.toString())
                targetSession.messages.add(userMessage)
                chatAdapter.addMessage(userMessage)
                scrollToBottom()
                ensureSessionInHistory(targetSession)
                scheduleHistorySave()
                refreshHistory()
                lifecycleScope.launch {
                    try {
                        val text = withContext(Dispatchers.IO) {
                            val bitmap = decodeOcrBitmap(uri)
                            val recognizer = TextRecognition.getClient(ChineseTextRecognizerOptions.Builder().build())
                            try {
                                Tasks.await(recognizer.process(InputImage.fromBitmap(bitmap, 0))).text.trim()
                            } finally {
                                recognizer.close()
                                bitmap.recycle()
                            }
                        }
                        if (targetSession !== currentSession || generation != sessionGeneration) return@launch
                        if (text.isBlank()) {
                            Toast.makeText(this@MainActivity, "图片中未找到任何文字", Toast.LENGTH_SHORT).show()
                        } else {
                            addBotReply(targetSession, "【图片识别提取的文字】：\n$text", generation)
                            scheduleHistorySave()
                            refreshHistory()
                        }
                    } catch (error: CancellationException) {
                        throw error
                    } catch (_: Exception) {
                        Toast.makeText(this@MainActivity, "图片识别失败，请尝试其他图片", Toast.LENGTH_SHORT).show()
                    } finally {
                        isOcrProcessing = false
                        endBusyOperation()
                        updateComposerState()
                    }
                }
            }
            private fun decodeOcrBitmap(uri: Uri): Bitmap {
                if (Build.VERSION.SDK_INT >= 28) {
                    return ImageDecoder.decodeBitmap(ImageDecoder.createSource(contentResolver, uri)) { decoder, info, _ ->
                        decoder.allocator = ImageDecoder.ALLOCATOR_SOFTWARE
                        val scale = minOf(1.0, 2560.0 / maxOf(info.size.width, info.size.height))
                        decoder.setTargetSize(maxOf(1, (info.size.width * scale).toInt()), maxOf(1, (info.size.height * scale).toInt()))
                    }
                }
                val bitmap = decodeSampledBitmap(uri, 1280, 1280) ?: error("图片无法解码")
                val orientation = runCatching {
                    contentResolver.openInputStream(uri)?.use {
                        ExifInterface(it).getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL)
                    }
                }.getOrNull() ?: ExifInterface.ORIENTATION_NORMAL
                val matrix = Matrix()
                when (orientation) {
                    ExifInterface.ORIENTATION_FLIP_HORIZONTAL -> matrix.setScale(-1f, 1f)
                    ExifInterface.ORIENTATION_ROTATE_180 -> matrix.setRotate(180f)
                    ExifInterface.ORIENTATION_FLIP_VERTICAL -> matrix.setScale(1f, -1f)
                    ExifInterface.ORIENTATION_TRANSPOSE -> { matrix.setRotate(90f); matrix.postScale(-1f, 1f) }
                    ExifInterface.ORIENTATION_ROTATE_90 -> matrix.setRotate(90f)
                    ExifInterface.ORIENTATION_TRANSVERSE -> { matrix.setRotate(-90f); matrix.postScale(-1f, 1f) }
                    ExifInterface.ORIENTATION_ROTATE_270 -> matrix.setRotate(-90f)
                }
                if (matrix.isIdentity) return bitmap
                val rotated = Bitmap.createBitmap(bitmap, 0, 0, bitmap.width, bitmap.height, matrix, true)
                if (rotated !== bitmap) bitmap.recycle()
                return rotated
            }
            private fun sendMessage() {
                val module = bootstrapModule ?: return
                if (isProcessing || isSessionStarting || !isBackendReady || !btnSend.isEnabled) return
                val text = inputMessage.text.toString().trim()
                if (text.isEmpty()) return
                val targetSession = currentSession
                val generation = sessionGeneration
                val sessionId = targetSession.id
                if (::tts.isInitialized) tts.stop()
                inputMessage.setText("")
                inputMessage.clearFocus()
                (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager)
                    .hideSoftInputFromWindow(inputMessage.windowToken, 0)
                val isFirstUserMessage = targetSession.messages.none { it.isUser }
                if (isFirstUserMessage) {
                    targetSession.preview = if (text.length > 12) text.take(12) + "..." else text
                    ensureSessionInHistory(targetSession)
                }
                val userMessage = ChatMessage(text, isUser = true)
                targetSession.messages.add(userMessage)
                chatAdapter.addMessage(userMessage)
                scrollToBottom()
                scheduleHistorySave()
                refreshHistory()
                isProcessing = true
                btnSend.text = "发送中"
                beginBusyOperation()
                updateComposerState()
                messageJob = lifecycleScope.launch {
                    try {
                        val result = withContext(pythonDispatcher) {
                            parseMessageResult(
                                module.callAttr("process_message", text, sessionId).toString()
                            )
                        }
                        if (result.error != null) {
                            if (targetSession === currentSession && generation == sessionGeneration) {
                                showErrorDialog(
                                    "Python 处理错误",
                                    "${result.error}\n\n${result.traceback.orEmpty()}"
                                )
                            }
                        } else {
                            if (result.sessionId != null) targetSession.id = result.sessionId
                            for (reply in result.replies) {
                                val cleanReply = cleanText(reply)
                                if (cleanReply.isNotBlank()) {
                                    addBotReply(targetSession, cleanReply, generation)
                                }
                            }
                            scheduleHistorySave()
                            refreshHistory()
                            if (targetSession === currentSession && generation == sessionGeneration) {
                                scrollToBottom()
                            }
                        }
                    } catch (error: Throwable) {
                        if (error !is CancellationException &&
                            targetSession === currentSession &&
                            generation == sessionGeneration
                        ) {
                            showErrorDialog("环境通信异常", error.stackTraceToString())
                        }
                    } finally {
                        endBusyOperation()
                        if (targetSession === currentSession && generation == sessionGeneration) {
                            isProcessing = false
                            btnSend.text = "发送"
                            updateComposerState()
                        }
                    }
                }
            }
            private fun startNewSession(force: Boolean = false) {
                if (!force && currentSession.messages.isEmpty()) {
                    drawerLayout.closeDrawer(GravityCompat.START)
                    return
                }
                if (::tts.isInitialized) tts.stop()
                typingJobs.values.forEach { it.cancel() }
                typingJobs.clear()
                sessionStartJob?.cancel()
                releaseInactiveSpans(except = null)
                sessionGeneration += 1L
                val generation = sessionGeneration
                val newSession = ChatSession()
                currentSession = newSession
                isProcessing = false
                btnSend.text = "发送"
                chatAdapter.setMessages(newSession.messages)
                drawerLayout.closeDrawer(GravityCompat.START)
                val module = bootstrapModule
                if (module == null) {
                    updateComposerState("正在加载...")
                    return
                }
                beginBusyOperation()
                isSessionStarting = true
                isBackendReady = false
                updateComposerState("正在加载...")
                sessionStartJob = lifecycleScope.launch {
                    try {
                        val result = withContext(pythonDispatcher) {
                            parseSessionStartResult(module.callAttr("start_new_session").toString())
                        }
                        if (newSession !== currentSession || generation != sessionGeneration) return@launch
                        if (result.error != null) {
                            showErrorDialog(
                                "Python 初始化错误",
                                "${result.error}\n\n${result.traceback.orEmpty()}"
                            )
                        } else {
                            newSession.id = result.sessionId
                            appendInitialMessages(newSession, result.messages)
                            chatAdapter.setMessages(newSession.messages)
                            scrollToBottom(smooth = false)
                            val initialization = awaitBackendInitialization(
                                module,
                                result.sessionId,
                                newSession,
                                generation
                            )
                            if (!initialization.ready || !initialization.successful) {
                                error(
                                    initialization.error
                                        ?: "本地索引或语义缓存加载失败"
                                )
                            }
                            isBackendReady = true
                            newSession.messages.forEach { speakMessageIfNeeded(it) }
                            inputMessage.hint = "输入消息..."
                        }
                    } catch (error: Throwable) {
                        if (error !is CancellationException &&
                            newSession === currentSession &&
                            generation == sessionGeneration
                        ) {
                            showErrorDialog("重启对话异常", error.stackTraceToString())
                        }
                    } finally {
                        endBusyOperation()
                        if (newSession === currentSession && generation == sessionGeneration) {
                            isSessionStarting = false
                            updateComposerState()
                        }
                    }
                }
            }
            private fun loadSession(session: ChatSession) {
                drawerLayout.closeDrawer(GravityCompat.START)
                if (session === currentSession) return
                if (::tts.isInitialized) tts.stop()
                typingJobs.values.forEach { it.cancel() }
                typingJobs.clear()
                sessionStartJob?.cancel()
                releaseInactiveSpans(except = session)
                sessionGeneration += 1L
                val generation = sessionGeneration
                currentSession = session
                isProcessing = false
                btnSend.text = "发送"
                session.messages.forEach { message ->
                    if (message.displaySpannable == null && !message.isUser) {
                        message.displaySpannable = parseAnsiToSpannable(message.text)
                    }
                }
                chatAdapter.setMessages(session.messages)
                scrollToBottom(smooth = false)
                refreshHistory()
                val module = bootstrapModule
                if (module == null) {
                    updateComposerState("正在加载...")
                    return
                }
                // Python 会话只存在于当前进程中。载入历史记录时创建一个新的底层会话，
                // 避免把上次运行留下的失效 session_id 继续传给后端。
                beginBusyOperation()
                isSessionStarting = true
                isBackendReady = false
                updateComposerState("正在加载...")
                sessionStartJob = lifecycleScope.launch {
                    try {
                        val result = withContext(pythonDispatcher) {
                            parseSessionStartResult(module.callAttr("start_new_session").toString())
                        }
                        if (session !== currentSession || generation != sessionGeneration) return@launch
                        if (result.error != null) {
                            showErrorDialog(
                                "Python 初始化错误",
                                "${result.error}\n\n${result.traceback.orEmpty()}"
                            )
                        } else {
                            session.id = result.sessionId
                            val initialization = awaitBackendInitialization(
                                module,
                                result.sessionId,
                                session,
                                generation
                            )
                            if (!initialization.ready || !initialization.successful) {
                                error(
                                    initialization.error
                                        ?: "本地索引或语义缓存加载失败"
                                )
                            }
                            isBackendReady = true
                        }
                    } catch (error: Throwable) {
                        if (error !is CancellationException &&
                            session === currentSession &&
                            generation == sessionGeneration
                        ) {
                            showErrorDialog("载入对话异常", error.stackTraceToString())
                        }
                    } finally {
                        endBusyOperation()
                        if (session === currentSession && generation == sessionGeneration) {
                            isSessionStarting = false
                            updateComposerState()
                        }
                    }
                }
            }
            private fun ensureSessionInHistory(session: ChatSession) {
                if (histories.none { it === session }) histories.add(0, session)
                trimHistories()
            }
            private fun trimHistories() {
                while (histories.size > MAX_HISTORY) {
                    val removed = histories.removeAt(histories.lastIndex)
                    removed.messages.forEach { it.displaySpannable = null }
                }
            }
            private fun releaseInactiveSpans(except: ChatSession?) {
                histories.forEach { session ->
                    if (session !== except) session.messages.forEach { it.displaySpannable = null }
                }
            }
            private fun deleteSession(session: ChatSession) {
                val index = histories.indexOfFirst { it === session }
                if (index >= 0) histories.removeAt(index)
                session.messages.forEach { it.displaySpannable = null }
                scheduleHistorySave(immediate = true)
                refreshHistory()
                if (currentSession === session) startNewSession(force = true)
            }
            private fun isSystemMessage(text: String): Boolean {
                val visibleText = stripAnsi(text).trim()
                return visibleText.startsWith("【") && visibleText.endsWith("】")
            }
            private fun updateComposerState(forcedHint: String? = null) {
                val messageLimitReached = currentSession.messages.size >= MAX_MESSAGES
                val key = currentSession.localId to currentSession.messages.size
                if (composerKey != key) {
                    composerKey = key
                    val endKeywords = listOf(
                        "结束", "终止", "离开", "踢出", "换个话题", "重新开始",
                        "逃离", "逃跑", "中断", "下线", "再见"
                    )
                    composerEndIndex = currentSession.messages.indexOfLast { message ->
                        message.isSystem && endKeywords.any { keyword -> message.text.contains(keyword) }
                    }
                    val userMessagesAfterEnd = if (composerEndIndex >= 0) {
                        currentSession.messages
                            .asSequence()
                            .drop(composerEndIndex + 1)
                            .count { it.isUser }
                    } else {
                        0
                    }
                    composerHardLocked = composerEndIndex >= 0 && userMessagesAfterEnd >= 1
                }
                val endSystemIndex = composerEndIndex
                val hardLocked = composerHardLocked
                val canUseInput = !messageLimitReached && !hardLocked
                inputMessage.isEnabled = canUseInput
                inputMessage.hint = forcedHint ?: when {
                    messageLimitReached -> "您已到达最大对话限制（300条）"
                    hardLocked -> "对话已彻底锁定"
                    endSystemIndex >= 0 -> "对话已结束(还可发送最后一条)"
                    isSessionStarting || !isBackendReady -> "正在加载..."
                    else -> "输入消息..."
                }
                val backendReady =
                    bootstrapModule != null && isBackendReady &&
                        !isSessionStarting && !isProcessing
                btnSend.isEnabled = canUseInput && backendReady && inputMessage.text.isNotBlank()
                btnImage.isEnabled = canUseInput && backendReady && !isOcrProcessing
                btnNewSession.isEnabled = backendReady
            }
            private fun beginBusyOperation() {
                busyOperations += 1
                loadingBar.visibility = View.VISIBLE
            }
            private fun endBusyOperation() {
                busyOperations = max(0, busyOperations - 1)
                if (busyOperations == 0) loadingBar.visibility = View.GONE
            }
