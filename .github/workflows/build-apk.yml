                )
                private val ANSI_REGEX = Regex("\u001B\\[[0-9;]*[a-zA-Z]")
                private val ANSI_BASE_COLORS = intArrayOf(
                    Color.rgb(0, 0, 0),
                    Color.rgb(205, 49, 49),
                    Color.rgb(13, 188, 121),
                    Color.rgb(229, 229, 16),
                    Color.rgb(36, 114, 200),
                    Color.rgb(188, 63, 188),
                    Color.rgb(17, 168, 205),
                    Color.rgb(180, 180, 180),
                    Color.rgb(102, 102, 102),
                    Color.rgb(241, 76, 76),
                    Color.rgb(35, 209, 139),
                    Color.rgb(245, 245, 67),
                    Color.rgb(59, 142, 234),
                    Color.rgb(214, 112, 214),
                    Color.rgb(41, 184, 219),
                    Color.rgb(245, 245, 245)
                )
                private fun ansi256Color(index: Int): Int? {
                    if (index !in 0..255) return null
                    if (index < 16) return ANSI_BASE_COLORS[index]
                    if (index < 232) {
                        val cubeIndex = index - 16
                        val red = cubeIndex / 36
                        val green = (cubeIndex % 36) / 6
                        val blue = cubeIndex % 6
                        fun component(value: Int): Int = if (value == 0) 0 else 55 + value * 40
                        return Color.rgb(component(red), component(green), component(blue))
                    }
                    val gray = 8 + (index - 232) * 10
                    return Color.rgb(gray, gray, gray)
                }
            }
