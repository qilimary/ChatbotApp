name: Build Lear Chatbot APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo apt-get clean

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install gdown
        run: pip install "gdown>=4.7.1"

      - name: Download chatbot zip
        run: |
          gdown 'https://drive.google.com/uc?id=1r3OE4JoEUI-12_yxxNDlgXsKFrClm1tH' -O 机器人.zip
          unzip -o 机器人.zip -d 机器人解压/

      - name: Extract chatbot files
        run: |
          CHATBOT_DIR=$(find 机器人解压/ -name "李尔.py" -exec dirname {} \; | head -1)
          cp -v "$CHATBOT_DIR"/*.py . 2>/dev/null || true
          cp -v "$CHATBOT_DIR"/*.json . 2>/dev/null || true
          cp -v "$CHATBOT_DIR"/*.pkl . 2>/dev/null || true

      - name: Rename Chinese filenames to ASCII
        run: |
          python3 -c '
          import re, os
          RENAME_MODULES = {"李尔": "lear_main", "单词": "chatbot_words", "数据": "chatbot_data", "成语": "chatbot_idioms"}
          FILE_RENAME = {"字向量_f16_pure.json": "word_vectors.json", "李尔.py": "lear_main.py", "单词.py": "chatbot_words.py", "数据.py": "chatbot_data.py", "成语.py": "chatbot_idioms.py"}
          contents = {}
          for cn, en in RENAME_MODULES.items():
              src = cn + ".py"
              if os.path.exists(src):
                  with open(src, "r", encoding="utf-8") as f: contents[en] = f.read()
                  os.remove(src)
          def replace_all(content):
              for cn_fn, en_fn in FILE_RENAME.items(): content = content.replace(cn_fn, en_fn)
              for cn, en in RENAME_MODULES.items():
                  content = re.sub(r"(?m)^(\s*)import " + cn + r"\s*$", r"\1import " + en + " as " + cn, content)
                  content = re.sub(r"(?m)^(\s*)import " + cn + r" as ", r"\1import " + en + " as ", content)
                  content = re.sub(r"(?m)^(\s*)from " + cn + r" import", r"\1from " + en + " import", content)
                  content = re.sub(r"(\s)import " + cn + r"(\s|$)", r"\1import " + en + " as " + cn + r"\2", content)
              return content
          for en, content in contents.items():
              with open(en + ".py", "w", encoding="utf-8") as f: f.write(replace_all(content))
          for cn_fn, en_fn in FILE_RENAME.items():
              if cn_fn.endswith(".json") and os.path.exists(cn_fn): os.rename(cn_fn, en_fn)
          for fname in os.listdir("."):
              if fname.endswith(".py") and not any(fname == en + ".py" for en in RENAME_MODULES.values()):
                  with open(fname, "r", encoding="utf-8") as f: content = f.read()
                  new_content = replace_all(content)
                  if new_content != content:
                      with open(fname, "w", encoding="utf-8") as f: f.write(new_content)
          '

      - name: Auto-patch source code (Advanced Architecture & Bug Fixes)
        run: |
          python3 -c '
          import os, re
          for fname in os.listdir("."):
              if not fname.endswith(".py"): continue
              with open(fname, "r", encoding="utf-8") as f: content = f.read()
              new_content = content
              
              new_content = re.sub(r"self\.use_parallel\s*=\s*.+", "self.use_parallel = False", new_content)
              new_content = re.sub(r"self\.max_workers\s*=\s*.+", "self.max_workers = 1", new_content)
              new_content = new_content.replace("self._index_ready_event.wait()", "self._index_ready_event.wait(timeout=15.0)")
              new_content = new_content.replace(
                  "self.bonus_terms.items()", 
                  "(self.bonus_terms.items() if hasattr(self.bonus_terms, \"items\") else {k: 1.0 for k in self.bonus_terms if isinstance(k, str)}.items())"
              )
              new_content = new_content.replace("# self.messages.append(str(text))", "self.messages.append(str(text))")
              
              new_content = re.sub(
                  r"global _g_name; _g_name = globals\(\)\.get\(\"_g_name\"\) or \\2; self\.name_handler = _g_name", 
                  "global _g_name; _g_name = globals().get(\"_g_name\") or \\2; self.name_handler = _g_name", 
                  new_content
              )
              new_content = re.sub(
                  r"global _g_pref; _g_pref = globals\(\)\.get\(\"_g_pref\"\) or \\2; self\.preference_handler = _g_pref", 
                  "global _g_pref; _g_pref = globals().get(\"_g_pref\") or \\2; self.preference_handler = _g_pref", 
                  new_content
              )

              # 【修复 TypeError】：自动摘除多余的 sim_calc.char_idf 参数
              new_content = re.sub(
                  r"get_sentence_vector\(keywords,\s*sim_calc\.char_idf\)", 
                  "get_sentence_vector(keywords)", 
                  new_content
              )

              if new_content != content:
                  with open(fname, "w", encoding="utf-8") as f: f.write(new_content)
          '

      - name: Generate Android Project Structure
        run: |
          set -e
          mkdir -p app/src/main/java/com/lear/chatbot
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          
          mkdir -p app/src/main/assets/chatbot
          mkdir -p app/src/main/python

          for f in *.py *.json *.pkl; do
            [ -f "$f" ] && cp -n "$f" app/src/main/assets/chatbot/ 2>/dev/null || true
          done

          # 【重大更新】：Python 端改为全异步线程池处理，支持提醒和主动搭话
          cat > app/src/main/python/bootstrap.py << 'PYEOF'
          # -*- coding: utf-8 -*-
          import os, sys, json, traceback, gc, threading
          _lear_main = None

          def init_backend(files_dir):
              global _lear_main
              try:
                  os.chdir(files_dir)
                  if files_dir not in sys.path: sys.path.insert(0, files_dir)
                  import lear_main
                  _lear_main = lear_main
                  result = _lear_main.web_start_session()
                  gc.collect()
                  return json.dumps(result)
              except Exception as e:
                  return json.dumps({"error": str(e), "traceback": traceback.format_exc()})

          def get_message_count(session_id):
              global _lear_main
              if _lear_main is None: return 0
              try:
                  sid, session = _lear_main.WEB_SESSION_MANAGER.get_or_create_session(session_id)
                  return len(session.get_all_messages())
              except Exception: return 0

          def poll_messages(session_id, current_count):
              global _lear_main
              if _lear_main is None: return "{}"
              try:
                  sid, session = _lear_main.WEB_SESSION_MANAGER.get_or_create_session(session_id)
                  all_msgs = session.get_all_messages()
                  if len(all_msgs) > current_count:
                      new_msgs = all_msgs[current_count:]
                      return json.dumps({"replies": new_msgs})
                  return "{}"
              except Exception:
                  return "{}"

          def process_message_async(text, session_id):
              global _lear_main
              if _lear_main is None:
                  return json.dumps({"error": "系统仍在初始化中，请稍后。", "traceback": ""})
              try:
                  sid, session = _lear_main.WEB_SESSION_MANAGER.get_or_create_session(session_id)
                  # 开启子线程处理，立刻释放前端控制权
                  threading.Thread(target=session.chat, args=(text,), daemon=True).start()
                  return json.dumps({"session_id": sid})
              except Exception as e:
                  return json.dumps({"error": str(e), "traceback": traceback.format_exc()})
          PYEOF

          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

          cat > settings.gradle << 'GRADLE_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "LearChatbot"
          include ':app'
          GRADLE_EOF

          cat > build.gradle << 'GRADLE_EOF'
          plugins { id 'com.android.application' version '8.1.4' apply false; id 'org.jetbrains.kotlin.android' version '1.9.20' apply false; id 'com.chaquo.python' version '15.0.1' apply false }
          GRADLE_EOF

          cat > gradle.properties << 'GRADLE_EOF'
          org.gradle.jvmargs=-Xmx4096m
          org.gradle.caching=true
          org.gradle.parallel=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          GRADLE_EOF

          cat > app/build.gradle << 'GRADLE_EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'com.chaquo.python' }
          android {
              namespace 'com.lear.chatbot'; compileSdk 34
              defaultConfig {
                  applicationId "com.lear.chatbot"; minSdk 26; targetSdk 34; versionCode 1; versionName "2.0.0"
                  ndk { abiFilters "arm64-v8a" }; python { version "3.10" }
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'; implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'; implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
          }
          GRADLE_EOF

          cat > app/src/main/AndroidManifest.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:largeHeap="true" android:hardwareAccelerated="true" android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:label="@string/app_name" android:supportsRtl="true" android:theme="@style/Theme.LearChatbot">
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity>
              </application>
          </manifest>
          XML_EOF

          cat > app/src/main/res/values/strings.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">李尔</string></resources>
          XML_EOF

          cat > app/src/main/res/values/colors.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_color">#F2F2F7</color><color name="white">#FFFFFF</color><color name="black">#0A0A0A</color>
              <color name="accent_blue">#007AFF</color><color name="error_red">#FF3B30</color><color name="user_bubble">#007AFF</color>
              <color name="user_text">#FFFFFF</color><color name="bot_bubble">#FFFFFF</color><color name="bot_text">#1A1A1A</color>
              <color name="gray_text">#8E8E93</color><color name="border_gray">#E0E0E0</color><color name="input_bg">#F2F2F7</color>
          </resources>
          XML_EOF

          cat > app/src/main/res/values/themes.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="Theme.LearChatbot" parent="Theme.MaterialComponents.Light.NoActionBar"><item name="colorPrimary">@color/accent_blue</item><item name="colorPrimaryVariant">@color/accent_blue</item><item name="colorOnPrimary">@color/white</item><item name="android:statusBarColor">@color/white</item><item name="android:windowLightStatusBar">true</item><item name="android:windowBackground">@color/bg_color</item></style></resources>
          XML_EOF

          cat > app/src/main/res/layout/activity_main.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.drawerlayout.widget.DrawerLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:id="@+id/drawer_layout" android:layout_width="match_parent" android:layout_height="match_parent">
              <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="@color/bg_color">
                  <RelativeLayout android:layout_width="match_parent" android:layout_height="48dp" android:background="@color/white" android:elevation="2dp">
                      <LinearLayout android:layout_width="wrap_content" android:layout_height="match_parent" android:orientation="horizontal" android:layout_alignParentStart="true">
                          <ImageButton android:id="@+id/btn_menu" android:layout_width="44dp" android:layout_height="match_parent" android:src="@drawable/ic_menu" android:background="?attr/selectableItemBackgroundBorderless" android:contentDescription="菜单" app:tint="@color/black" />
                          <TextView android:id="@+id/btn_font" android:layout_width="44dp" android:layout_height="match_parent" android:text="字体" android:textSize="14sp" android:textColor="@color/black" android:gravity="center" android:background="?attr/selectableItemBackgroundBorderless" android:clickable="true" android:focusable="true" />
                          <!-- 【修改为喇叭图标】 -->
                          <ImageButton android:id="@+id/btn_tts" android:layout_width="44dp" android:layout_height="match_parent" android:src="@drawable/ic_volume" android:background="?attr/selectableItemBackgroundBorderless" android:contentDescription="语音" app:tint="@color/black" />
                      </LinearLayout>
                      <TextView android:id="@+id/tv_title" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_centerInParent="true" android:text="李尔" android:textSize="16sp" android:textStyle="bold" android:textColor="@color/black" />
                      <ImageButton android:id="@+id/btn_new_session" android:layout_width="44dp" android:layout_height="match_parent" android:layout_alignParentEnd="true" android:src="@drawable/ic_add" android:background="?attr/selectableItemBackgroundBorderless" android:contentDescription="新对话" app:tint="@color/black" />
                  </RelativeLayout>
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/chat_recycler" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:clipToPadding="false" android:paddingStart="8dp" android:paddingEnd="8dp" android:paddingTop="12dp" android:paddingBottom="12dp" app:fastScrollEnabled="true" app:fastScrollVerticalThumbDrawable="@drawable/fastscroll_thumb" app:fastScrollVerticalTrackDrawable="@drawable/fastscroll_track" app:fastScrollHorizontalThumbDrawable="@drawable/fastscroll_thumb" app:fastScrollHorizontalTrackDrawable="@drawable/fastscroll_track" />
                  <ProgressBar android:id="@+id/loading_bar" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="3dp" android:indeterminate="true" android:visibility="gone" android:indeterminateTint="@color/accent_blue" />
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="8dp" android:background="@color/white" android:elevation="4dp" android:gravity="center_vertical">
                      <ImageButton android:id="@+id/btn_image" android:layout_width="40dp" android:layout_height="40dp" android:src="@drawable/ic_image" android:background="?attr/selectableItemBackgroundBorderless" android:contentDescription="上传图片" app:tint="@color/black" />
                      <EditText android:id="@+id/input_message" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="4dp" android:hint="正在加载..." android:textColorHint="@color/gray_text" android:background="@drawable/bg_input" android:paddingStart="14dp" android:paddingEnd="14dp" android:paddingTop="10dp" android:paddingBottom="10dp" android:textSize="15sp" android:textColor="@color/black" android:maxLines="4" android:inputType="textMultiLine|textCapSentences" android:imeOptions="actionSend" />
                      <com.google.android.material.button.MaterialButton android:id="@+id/btn_send" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="8dp" android:text="发送" android:textColor="@color/white" app:backgroundTint="@color/accent_blue" app:cornerRadius="10dp" />
                  </LinearLayout>
              </LinearLayout>
              <LinearLayout android:layout_width="300dp" android:layout_height="match_parent" android:layout_gravity="start" android:orientation="vertical" android:background="@color/white" android:fitsSystemWindows="true">
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp" android:text="最近对话" android:textSize="18sp" android:textStyle="bold" android:textColor="@color/black" />
                  <View android:layout_width="match_parent" android:layout_height="1dp" android:background="@color/border_gray" />
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/history_recycler" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" />
                  <com.google.android.material.button.MaterialButton android:id="@+id/btn_clear_all" android:layout_width="match_parent" android:layout_height="52dp" android:text="清空所有记录" android:textColor="@color/white" android:insetTop="0dp" android:insetBottom="0dp" app:backgroundTint="@color/error_red" app:cornerRadius="0dp" />
              </LinearLayout>
          </androidx.drawerlayout.widget.DrawerLayout>
          XML_EOF

          cat > app/src/main/res/drawable/ic_volume.xml << 'XML_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FF000000" android:pathData="M3,9v6h4l5,5V4L7,9H3zM16.5,12c0,-1.77 -1.02,-3.29 -2.5,-4.03v8.05c1.48,-0.73 2.5,-2.25 2.5,-4.02zM14,3.23v2.06c2.89,0.86 5,3.54 5,6.71s-2.11,5.85 -5,6.71v2.06c4.01,-0.91 7,-4.49 7,-8.77s-2.99,-7.86 -7,-8.77z"/>
          </vector>
          XML_EOF

          cat > app/src/main/res/drawable/ic_image.xml << 'XML_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M21,19V5c0,-1.1 -0.9,-2 -2,-2H5C3.9,3 3,3.9 3,5v14c0,1.1 0.9,2 2,2h14C20.1,21 21,20.1 21,19zM8.5,13.5l2.5,3.01L14.5,12l4.5,6H5L8.5,13.5z" /></vector>
          XML_EOF
          cat > app/src/main/res/drawable/fastscroll_thumb.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?><selector xmlns:android="http://schemas.android.com/apk/res/android"><item android:state_pressed="true"><shape android:shape="rectangle"><solid android:color="#007AFF"/><corners android:radius="4dp"/><size android:width="8dp" android:height="60dp"/></shape></item><item><shape android:shape="rectangle"><solid android:color="#A0A0A0"/><corners android:radius="2dp"/><size android:width="4dp" android:height="60dp"/></shape></item></selector>
          XML_EOF
          cat > app/src/main/res/drawable/fastscroll_track.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="@android:color/transparent"/><size android:width="20dp"/></shape>
          XML_EOF
          cat > app/src/main/res/drawable/bg_input.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/input_bg" /><corners android:radius="14dp" /></shape>
          XML_EOF
          cat > app/src/main/res/drawable/bg_bubble_user.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/user_bubble" /><corners android:topLeftRadius="18dp" android:topRightRadius="18dp" android:bottomLeftRadius="4dp" android:bottomRightRadius="18dp" /></shape>
          XML_EOF
          cat > app/src/main/res/drawable/bg_bubble_bot.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/bot_bubble" /><corners android:topLeftRadius="18dp" android:topRightRadius="18dp" android:bottomLeftRadius="18dp" android:bottomRightRadius="4dp" /></shape>
          XML_EOF
          cat > app/src/main/res/drawable/bg_bubble_error.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/error_red" /><corners android:topLeftRadius="18dp" android:topRightRadius="18dp" android:bottomLeftRadius="18dp" android:bottomRightRadius="4dp" /></shape>
          XML_EOF
          cat > app/src/main/res/drawable/ic_menu.xml << 'XML_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M3,18h18v-2H3v2zM3,13h18v-2H3v2zM3,6v2h18V6H3z" /></vector>
          XML_EOF
          cat > app/src/main/res/drawable/ic_add.xml << 'XML_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M19,13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" /></vector>
          XML_EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg" /><foreground android:drawable="@drawable/ic_launcher_fg" /></adaptive-icon>
          XML_EOF
          cat > app/src/main/res/drawable/ic_launcher_bg.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#007AFF" /></shape>
          XML_EOF
          cat > app/src/main/res/drawable/ic_launcher_fg.xml << 'XML_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#FFFFFF" android:pathData="M54,38 C42,38 32,45 32,54 C32,63 42,70 54,70 C57,70 60,69.5 63,68.5 L72,72 L69,63 C72.5,60.5 76,57.5 76,54 C76,45 66,38 54,38 Z" /></vector>
          XML_EOF

          # 【重大更新】：加入协程轮询机制，完美支持主动搭话和延时提醒功能！
          cat > app/src/main/java/com/lear/chatbot/MainActivity.kt << 'KT_EOF'
          package com.lear.chatbot

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.EditText
          import android.widget.ImageButton
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import androidx.drawerlayout.widget.DrawerLayout
          import com.chaquo.python.Python
          import com.chaquo.python.android.AndroidPlatform
          import com.google.android.material.button.MaterialButton
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.chinese.ChineseTextRecognizerOptions
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.isActive
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.util.Locale

          data class ChatMessage(var text: String, var isUser: Boolean, var isError: Boolean = false, var isSystem: Boolean = false, var imageUri: String? = null)
          data class ChatSession(var id: String? = null, var preview: String = "新对话", var messages: MutableList<ChatMessage> = mutableListOf())

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {
              companion object { private const val TYPE_USER = 0; private const val TYPE_BOT = 1; private const val TYPE_ERROR = 2; private const val TYPE_SYSTEM = 3 }
              private lateinit var drawerLayout: DrawerLayout
              private lateinit var chatRecycler: RecyclerView
              private lateinit var historyRecycler: RecyclerView
              private lateinit var inputMessage: EditText
              private lateinit var btnSend: MaterialButton
              private lateinit var btnClearAll: MaterialButton
              private lateinit var btnNewSession: ImageButton
              private lateinit var btnFontSize: TextView
              private lateinit var btnTts: ImageButton
              private lateinit var btnMenu: ImageButton
              private lateinit var btnImage: ImageButton
              private lateinit var loadingBar: ProgressBar

              private val chatAdapter = ChatAdapter()
              private val historyAdapter = HistoryAdapter()
              private val histories = mutableListOf<ChatSession>()
              private var currentSession = ChatSession()
              private var chatFontSize = 14
              
              private var messagePollJob: Job? = null
              private var lastPollCount = 0

              private lateinit var tts: TextToSpeech
              private var isTtsEnabled = false
              private var ttsSpeed = 1.0f
              private var ttsPitch = 1.0f
              private var availableVoices = listOf<android.speech.tts.Voice>()
              private var selectedVoiceName: String? = null

              private var bootstrapModule: com.chaquo.python.PyObject? = null
              private val historyFile by lazy { File(filesDir, "chat_history.json") }
              private val settingsFile by lazy { File(filesDir, "settings.json") }
              private val crashFile by lazy { File(filesDir, "crash.txt") }

              private val pickImageLauncher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  if (uri != null) processImage(uri)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  Thread.setDefaultUncaughtExceptionHandler { _, throwable -> try { crashFile.writeText(throwable.stackTraceToString()) } catch (e: Exception) {}; android.os.Process.killProcess(android.os.Process.myPid()) }
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  if (crashFile.exists()) {
                      val log = crashFile.readText(); crashFile.delete()
                      AlertDialog.Builder(this).setTitle("上次运行时发生崩溃").setMessage(log).setPositiveButton("关闭", null).setNeutralButton("一键复制错误") { _, _ -> copyToClipboard("崩溃日志", log) }.show()
                  }
                  
                  tts = TextToSpeech(this, this)
                  bindViews(); setupListeners(); setupRecyclerViews(); loadSettings(); loadAllHistory(); refreshHistory(); initPython()
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      val result = tts.setLanguage(Locale.CHINESE)
                      if (result != TextToSpeech.LANG_MISSING_DATA && result != TextToSpeech.LANG_NOT_SUPPORTED) {
                          availableVoices = tts.voices?.filter { it.locale.language == Locale.CHINESE.language || it.locale.language == "zh" }?.distinctBy { it.name }?.sortedBy { it.name } ?: emptyList()
                          selectedVoiceName?.let { name -> availableVoices.find { it.name == name }?.let { tts.voice = it } }
                      }
                  }
              }

              override fun onDestroy() {
                  messagePollJob?.cancel()
                  if (::tts.isInitialized) { tts.stop(); tts.shutdown() }
                  super.onDestroy()
              }

              private fun bindViews() {
                  drawerLayout = findViewById(R.id.drawer_layout); chatRecycler = findViewById(R.id.chat_recycler); historyRecycler = findViewById(R.id.history_recycler)
                  inputMessage = findViewById(R.id.input_message); btnSend = findViewById(R.id.btn_send); btnClearAll = findViewById(R.id.btn_clear_all)
                  btnNewSession = findViewById(R.id.btn_new_session); btnFontSize = findViewById(R.id.btn_font); btnTts = findViewById(R.id.btn_tts)
                  btnMenu = findViewById(R.id.btn_menu); btnImage = findViewById(R.id.btn_image); loadingBar = findViewById(R.id.loading_bar)
              }

              private fun setupListeners() {
                  btnMenu.setOnClickListener { drawerLayout.openDrawer(Gravity.START) }
                  btnFontSize.setOnClickListener { showFontSizeDialog() }
                  btnTts.setOnClickListener { showTtsDialog() }
                  btnNewSession.setOnClickListener { startNewSession() }
                  btnSend.setOnClickListener { sendMessage() }
                  btnClearAll.setOnClickListener { showClearAllDialog() }
                  btnImage.setOnClickListener { Toast.makeText(this, "仅支持文字识别", Toast.LENGTH_SHORT).show(); pickImageLauncher.launch("image/*") }
                  
                  inputMessage.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: Editable?) { btnSend.isEnabled = !s.isNullOrBlank() && bootstrapModule != null }
                  })

                  inputMessage.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_SEND) {
                          if (btnSend.isEnabled) sendMessage() else Toast.makeText(this, "系统仍在初始化或输入为空...", Toast.LENGTH_SHORT).show()
                          true
                      } else false
                  }
              }

              private fun setupRecyclerViews() {
                  chatRecycler.layoutManager = LinearLayoutManager(this); chatRecycler.adapter = chatAdapter; chatAdapter.fontSize = chatFontSize
                  historyRecycler.layoutManager = LinearLayoutManager(this); historyRecycler.adapter = historyAdapter
                  historyAdapter.onItemClick = { loadSession(it) }; historyAdapter.onItemLongClick = { showDeleteDialog(it) }
              }

              private suspend fun extractAssetsToDisk(): String = withContext(Dispatchers.IO) {
                  val destDir = File(filesDir, "chatbot"); if (!destDir.exists()) destDir.mkdirs()
                  val checkFile = File(destDir, "corpus_vectors_cache.pkl")
                  if (!checkFile.exists() || checkFile.length() < 1000) {
                      val assetManager = assets; val files = assetManager.list("chatbot") ?: arrayOf()
                      for (filename in files) { val outFile = File(destDir, filename); assetManager.open("chatbot/$filename").use { input -> outFile.outputStream().use { output -> input.copyTo(output) } } }
                  }
                  destDir.absolutePath
              }

              private fun initPython() {
                  loadingBar.visibility = View.VISIBLE; btnSend.isEnabled = false; inputMessage.hint = "正在加载..."
                  lifecycleScope.launch {
                      try {
                          val realFilesDir = extractAssetsToDisk()
                          withContext(Dispatchers.IO) {
                              if (!Python.isStarted()) Python.start(AndroidPlatform(applicationContext))
                              bootstrapModule = Python.getInstance().getModule("bootstrap")
                              val resultStr = bootstrapModule?.callAttr("init_backend", realFilesDir)?.toString()
                              withContext(Dispatchers.Main) {
                                  if (!resultStr.isNullOrEmpty()) {
                                      val resultJson = JSONObject(resultStr)
                                      if (resultJson.has("error")) { showErrorDialog("Python 核心错误", "${resultJson.getString("error")}\n\n${resultJson.optString("traceback", "")}"); return@withContext }
                                      currentSession.id = if (resultJson.isNull("session_id")) null else resultJson.getString("session_id")
                                      val msgs = resultJson.getJSONArray("messages")
                                      for (i in 0 until msgs.length()) {
                                          val text = cleanText(msgs.getString(i)); val isSys = isSystemMessage(text)
                                          val chatMsg = ChatMessage(text, isUser = false, isSystem = isSys)
                                          currentSession.messages.add(chatMsg)
                                      }
                                      chatAdapter.setMessages(currentSession.messages)
                                  }
                                  scrollToBottom(); loadingBar.visibility = View.GONE; btnSend.isEnabled = true; inputMessage.hint = "输入消息..."; checkSystemMessageLock()
                                  
                                  // 初始化同步当前Python后台消息数量，并启动异步雷达轮询！
                                  lastPollCount = bootstrapModule?.callAttr("get_message_count", currentSession.id)?.toString()?.toIntOrNull() ?: 0
                                  startPolling()
                              }
                          }
                      } catch (e: Throwable) { withContext(Dispatchers.Main) { loadingBar.visibility = View.GONE; inputMessage.hint = "初始化失败"; showErrorDialog("底层环境异常", e.stackTraceToString()) } }
                  }
              }

              // 【核心轮询引擎】：每秒扫描一次后台新消息（解决提醒和主动搭话不显示问题）
              private fun startPolling() {
                  messagePollJob?.cancel()
                  messagePollJob = lifecycleScope.launch(Dispatchers.IO) {
                      while (isActive) {
                          delay(1000)
                          if (currentSession.id == null || bootstrapModule == null) continue
                          try {
                              val resultStr = bootstrapModule?.callAttr("poll_messages", currentSession.id, lastPollCount)?.toString()
                              if (!resultStr.isNullOrEmpty() && resultStr != "{}") {
                                  val resultJson = JSONObject(resultStr)
                                  val reps = resultJson.optJSONArray("replies")
                                  if (reps != null && reps.length() > 0) {
                                      lastPollCount += reps.length()
                                      withContext(Dispatchers.Main) {
                                          loadingBar.visibility = View.GONE
                                          for (i in 0 until reps.length()) {
                                              val cleanReply = cleanText(reps.getString(i))
                                              val botMsg = ChatMessage(cleanReply, isUser = false, isSystem = isSystemMessage(cleanReply))
                                              currentSession.messages.add(botMsg)
                                              chatAdapter.addMessage(botMsg)
                                              
                                              if (isTtsEnabled && !botMsg.isSystem && ::tts.isInitialized) {
                                                  // 彻底剔除所有 Emoji 防止发声
                                                  val cleanForTts = cleanReply.replace(Regex("[\\uD83C-\\uDBFF\\uDC00-\\uDFFF]+"), "")
                                                  tts.setSpeechRate(ttsSpeed); tts.setPitch(ttsPitch)
                                                  tts.speak(cleanForTts, TextToSpeech.QUEUE_ADD, null, null)
                                              }
                                          }
                                          scrollToBottom(); saveAllHistory(); refreshHistory(); checkSystemMessageLock()
                                      }
                                  }
                              }
                          } catch (e: Exception) {}
                      }
                  }
              }

              private fun processImage(uri: android.net.Uri) {
                  try {
                      val userMsg = ChatMessage("", isUser = true, imageUri = uri.toString())
                      currentSession.messages.add(userMsg); chatAdapter.addMessage(userMsg)
                      scrollToBottom(); saveAllHistory(); refreshHistory()

                      loadingBar.visibility = View.VISIBLE
                      val image = InputImage.fromFilePath(this, uri)
                      val recognizer = TextRecognition.getClient(ChineseTextRecognizerOptions.Builder().build())
                      recognizer.process(image)
                          .addOnSuccessListener { visionText ->
                              val text = visionText.text.trim()
                              if (text.isNotBlank()) {
                                  val botMsg = ChatMessage("我从图片中识别到了以下文字：\n\n$text", isUser = false, isSystem = false)
                                  currentSession.messages.add(botMsg); chatAdapter.addMessage(botMsg)
                                  scrollToBottom(); saveAllHistory(); refreshHistory()
                              } else { Toast.makeText(this, "未识别到文字", Toast.LENGTH_SHORT).show() }
                          }
                          .addOnFailureListener { Toast.makeText(this, "识别失败", Toast.LENGTH_SHORT).show() }
                          .addOnCompleteListener { loadingBar.visibility = View.GONE }
                  } catch (e: Exception) { Toast.makeText(this, "图片处理异常", Toast.LENGTH_SHORT).show(); loadingBar.visibility = View.GONE }
              }

              private fun sendMessage() {
                  if (bootstrapModule == null) return
                  val text = inputMessage.text.toString().trim()
                  if (text.isEmpty()) return

                  tts.stop()
                  inputMessage.setText(""); inputMessage.clearFocus()
                  
                  val isFirst = currentSession.messages.none { it.isUser }
                  if (isFirst) { currentSession.preview = if (text.length > 12) text.substring(0, 12) + "..." else text; if (currentSession !in histories) histories.add(0, currentSession) }
                  val userMsg = ChatMessage(text, isUser = true); currentSession.messages.add(userMsg); chatAdapter.addMessage(userMsg)
                  scrollToBottom(); saveAllHistory(); refreshHistory()

                  loadingBar.visibility = View.VISIBLE

                  val sid = currentSession.id
                  lifecycleScope.launch(Dispatchers.IO) {
                      try {
                          val resultStr = bootstrapModule?.callAttr("process_message_async", text, sid)?.toString()
                          if (!resultStr.isNullOrEmpty()) {
                              val resultJson = JSONObject(resultStr)
                              if (resultJson.has("error")) {
                                  withContext(Dispatchers.Main) { showErrorDialog("Python 处理错误", resultJson.getString("error")); loadingBar.visibility = View.GONE }
                              } else {
                                  val newSid = resultJson.optString("session_id", null)
                                  if (newSid != null) currentSession.id = newSid
                              }
                          }
                      } catch (e: Throwable) { 
                          withContext(Dispatchers.Main) { showErrorDialog("环境通信异常", e.stackTraceToString()); loadingBar.visibility = View.GONE } 
                      } 
                      // 异步机制无需在这里手动关闭 loadingBar，雷达侦测到消息后会自动关闭它
                      delay(3000)
                      withContext(Dispatchers.Main) { loadingBar.visibility = View.GONE }
                  }
              }

              private fun startNewSession() {
                  if (currentSession.messages.isEmpty()) { drawerLayout.closeDrawer(Gravity.START); return }
                  tts.stop()
                  currentSession = ChatSession(); btnSend.text = "发送"; btnSend.isEnabled = true
                  inputMessage.hint = "输入消息..."; drawerLayout.closeDrawer(Gravity.START)
                  
                  chatAdapter.setMessages(currentSession.messages)
                  
                  if (bootstrapModule == null) return
                  loadingBar.visibility = View.VISIBLE; btnSend.isEnabled = false; inputMessage.hint = "正在加载..."
                  lifecycleScope.launch {
                      try {
                          val realFilesDir = File(filesDir, "chatbot").absolutePath
                          withContext(Dispatchers.IO) {
                              val resultStr = bootstrapModule?.callAttr("init_backend", realFilesDir)?.toString()
                              withContext(Dispatchers.Main) {
                                  if (!resultStr.isNullOrEmpty()) {
                                      val resultJson = JSONObject(resultStr)
                                      if (resultJson.has("error")) { showErrorDialog("Python 初始化错误", "${resultJson.getString("error")}\n\n${resultJson.optString("traceback", "")}"); return@withContext }
                                      currentSession.id = if (resultJson.isNull("session_id")) null else resultJson.getString("session_id")
                                      val msgs = resultJson.getJSONArray("messages")
                                      for (i in 0 until msgs.length()) {
                                          val text = cleanText(msgs.getString(i)); val chatMsg = ChatMessage(text, isUser = false, isSystem = isSystemMessage(text))
                                          currentSession.messages.add(chatMsg)
                                          if (isTtsEnabled && !chatMsg.isSystem && ::tts.isInitialized) { tts.setSpeechRate(ttsSpeed); tts.setPitch(ttsPitch); tts.speak(text, TextToSpeech.QUEUE_ADD, null, null) }
                                      }
                                      chatAdapter.setMessages(currentSession.messages)
                                  }
                                  scrollToBottom(); loadingBar.visibility = View.GONE; btnSend.isEnabled = true; inputMessage.hint = "输入消息..."; checkSystemMessageLock()
                                  lastPollCount = bootstrapModule?.callAttr("get_message_count", currentSession.id)?.toString()?.toIntOrNull() ?: 0
                              }
                          }
                      } catch (e: Throwable) { withContext(Dispatchers.Main) { loadingBar.visibility = View.GONE; showErrorDialog("重启对话异常", e.stackTraceToString()) } }
                  }
              }

              private fun loadSession(session: ChatSession) {
                  drawerLayout.closeDrawer(Gravity.START); if (session === currentSession) return
                  tts.stop()
                  currentSession = session; btnSend.text = "发送"; btnSend.isEnabled = true
                  inputMessage.hint = "输入消息..."
                  chatAdapter.setMessages(session.messages)
                  scrollToBottom(); refreshHistory(); checkSystemMessageLock()
                  lastPollCount = bootstrapModule?.callAttr("get_message_count", currentSession.id)?.toString()?.toIntOrNull() ?: 0
              }

              private fun deleteSession(session: ChatSession) { histories.remove(session); saveAllHistory(); refreshHistory(); if (currentSession === session) startNewSession() }
              private fun isSystemMessage(text: String): Boolean = text.startsWith("【") && text.endsWith("】")
              
              private fun checkSystemMessageLock() {
                  val lastMsg = currentSession.messages.lastOrNull()
                  if (lastMsg != null && lastMsg.isSystem && lastMsg.text.contains("会话已结束")) { btnSend.isEnabled = false; inputMessage.isEnabled = false; inputMessage.hint = "会话已结束" } 
                  else { inputMessage.isEnabled = true; if (inputMessage.hint == "会话已结束" || inputMessage.hint == "正在加载...") inputMessage.hint = "输入消息..." }
              }

              private fun showErrorDialog(title: String, message: String) { 
                  if (isFinishing || isDestroyed) return
                  AlertDialog.Builder(this).setTitle(title).setMessage(message).setPositiveButton("确定", null).setNeutralButton("一键复制错误") { _, _ -> copyToClipboard(title, message) }.show() 
              }
              
              private fun copyToClipboard(label: String, text: String) { val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager; clipboard.setPrimaryClip(ClipData.newPlainText(label, text)); Toast.makeText(this, "已复制", Toast.LENGTH_SHORT).show() }
              
              private fun showFontSizeDialog() {
                  val container = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 32, 48, 16) }
                  val label = TextView(this).apply { text = "当前字号: $chatFontSize"; setPadding(0, 0, 0, 24); textSize = 16f }
                  val slider = SeekBar(this).apply { max = 14; progress = chatFontSize - 10 }
                  slider.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener { override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) { chatFontSize = progress + 10; label.text = "当前字号: $chatFontSize" } override fun onStartTrackingTouch(sb: SeekBar?) {} override fun onStopTrackingTouch(sb: SeekBar?) {} })
                  container.addView(label); container.addView(slider)
                  AlertDialog.Builder(this).setTitle("调节字体大小").setView(container).setPositiveButton("完成") { _, _ -> saveSettings(); chatAdapter.fontSize = chatFontSize; chatAdapter.notifyDataSetChanged() }.show()
              }

              private fun playTtsPreview() {
                  if (::tts.isInitialized && isTtsEnabled) {
                      tts.setSpeechRate(ttsSpeed); tts.setPitch(ttsPitch)
                      selectedVoiceName?.let { name -> availableVoices.find { it.name == name }?.let { tts.voice = it } }
                      tts.speak("你好，我是李尔。声音测试中。", TextToSpeech.QUEUE_FLUSH, null, null)
                  }
              }

              private fun showTtsDialog() {
                  val container = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 32, 48, 16) }
                  val switchTts = Switch(this).apply { text = "开启语音播报"; isChecked = isTtsEnabled; setPadding(0, 0, 0, 32); textSize = 16f }
                  
                  val btnVoice = MaterialButton(this).apply { text = "选择本地音色 (${availableVoices.size}种)"; setPadding(0, 0, 0, 16) }
                  btnVoice.setOnClickListener {
                      if (availableVoices.isEmpty()) { Toast.makeText(this@MainActivity, "手机未安装中文语音包", Toast.LENGTH_SHORT).show(); return@setOnClickListener }
                      val names = availableVoices.map { it.name }.toTypedArray()
                      val currentIdx = availableVoices.indexOfFirst { it.name == selectedVoiceName }.takeIf { it >= 0 } ?: 0
                      AlertDialog.Builder(this@MainActivity).setSingleChoiceItems(names, currentIdx) { d, w ->
                          selectedVoiceName = names[w]; tts.voice = availableVoices[w]; saveSettings()
                          // 【即时试听】点选列表即刻发声，无需关掉面板
                          playTtsPreview()
                      }.setPositiveButton("确定", null).show()
                  }

                  val lblSpeed = TextView(this).apply { text = "语速: ${"%.1f".format(ttsSpeed)}x"; setPadding(0, 16, 0, 8) }
                  val sliderSpeed = SeekBar(this).apply { max = 15; progress = ((ttsSpeed - 0.5f) * 10).toInt() }
                  val lblPitch = TextView(this).apply { text = "音调: ${"%.1f".format(ttsPitch)}x"; setPadding(0, 32, 0, 8) }
                  val sliderPitch = SeekBar(this).apply { max = 15; progress = ((ttsPitch - 0.5f) * 10).toInt() }

                  sliderSpeed.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener { override fun onProgressChanged(sb: SeekBar?, p: Int, b: Boolean) { ttsSpeed = 0.5f + p / 10f; lblSpeed.text = "语速: ${"%.1f".format(ttsSpeed)}x" } override fun onStartTrackingTouch(sb: SeekBar?) {} override fun onStopTrackingTouch(sb: SeekBar?) { playTtsPreview() } })
                  sliderPitch.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener { override fun onProgressChanged(sb: SeekBar?, p: Int, b: Boolean) { ttsPitch = 0.5f + p / 10f; lblPitch.text = "音调: ${"%.1f".format(ttsPitch)}x" } override fun onStartTrackingTouch(sb: SeekBar?) {} override fun onStopTrackingTouch(sb: SeekBar?) { playTtsPreview() } })

                  container.addView(switchTts); container.addView(btnVoice); container.addView(lblSpeed); container.addView(sliderSpeed); container.addView(lblPitch); container.addView(sliderPitch)
                  AlertDialog.Builder(this).setTitle("语音设置").setView(container).setPositiveButton("完成") { _, _ -> isTtsEnabled = switchTts.isChecked; saveSettings(); if(!isTtsEnabled) tts.stop() else playTtsPreview() }.show()
              }

              private fun showDeleteDialog(session: ChatSession) { AlertDialog.Builder(this).setTitle("提示").setMessage("是否删除此记录？").setPositiveButton("删除") { _, _ -> deleteSession(session) }.setNegativeButton("取消", null).show() }
              private fun showClearAllDialog() { AlertDialog.Builder(this).setTitle("警告").setMessage("确认清空所有聊天记录？").setPositiveButton("清空") { _, _ -> histories.clear(); saveAllHistory(); refreshHistory(); chatAdapter.clearMessages(); currentSession = ChatSession(); startNewSession() }.setNegativeButton("取消", null).show() }

              private fun saveAllHistory() {
                  val snap = histories.map { session -> ChatSession(session.id, session.preview, session.messages.map { it.copy() }.toMutableList()) }.toList()
                  lifecycleScope.launch(Dispatchers.IO) {
                      try {
                          val arr = JSONArray()
                          snap.filter { it.messages.any { m -> m.isUser } }.take(15).forEach { s ->
                              val obj = JSONObject(); obj.put("id", s.id ?: JSONObject.NULL); obj.put("preview", s.preview)
                              val msgs = JSONArray(); s.messages.forEach { m -> msgs.put(JSONObject().apply { put("is_user", m.isUser); put("text", m.text); put("is_error", m.isError); put("is_system", m.isSystem); put("image_uri", m.imageUri ?: JSONObject.NULL) }) }
                              obj.put("messages", msgs); arr.put(obj)
                          }
                          historyFile.writeText(arr.toString())
                      } catch (_: Exception) {}
                  }
              }

              private fun loadAllHistory() {
                  try {
                      if (historyFile.exists()) {
                          val arr = JSONArray(historyFile.readText())
                          for (i in 0 until arr.length()) {
                              val obj = arr.getJSONObject(i); val session = ChatSession(id = if (obj.isNull("id")) null else obj.getString("id"), preview = obj.optString("preview", "新对话"))
                              val msgs = obj.getJSONArray("messages")
                              for (j in 0 until msgs.length()) { val m = msgs.getJSONObject(j); session.messages.add(ChatMessage(text = m.getString("text"), isUser = m.getBoolean("is_user"), isError = m.optBoolean("is_error", false), isSystem = m.optBoolean("is_system", false), imageUri = if (m.isNull("image_uri")) null else m.getString("image_uri"))) }
                              histories.add(session)
                          }
                      }
                  } catch (_: Exception) { histories.clear() }
              }

              private fun refreshHistory() { historyAdapter.updateList(histories.filter { it.messages.any { m -> m.isUser } }) }
              private fun saveSettings() { try { settingsFile.writeText(JSONObject().apply{ put("font_size", chatFontSize); put("tts_on", isTtsEnabled); put("tts_speed", ttsSpeed.toDouble()); put("tts_pitch", ttsPitch.toDouble()); put("tts_voice", selectedVoiceName ?: "") }.toString()) } catch (_: Exception) {} }
              private fun loadSettings() { try { if (settingsFile.exists()) { val json = JSONObject(settingsFile.readText()); chatFontSize = json.optInt("font_size", 14); isTtsEnabled = json.optBoolean("tts_on", false); ttsSpeed = json.optDouble("tts_speed", 1.0).toFloat(); ttsPitch = json.optDouble("tts_pitch", 1.0).toFloat(); selectedVoiceName = json.optString("tts_voice", "").takeIf { it.isNotEmpty() } } } catch (_: Exception) {} }
              private fun cleanText(text: String): String = text.replace("\\n", "\n").replace("\\r", "").trim()
              private fun scrollToBottom() { chatRecycler.post { val pos = chatAdapter.itemCount - 1; if (pos >= 0) chatRecycler.smoothScrollToPosition(pos) } }

              inner class ChatAdapter : RecyclerView.Adapter<RecyclerView.ViewHolder>() {
                  private val messages = mutableListOf<ChatMessage>(); var fontSize: Int = 14
                  fun addMessage(msg: ChatMessage) { messages.add(msg); notifyItemInserted(messages.size - 1) }
                  fun setMessages(newMsgs: List<ChatMessage>) { messages.clear(); messages.addAll(newMsgs); notifyDataSetChanged() }
                  fun clearMessages() { messages.clear(); notifyDataSetChanged() }
                  override fun getItemViewType(pos: Int): Int { val m = messages[pos]; return when { m.isSystem -> TYPE_SYSTEM; m.isError -> TYPE_ERROR; m.isUser -> TYPE_USER; else -> TYPE_BOT } }
                  
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): RecyclerView.ViewHolder {
                      val container = LinearLayout(parent.context).apply { 
                          layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                          orientation = LinearLayout.HORIZONTAL; setPadding(0, 16, 0, 16) 
                          gravity = when(viewType) { TYPE_USER -> Gravity.END; TYPE_SYSTEM -> Gravity.CENTER; else -> Gravity.START }
                      }
                      val bubble = LinearLayout(parent.context).apply { 
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                              when(viewType) { TYPE_USER -> setMargins(100, 0, 32, 0); TYPE_SYSTEM -> setMargins(48, 0, 48, 0); else -> setMargins(32, 0, 100, 0) }
                          }
                          orientation = LinearLayout.VERTICAL
                          background = ContextCompat.getDrawable(parent.context, when(viewType) { TYPE_USER -> R.drawable.bg_bubble_user; TYPE_BOT -> R.drawable.bg_bubble_bot; TYPE_ERROR -> R.drawable.bg_bubble_error; else -> android.R.color.transparent })
                      }
                      val img = ImageView(parent.context).apply { 
                          layoutParams = LinearLayout.LayoutParams((parent.context.resources.displayMetrics.widthPixels * 0.5).toInt(), ViewGroup.LayoutParams.WRAP_CONTENT)
                          adjustViewBounds = true; visibility = View.GONE; setPadding(16, 16, 16, 16) 
                      }
                      val tv = TextView(parent.context).apply { 
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                          maxWidth = (parent.context.resources.displayMetrics.widthPixels * 0.75).toInt(); setPadding(42, 28, 42, 28); setLineSpacing(6f, 1f) 
                          setTextColor(ContextCompat.getColor(parent.context, when(viewType) { TYPE_USER, TYPE_ERROR -> R.color.user_text; TYPE_BOT -> R.color.bot_text; else -> R.color.gray_text }))
                      }
                      bubble.addView(img); bubble.addView(tv); container.addView(bubble); return object : RecyclerView.ViewHolder(container) {}
                  }
                  
                  override fun onBindViewHolder(holder: RecyclerView.ViewHolder, pos: Int) {
                      val msg = messages[pos]; val container = holder.itemView as LinearLayout; val bubble = container.getChildAt(0) as LinearLayout
                      val img = bubble.getChildAt(0) as ImageView; val tv = bubble.getChildAt(1) as TextView
                      
                      if (msg.imageUri != null) { img.visibility = View.VISIBLE; img.setImageURI(android.net.Uri.parse(msg.imageUri)); tv.visibility = if (msg.text.isBlank()) View.GONE else View.VISIBLE } 
                      else { img.visibility = View.GONE; tv.visibility = View.VISIBLE }
                      
                      tv.text = msg.text; tv.textSize = if (getItemViewType(pos) == TYPE_SYSTEM) (fontSize - 2).toFloat() else fontSize.toFloat()
                      bubble.setOnLongClickListener { copyToClipboard("已复制文字", msg.text); true }
                  }
                  override fun getItemCount() = messages.size
              }

              inner class HistoryAdapter : RecyclerView.Adapter<HistoryAdapter.VH>() {
                  private var items = listOf<ChatSession>()
                  var onItemClick: ((ChatSession) -> Unit)? = null; var onItemLongClick: ((ChatSession) -> Unit)? = null
                  fun updateList(list: List<ChatSession>) { items = list; notifyDataSetChanged() }
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                      val tv = TextView(parent.context); tv.layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      tv.setPadding(48, 38, 48, 38); tv.textSize = 15f; tv.setTextColor(ContextCompat.getColor(this@MainActivity, R.color.black)); tv.setMaxWidth(parent.width - 96); tv.maxLines = 1; tv.setEllipsize(android.text.TextUtils.TruncateAt.END)
                      return VH(tv)
                  }
                  override fun onBindViewHolder(holder: VH, pos: Int) { (holder.itemView as TextView).text = items[pos].preview }
                  override fun getItemCount() = items.size
                  inner class VH(itemView: View) : RecyclerView.ViewHolder(itemView) { init { itemView.setOnClickListener { val pos = bindingAdapterPosition; if (pos != RecyclerView.NO_POSITION) onItemClick?.invoke(items[pos]) }; itemView.setOnLongClickListener { val pos = bindingAdapterPosition; if (pos != RecyclerView.NO_POSITION) onItemLongClick?.invoke(items[pos]); true } } }
              }
          }
          KT_EOF

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -eo pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain > build_log.txt 2>&1 || {
            echo "BUILD FAILED!"; tail -n 50 build_log.txt; exit 1
          }

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 李尔聊天机器人-终极体验版
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
