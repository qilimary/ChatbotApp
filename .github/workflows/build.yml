name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Download Data
        run: |
          pip install flet gdown
          echo "==== 开始从云盘下载文件 ===="
          gdown "https://drive.google.com/uc?id=1GudOlOQ5vIn7YKzkBl-J36U9kdXk2Avc" -O data.zip
          
          echo "==== 开始解压 ===="
          unzip -o data.zip

      - name: Preprocess & Build APK
        run: |
          echo "==== 寻找包含 main.py 的真实项目目录 ===="
          # 自动寻找 main.py，防止被外层文件夹包裹
          PROJECT_DIR=$(dirname $(find . -name "main.py" | head -n 1))
          if [ -z "$PROJECT_DIR" ]; then
            echo "错误：没有在压缩包中找到 main.py！"
            exit 1
          fi
          echo "进入目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          echo "==== 自动生成配置以跳过交互式提问 ===="
          # 改用 echo 追加写入，彻底避免 EOF 缩进导致的 Bash 语法错误
          if [ ! -f "flet.toml" ]; then
            echo 'name = "FletApp"' > flet.toml
            echo 'description = "My Flet Application"' >> flet.toml
            echo 'version = "1.0.0"' >> flet.toml
            echo "已自动生成配置文件 flet.toml"
          fi
          
          echo "==== 开始静默打包 APK ===="
          # 使用 yes 命令自动回答所有询问
          yes "" | flet build apk -v
          
          echo "==== 提取最终的 APK 文件 ===="
          # 将打包好的文件统一挪到安全目录提取
          mkdir -p $GITHUB_WORKSPACE/output_apk
          find build/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output_apk/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chatbot-Release-APK
          path: output_apk/*.apk
