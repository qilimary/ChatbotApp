Name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Download Data
        run: |
          pip install flet gdown
          echo "==== 开始从云盘下载文件 ===="
          # 下载 data.zip 到当前根目录，注意：这里绝对不运行 unzip 解压！
          gdown "https://drive.google.com/uc?id=1GudOlOQ5vIn7YKzkBl-J36U9kdXk2Avc" -O data.zip

      - name: Preprocess & Build APK
        run: |
          echo "==== 寻找包含 main.py 的真实项目目录 ===="
          PROJECT_DIR=$(dirname $(find . -name "main.py" | head -n 1))
          if [ -z "$PROJECT_DIR" ]; then
            echo "错误：没有在项目中找到 main.py！"
            exit 1
          fi
          
          echo "==== 将 data.zip 移动到 main.py 同级目录下 ===="
          # 确保 Flet 打包时能把 data.zip 作为资产塞进 APK 内部
          mv data.zip "$PROJECT_DIR/"
          
          echo "进入目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          echo "==== 自动生成配置以跳过交互式提问 ===="
          if [ ! -f "flet.toml" ]; then
            echo 'name = "FletApp"' > flet.toml
            echo 'description = "My Flet Application"' >> flet.toml
            echo 'version = "1.0.0"' >> flet.toml
            echo "已自动生成配置文件 flet.toml"
          fi
          
          echo "==== 开始静默打包 APK ===="
          yes "" | flet build apk -v
          
          echo "==== 提取最终的 APK 文件 ===="
          mkdir -p $GITHUB_WORKSPACE/output_apk
          find build/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output_apk/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chatbot-Release-APK
          path: output_apk/*.apk
