name: Build Android App

on:
  push:
    branches: [ "main" ]  # 核心修改：只要代码有改动并保存，就会自动运行
  workflow_dispatch:      # 保留这个，以便你想手动点的时候还能点

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Download Data
        run: |
          pip install flet gdown
          echo "==== 开始从云盘下载文件 ===="
          gdown "https://drive.google.com/uc?id=1GudOlOQ5vIn7YKzkBl-J36U9kdXk2Avc" -O data.zip
          
          echo "==== 检查下载的文件大小 ===="
          ls -lh data.zip
          
          echo "==== 开始解压文件 ===="
          unzip -o data.zip
          
          echo "==== 查看当前目录的所有文件，确认解压是否成功 ===="
          ls -la

      - name: Build APK (Verbose Mode)
        run: |
          echo "==== 开始打包 APK (已开启详细日志模式) ===="
          flet build apk -v

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chatbot-Release-APK
          path: build/apk/**/*.apk
